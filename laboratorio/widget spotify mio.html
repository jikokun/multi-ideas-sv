<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Dynamic Island - Glow Edition (Jikokun Standalone Widget)</title>
    <!-- Vibrant.js CDN Oficial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/node-vibrant/3.1.6/vibrant.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        :root {
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --dynamic-color: #00cfa1; 
            --dynamic-rgb: 0, 207, 161;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Contenedor Flotante Centrado y Auto-adaptable */
        .island-wrapper {
            position: relative;
            margin: auto;
            opacity: 1;
            transition: opacity 0.8s ease, transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            padding: 10px;
        }
        
        .island-wrapper.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- TEXTO "REPRODUCIENDO" FLOTANTE --- */
        .now-playing-label {
            order: -1;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.2px;
            color: var(--dynamic-color);
            text-shadow: 0 0 10px rgba(var(--dynamic-rgb), 0.85);
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 5;
            white-space: nowrap;
        }

        /* Cuando la isla se cierra, el texto se vuelve blanco, pequeño y sutil */
        .island.closed ~ .now-playing-label,
        .island-wrapper.is-closed .now-playing-label {
            margin-bottom: 5px;
            font-size: 9px;
            color: #ffffff;
            text-shadow: none;
            opacity: 0.65;
        }

        /* --- LA ISLA PRINCIPAL --- */
        .island {
            background-color: rgba(15, 15, 15, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--dynamic-color);
            border-radius: 36px;
            display: flex;
            align-items: center;
            position: relative;
            padding: 12px;
            width: 360px;
            height: 80px;
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* --- EL RESPLANDOR ANIMADO (MAGIA CSS) --- */
        .island::before {
            content: '';
            position: absolute;
            inset: -4px; 
            border-radius: 40px;
            background: linear-gradient(90deg, transparent, var(--dynamic-color), transparent, var(--dynamic-color));
            background-size: 200% 200%;
            filter: blur(10px);
            z-index: -1;
            animation: moveGlow 2.5s linear infinite;
            opacity: 0.85;
            transition: all 0.7s ease;
        }

        @keyframes moveGlow {
            0% { background-position: 200% 50%; }
            100% { background-position: -200% 50%; }
        }

        /* --- LA ISLA (ESTADO CERRADO / MINIMALISTA) --- */
        .island.closed {
            width: 220px; 
            height: 36px; 
            padding: 6px 14px 6px 8px;
            border-radius: 30px;
        }

        .island.closed::before {
            inset: -2px;
            border-radius: 34px;
            filter: blur(6px);
            opacity: 0.55;
        }

        /* Portada del disco */
        .cover {
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 60px;
            height: 60px;
            margin-right: 14px;
            background: #111;
        }

        .island.closed .cover {
            width: 24px;
            height: 24px;
            border-radius: 50%; 
            margin-right: 10px;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        /* --- LÓGICA DE COLORES DEL TEXTO --- */
        .song-name {
            color: var(--dynamic-color);
            font-weight: 700;
            font-size: 16px;
            text-overflow: ellipsis;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .island.closed .song-name {
            color: #ffffff; 
            font-size: 12.5px;
            font-weight: 600;
        }

        .artist-name {
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 500;
            margin-top: 3px;
            text-overflow: ellipsis;
            overflow: hidden;
            transition: all 0.4s ease;
            opacity: 1;
            max-height: 20px;
        }

        .island.closed .artist-name {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div id="wrapper" class="island-wrapper hidden">
        <div class="now-playing-label" id="playing-label">Reproduciendo</div>
        <div id="island" class="island closed">
            <div class="cover">
                <img id="albumCover" src="" crossorigin="anonymous" alt="Portada" />
            </div>
            <div class="info">
                <div id="name" class="song-name">Cargando...</div>
                <div id="artists" class="artist-name">Spotify</div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CREDENCIALES PRIVADAS & SPOTIFY DEVELOPER API
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const usuario = urlParams.get('user') || localStorage.getItem('spotify_user') || 'jikokun2';
        let access_token = urlParams.get('token') || localStorage.getItem('spotify_access_token') || 'BQCLkihh1c6hAuLEuR7aWBlBVRiWc48vnq7Gc6EZplicJZ5Zlsu8B2YO03rEFpIYb3hjCumlwbSLr83G6XYwIGEJEyiboDD3vc058Z9ML8V3LjAI-RxVM917-5kq9H3OuNHorDgNa8QGpD__uWN1Nc2OmwoSvV0lHEvmMjevCJsZgTVvzyx1D0f-6byuFLpkgSBKWWjEhmDKoI7u362VzHqdL6-HgeO305AUk0a5FQW-Z_BiZ52GbQp9gShTAxabUFMIuqE5FPaqd6dOImxvqvYuZKYZq8acXlyikBe4NI5-RkwXj1-I3g';
        const refresh_token = urlParams.get('refresh') || localStorage.getItem('spotify_refresh_token') || 'AQDTO6kUDxZFrHeEg9BNOQYdLSyVjYfuWj1wRWIjoMZF5dhvA2hgL2I_6_RMXNVImEyoR2Dy-gkNQGzzkZNykcueqA7lrofKaH8AjaeaaoRQ6z4_kuiFCw3LvaKdzSEEt0E';

        // Sincronización en vivo con Login de Spotify en el sitio web (BroadcastChannel)
        try {
            const spotifyBc = new BroadcastChannel("spotify_auth_channel");
            spotifyBc.onmessage = (e) => {
                if (e.data && e.data.access_token) {
                    access_token = e.data.access_token;
                    localStorage.setItem("spotify_access_token", access_token);
                    checkSpotifyPlayer();
                }
            };
        } catch (e) {}

        // ==========================================
        // VARIABLES DE CONTROL
        // ==========================================
        let lastSongId = "";
        let isWidgetVisible = false;
        let pauseTimeout = null;
        let islandShrinkTimeout = null;

        const island = document.getElementById('island');
        const wrapper = document.getElementById('wrapper');

        // ==========================================
        // AUTO-ESCALADO RESPONSIVO PARA OBS STUDIO
        // Garantiza que al moverlo o redimensionarlo en OBS nunca se corte
        // ==========================================
        function autoScaleIsland() {
            if (!wrapper) return;
            const targetW = 400;
            const targetH = 135;
            const scaleX = window.innerWidth / targetW;
            const scaleY = window.innerHeight / targetH;
            const scale = Math.min(scaleX, scaleY, 1);
            if (scale < 0.99) {
                wrapper.style.transform = `scale(${scale})`;
            } else {
                wrapper.style.transform = '';
            }
        }
        window.addEventListener('resize', autoScaleIsland);
        autoScaleIsland();

        // ==========================================
        // LÓGICA DE AUTO-OCULTADO (10s PAUSA)
        // ==========================================
        function handlePause() {
            if (!pauseTimeout && isWidgetVisible) {
                pauseTimeout = setTimeout(() => {
                    wrapper.classList.add('hidden');
                    isWidgetVisible = false;
                }, 10000); 
            }
        }

        function handlePlay() {
            if (pauseTimeout) {
                clearTimeout(pauseTimeout);
                pauseTimeout = null;
            }
            if (!isWidgetVisible) {
                wrapper.classList.remove('hidden');
                isWidgetVisible = true;
            }
        }

        // ==========================================
        // ANIMACIÓN DE LA ISLA
        // ==========================================
        function triggerIslandAnimation() {
            island.classList.remove('closed');
            wrapper.classList.remove('is-closed');
            
            if (islandShrinkTimeout) clearTimeout(islandShrinkTimeout);
            
            islandShrinkTimeout = setTimeout(() => {
                island.classList.add('closed');
                wrapper.classList.add('is-closed');
            }, 8000); 
        }

        // ==========================================
        // EXTRACCIÓN ROBUSTA DE COLORES (VIBRANT.JS)
        // ==========================================
        function applyDynamicColors(imageUrl) {
            if (typeof Vibrant === 'undefined' || !imageUrl) return;
            try {
                Vibrant.from(imageUrl).getPalette().then(palette => {
                    let colorHex = palette && palette.Vibrant ? palette.Vibrant.getHex() : 
                                   (palette && palette.LightVibrant ? palette.LightVibrant.getHex() : '#00cfa1');
                    
                    document.documentElement.style.setProperty('--dynamic-color', colorHex);
                    
                    let r = parseInt(colorHex.slice(1, 3), 16) || 0,
                        g = parseInt(colorHex.slice(3, 5), 16) || 207,
                        b = parseInt(colorHex.slice(5, 7), 16) || 161;
                    document.documentElement.style.setProperty('--dynamic-rgb', `${r}, ${g}, ${b}`);
                }).catch(err => {
                    document.documentElement.style.setProperty('--dynamic-color', '#00cfa1');
                    document.documentElement.style.setProperty('--dynamic-rgb', '0, 207, 161');
                });
            } catch (err) {
                // Error capturado sin bloquear la ejecución
            }
        }

        // ==========================================
        // MODO DEMO / CALIBRACIÓN PARA STREAMERS EN OBS
        // Permite ver y mover el widget con ?test=1 o presionando 'T'
        // ==========================================
        function showDemoTrack() {
            handlePlay();
            document.getElementById('name').textContent = "Jikokun Radio (Demo)";
            document.getElementById('artists').textContent = "Buena Música • En Vivo";
            document.getElementById('albumCover').src = "https://res.cloudinary.com/dn6fmqae9/image/upload/v1784994271/logoestatico_my0ws0.webp";
            document.documentElement.style.setProperty('--dynamic-color', '#00cfa1');
            document.documentElement.style.setProperty('--dynamic-rgb', '0, 207, 161');
            triggerIslandAnimation();
        }

        if (urlParams.get('test') === '1' || urlParams.get('preview') === '1' || urlParams.get('demo') === '1') {
            showDemoTrack();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T' || e.key === 'p' || e.key === 'P') {
                showDemoTrack();
            }
        });
        window.addEventListener('dblclick', showDemoTrack);

        // ==========================================
        // CONEXIÓN A SPOTIFY API
        // ==========================================
        async function checkSpotifyPlayer() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode', {
                    headers: { 'Authorization': `Bearer ${access_token}` }
                });

                if (res.status === 401) {
                    await refreshSpotifyToken();
                    return;
                }

                if (res.status === 204) {
                    handlePause();
                    return;
                }

                if (res.status === 200) {
                    const data = await res.json();
                    
                    if (!data.is_playing) {
                        handlePause();
                    } else {
                        handlePlay();
                        
                        if (data.item && data.item.id !== lastSongId) {
                            lastSongId = data.item.id;
                            
                            const songName = data.item.name || "Desconocido";
                            const artistName = (data.item.artists && data.item.artists[0]) ? data.item.artists[0].name : "Artista";
                            const albumCoverUrl = (data.item.album && data.item.album.images && data.item.album.images.length > 0) 
                                ? data.item.album.images[0].url 
                                : "https://res.cloudinary.com/dn6fmqae9/image/upload/v1784994271/logoestatico_my0ws0.webp";

                            document.getElementById('name').textContent = songName;
                            document.getElementById('artists').textContent = artistName;
                            document.getElementById('albumCover').src = albumCoverUrl;

                            applyDynamicColors(albumCoverUrl);
                            triggerIslandAnimation();
                        }
                    }
                }
            } catch (e) {
                // Silencioso ante pérdidas temporales de conexión
            }
        }

        let isRefreshing = false;
        async function refreshSpotifyToken() {
            if (isRefreshing) return;
            isRefreshing = true;
            try {
                const res = await fetch(`https://sensunshopweb.web.app/spotify/refresh_token?user=${encodeURIComponent(usuario)}`, { cache: 'no-store' });
                if (res.ok) {
                    const newToken = (await res.text()).trim();
                    if (newToken && !newToken.includes("<") && newToken.length > 20) { 
                        access_token = newToken;
                        localStorage.setItem("spotify_access_token", newToken);
                        checkSpotifyPlayer(); 
                    }
                }
            } catch (error) {
                console.error("[Spotify Dynamic Island] Error renovando token desde backend propio:", error);
            } finally {
                isRefreshing = false;
            }
        }

        // ==========================================
        // INICIO DEL BUCLE
        // ==========================================
        checkSpotifyPlayer();
        setInterval(checkSpotifyPlayer, 3000); 

    </script>
</body>
</html>
