/* ==========================================================================
   WIDGET CUMPLEAÑOS 1M - JIKOKUN
   Resolución Nativa 1920x1080 | Optimizado para OBS Studio Browser Source
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@700;900&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Outfit:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Russo+One&family=Titan+One&display=swap');

:root {
  --font-title: 'Outfit', sans-serif;
  --font-impact: 'Montserrat', sans-serif;
  --font-tech: 'Rajdhani', sans-serif;
  --font-bday: 'Titan One', 'Fredoka', cursive, sans-serif;

  --neon-cyan: #00f5d4;
  --neon-blue: #00e5ff;
  --neon-pink: #ff007f;
  --neon-purple: #7928ca;
  --neon-gold: #ffd166;
  --neon-lime: #53fc18;
  --neon-orange: #ff5e00;

  --bg-dark-glass: rgba(5, 12, 22, 0.88);
  --border-cyan-glow: 0 0 25px rgba(0, 245, 212, 0.6);
  --border-pink-glow: 0 0 25px rgba(255, 0, 127, 0.6);
  --border-gold-glow: 0 0 35px rgba(255, 209, 102, 0.8);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  user-select: none;
  font-family: var(--font-title);
  color: #ffffff;
}

/* ==========================================================================
   ESCENARIO NATIVO 1920x1080 (AUTO-ESCALADO RESPONSIVO 16:9)
   ========================================================================== */
#overlay-stage {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1920px;
  height: 1080px;
  transform-origin: center center;
  transform: translate(-50%, -50%) scale(1);
  overflow: hidden;
  pointer-events: none; /* Dejar pasar clicks a OBS por defecto */
}

/* Lienzo Canvas principal de Fuegos Artificiales y Globos */
#fireworks-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 1920px;
  height: 1080px;
  pointer-events: none;
  z-index: 10;
}

/* ==========================================================================
   HACES DE LUCES DE CONCIERTO / FIESTA SKA (STAGE LIGHTS & SPOTLIGHTS)
   Efecto de iluminación de escenario enérgico y dinámico al compás musical
   ========================================================================== */
#stage-lights-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 1920px;
  height: 1080px;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.8s ease;
  mix-blend-mode: screen;
}

#stage-lights-container.lights-active {
  opacity: 1;
}

.spotlight-beam {
  position: absolute;
  top: -60px;
  width: 360px;
  height: 1200px;
  transform-origin: top center;
  clip-path: polygon(46% 0, 54% 0, 100% 100%, 0% 100%);
  pointer-events: none;
  opacity: 0.35;
  filter: blur(10px);
  transition: opacity 0.15s ease, filter 0.15s ease;
}

/* Foco 1 (Izquierda Extrema - Neón Cyan) */
.beam-left-1 {
  left: 120px;
  background: linear-gradient(180deg, rgba(0, 245, 212, 0.8) 0%, rgba(0, 245, 212, 0.25) 50%, rgba(0, 229, 255, 0.08) 80%, transparent 100%);
  animation: sweepLeft1 3.2s ease-in-out infinite;
}

/* Foco 2 (Izquierda Media - Magenta Eléctrico) */
.beam-left-2 {
  left: 450px;
  background: linear-gradient(180deg, rgba(255, 0, 127, 0.8) 0%, rgba(255, 0, 127, 0.25) 50%, rgba(255, 94, 0, 0.08) 80%, transparent 100%);
  animation: sweepLeft2 2.8s ease-in-out infinite;
}

/* Foco 3 (Centro - Oro Festivo) */
.beam-center-1 {
  left: 960px;
  margin-left: -180px;
  background: linear-gradient(180deg, rgba(255, 209, 102, 0.85) 0%, rgba(255, 209, 102, 0.25) 50%, rgba(255, 153, 0, 0.08) 80%, transparent 100%);
  animation: sweepCenter 3.6s ease-in-out infinite;
}

/* Foco 4 (Derecha Media - Verde Neón Kick) */
.beam-right-1 {
  left: 1380px;
  background: linear-gradient(180deg, rgba(83, 252, 24, 0.8) 0%, rgba(83, 252, 24, 0.25) 50%, rgba(0, 245, 212, 0.08) 80%, transparent 100%);
  animation: sweepRight1 2.9s ease-in-out infinite;
}

/* Foco 5 (Derecha Extrema - Púrpura Cyber) */
.beam-right-2 {
  left: 1680px;
  background: linear-gradient(180deg, rgba(121, 40, 202, 0.8) 0%, rgba(121, 40, 202, 0.25) 50%, rgba(255, 0, 127, 0.08) 80%, transparent 100%);
  animation: sweepRight2 3.4s ease-in-out infinite;
}

/* Animaciones de barrido de focos móviles */
@keyframes sweepLeft1 {
  0% { transform: rotate(-26deg); }
  50% { transform: rotate(16deg); }
  100% { transform: rotate(-26deg); }
}

@keyframes sweepLeft2 {
  0% { transform: rotate(18deg); }
  50% { transform: rotate(-22deg); }
  100% { transform: rotate(18deg); }
}

@keyframes sweepCenter {
  0% { transform: rotate(-18deg); }
  50% { transform: rotate(18deg); }
  100% { transform: rotate(-18deg); }
}

@keyframes sweepRight1 {
  0% { transform: rotate(-16deg); }
  50% { transform: rotate(24deg); }
  100% { transform: rotate(-16deg); }
}

@keyframes sweepRight2 {
  0% { transform: rotate(25deg); }
  50% { transform: rotate(-18deg); }
  100% { transform: rotate(25deg); }
}

/* Pulso de intensidad de los focos con los beats */
.spotlight-beam.beam-hit {
  opacity: 0.85 !important;
  filter: blur(6px) !important;
}

/* Resplandor ambiental de borde al ritmo de bombo y vientos */
#ambient-beat-glow {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  box-shadow: inset 0 0 60px rgba(0, 245, 212, 0);
  transition: box-shadow 0.1s ease-out;
}

#ambient-beat-glow.glow-bass {
  box-shadow: inset 0 0 130px rgba(255, 0, 127, 0.45), inset 0 0 45px rgba(255, 209, 102, 0.5);
}

#ambient-beat-glow.glow-horns {
  box-shadow: inset 0 0 130px rgba(0, 245, 212, 0.45), inset 0 0 45px rgba(83, 252, 24, 0.5);
}

/* Flash de Clímax para Explosión Final */
#screen-flash {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255, 255, 255, 0.95) 0%, rgba(255, 209, 102, 0.7) 40%, rgba(0, 245, 212, 0.2) 80%, transparent 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 50;
  transition: opacity 0.08s ease-out;
}

/* ==========================================================================
   FRASES NARRATIVAS PROGRESIVAS (PREVIAS AL GRAN FELIZ CUMPLEAÑOS)
   ========================================================================== */
#narrative-phrase-box {
  position: absolute;
  top: 140px;
  left: 50%;
  transform: translateX(-50%) scale(1);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 35;
  pointer-events: none;
  width: auto;
  max-width: 1800px;
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

#narrative-phrase-box.phrase-hidden {
  opacity: 0;
  visibility: hidden;
  transform: translateX(-50%) scale(0.6);
}

.phrase-text {
  font-family: var(--font-bday);
  font-size: 48px;
  font-weight: normal;
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
  width: auto;
  line-height: 1.1;
  text-align: center;
  transition: all 0.3s ease;
}

/* Temas específicos para cada una de las 3 frases (con contorno sobrio + resplandor vibrante + movimiento dinámico) */
.phrase-theme-1 {
  background: linear-gradient(90deg, #00f5d4 0%, #00e5ff 30%, #ffffff 55%, #ffd166 85%, #00f5d4 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: 
    drop-shadow(-1.2px -1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(1.2px -1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(-1.2px 1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(1.2px 1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(0 3px 8px rgba(0, 0, 0, 0.7))
    drop-shadow(0 0 20px rgba(0, 245, 212, 0.7));
  animation: dynamicPhrase1 2.4s ease-in-out infinite alternate;
}

@keyframes dynamicPhrase1 {
  0% { transform: translateY(0) scale(0.98); background-position: 0% center; }
  50% { transform: translateY(-6px) scale(1.01); }
  100% { transform: translateY(0) scale(1.02); background-position: 100% center; }
}

.phrase-theme-2 {
  background: linear-gradient(90deg, #ff007f 0%, #ff5e00 25%, #ffd166 50%, #7928ca 80%, #ff007f 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: 
    drop-shadow(-1.2px -1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(1.2px -1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(-1.2px 1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(1.2px 1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(0 3px 8px rgba(0, 0, 0, 0.7))
    drop-shadow(0 0 20px rgba(255, 0, 127, 0.7));
  animation: dynamicPhrase2 2.2s ease-in-out infinite alternate;
}

@keyframes dynamicPhrase2 {
  0% { transform: translateY(0) scale(0.98); background-position: 0% center; }
  50% { transform: translateY(-7px) scale(1.02); }
  100% { transform: translateY(0) scale(1.01); background-position: 100% center; }
}

.phrase-theme-3 {
  background: linear-gradient(90deg, #ffd166 0%, #ff9900 25%, #53fc18 50%, #00f5d4 75%, #ffd166 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: 
    drop-shadow(-1.2px -1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(1.2px -1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(-1.2px 1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(1.2px 1.2px 0 rgba(2, 8, 18, 0.95))
    drop-shadow(0 3px 8px rgba(0, 0, 0, 0.7))
    drop-shadow(0 0 20px rgba(83, 252, 24, 0.7));
  animation: dynamicPhrase3 1.8s ease-in-out infinite alternate;
}

@keyframes dynamicPhrase3 {
  0% { transform: translateY(0) scale(0.97); background-position: 0% center; }
  50% { transform: translateY(-8px) scale(1.03); }
  100% { transform: translateY(0) scale(1.02); background-position: 100% center; }
}

/* Efecto de salida 1: Explosión de letras (la caja se desvanece de golpe con destello mientras el canvas detona partículas) */
.phrase-shatter-out {
  opacity: 0 !important;
  transform: translateX(-50%) scale(1.3) !important;
  filter: brightness(3.5) blur(10px) !important;
  transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) !important;
}

/* Efecto de salida 2: Vórtice e implosión gravitacional a un punto singular */
.phrase-vortex-out {
  opacity: 0 !important;
  transform: translateX(-50%) scale(0) rotate(720deg) !important;
  filter: brightness(4) blur(15px) !important;
  transition: all 0.65s cubic-bezier(0.55, 0.055, 0.675, 0.19) !important;
}

/* Efecto de salida 3: Disolución radiante hacia la Alborada */
.phrase-alborada-out {
  opacity: 0 !important;
  transform: translateX(-50%) scale(1.4) translateY(-30px) !important;
  filter: blur(20px) brightness(2.5) !important;
  transition: all 0.5s ease-out !important;
}

/* ==========================================================================
   GRAN BANNER CELEBRATORIO (ÚLTIMOS SEGUNDOS / FINAL FELIZ CUMPLEAÑOS)
   ========================================================================== */
#birthday-banner-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.4);
  width: 1400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

#birthday-banner-container.banner-visible {
  visibility: visible;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

#birthday-banner-container.banner-exit {
  opacity: 0;
  transform: translate(-50%, -50%) scale(1.6);
  filter: blur(25px) brightness(2.5);
  transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Medallón Central con Avatar y Corona */
.avatar-trophy-box {
  position: relative;
  width: 220px;
  height: 220px;
  margin-bottom: 24px;
}

.crown-icon {
  position: absolute;
  top: -46px;
  left: 50%;
  transform: translateX(-50%) rotate(-4deg);
  font-size: 64px;
  z-index: 5;
  filter: drop-shadow(0 0 20px #ffd166) drop-shadow(0 0 35px #ff5e00);
  animation: crownBob 2s ease-in-out infinite alternate;
}

@keyframes crownBob {
  0% { transform: translateX(-50%) rotate(-6deg) translateY(0); }
  100% { transform: translateX(-50%) rotate(6deg) translateY(-8px); }
}

.avatar-halo-ring {
  position: absolute;
  top: -12px;
  left: -12px;
  right: -12px;
  bottom: -12px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #ff007f,
    #ffd166,
    #53fc18,
    #00f5d4,
    #00e5ff,
    #7928ca,
    #ff007f
  );
  animation: ringRotate 4s linear infinite;
  box-shadow: 0 0 45px rgba(0, 245, 212, 0.8), 0 0 80px rgba(255, 0, 127, 0.6);
}

@keyframes ringRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.avatar-inner-wrapper {
  position: absolute;
  top: 6px;
  left: 6px;
  right: 6px;
  bottom: 6px;
  border-radius: 50%;
  background: #06111f;
  border: 4px solid #ffffff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

.avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.avatar-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 76px;
  font-weight: 900;
  color: #ffffff;
  background: linear-gradient(135deg, #00f5d4, #7928ca, #ff007f);
  text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
}

/* Insignia Chamfered "KICK VIP" */
.kick-badge-tag {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, #53fc18, #00f5d4);
  color: #031508;
  font-family: var(--font-tech);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  padding: 4px 18px;
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  box-shadow: 0 0 20px rgba(83, 252, 24, 0.7);
  white-space: nowrap;
}

/* ==========================================================================
   TIPOGRAFÍA GIGANTE MULTICOLOR
   ========================================================================== */
.banner-text-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.bday-dedication {
  font-family: var(--font-tech);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #ffd166;
  text-shadow: 
    0 0 12px rgba(255, 209, 102, 0.7),
    0 2px 4px rgba(0, 0, 0, 0.7);
  margin-bottom: 6px;
}

.bday-title-huge {
  font-family: 'Fredoka', 'Outfit', sans-serif;
  font-size: 92px;
  font-weight: 900;
  line-height: 1.2;
  padding: 8px 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
  background: linear-gradient(
    90deg,
    #ff007f 0%,
    #ff9900 20%,
    #ffd166 40%,
    #53fc18 60%,
    #00f5d4 80%,
    #00e5ff 90%,
    #ff007f 100%
  );
  background-size: 250% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowFlow 4s linear infinite;
  
  /* Borde exterior sobrio y nítido con drop-shadow (sin rayas internas ni triángulos en Z, A, P, Ñ) */
  filter: 
    drop-shadow(-2px -2px 0 rgba(4, 12, 24, 0.95))
    drop-shadow(2px -2px 0 rgba(4, 12, 24, 0.95))
    drop-shadow(-2px 2px 0 rgba(4, 12, 24, 0.95))
    drop-shadow(2px 2px 0 rgba(4, 12, 24, 0.95))
    drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8))
    drop-shadow(0 0 25px rgba(0, 245, 212, 0.6))
    drop-shadow(0 0 45px rgba(255, 0, 127, 0.45));
}

@keyframes rainbowFlow {
  0% { background-position: 0% center; }
  100% { background-position: 300% center; }
}

.bday-username-wrap {
  position: relative;
  margin-top: 14px;
  padding: 8px 48px;
  background: rgba(4, 15, 30, 0.85);
  border: 2px solid #00f5d4;
  border-radius: 60px;
  box-shadow: 0 0 35px rgba(0, 245, 212, 0.6), inset 0 0 25px rgba(0, 245, 212, 0.2);
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.bday-username {
  font-family: var(--font-title);
  font-size: 68px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 2px;
  text-shadow: 0 0 25px #00f5d4, 0 0 50px #00e5ff;
}

.sparkle-icon {
  font-size: 40px;
  animation: sparkleTwinkle 1s ease-in-out infinite alternate;
}

@keyframes sparkleTwinkle {
  0% { transform: scale(0.8) rotate(0deg); opacity: 0.7; }
  100% { transform: scale(1.2) rotate(25deg); opacity: 1; filter: drop-shadow(0 0 15px #ffd166); }
}

/* ==========================================================================
   PANEL FLOTANTE DE CONTROL Y PRUEBA (CONFIGURACIÓN / TEST DOCK)
   Pointer events activados exclusivamente en este panel
   ========================================================================== */
#test-control-panel {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 420px;
  background: var(--bg-dark-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0, 245, 212, 0.4);
  border-radius: 14px;
  padding: 16px 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), var(--border-cyan-glow);
  z-index: 9999;
  /* Oculto por defecto para no invadir la pantalla en transmisión */
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(20px) scale(0.95);
  transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0.25s;
}

/* Solo se habilita y muestra al tocar o hacer clic en la pantalla */
#test-control-panel.panel-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

#test-control-panel.collapsed {
  transform: translateX(calc(-100% + 48px));
  opacity: 0.6;
}

#test-control-panel.collapsed:hover {
  opacity: 1;
}

/* En modo OBS estricto (o con parámetro ?obs=1), se oculta totalmente */
body.obs-mode #test-control-panel,
#test-control-panel.hidden-completely {
  display: none !important;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 8px;
}

.panel-title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--neon-cyan);
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}

.panel-btns-header {
  display: flex;
  gap: 8px;
}

.btn-icon-tiny {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  border-radius: 6px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}

.btn-icon-tiny:hover {
  background: var(--neon-cyan);
  color: #000;
  border-color: var(--neon-cyan);
}

.panel-body {

  };

  document.addEventListener('DOMContentLoaded', () => {

    initKickPusherBackup();

  function initDOMElements() {
    stageEl = document.getElementById('overlay-stage');
    canvas = document.getElementById('fireworks-canvas');
