            },
            "MÍTICO": {
                className: "rarity-mitico",
                primary: "#ff0055",
                secondary: "#00f3ff",
                holoColor: "rgba(0, 243, 255, 0.75)"
            }
        };

        const OFFICIAL_BACKS = {
            "COMÚN": "https://lh3.googleusercontent.com/d/1ZXeStFshIwz17abshEZk2vN5S5U2spoP",
            "ESPECIAL": "https://lh3.googleusercontent.com/d/176O8_28j-BkbGQw-ZP6QkVj0uA5MPi2I",
            "RARO": "https://lh3.googleusercontent.com/d/1x4v_Ww6aALa0JCBW15Hjd2LEapiXEbro",
            "ÉPICO": "https://lh3.googleusercontent.com/d/1JBAM1EjFD_ABmAKiML89OYzDorURbFeM",
            "LEGENDARIO": "https://lh3.googleusercontent.com/d/1q_5d9qw09uI_Bpl1WppeYAFZEXwbUuHG",
            "MÍTICO": "https://lh3.googleusercontent.com/d/1OnQ1h9MO7SjwNiBhPDCNNt2tesa1-qrY"
        };

        // Constantes del mostrador 3D
        const BATCH_SIZE = 5;                  // Mostrador limitado estrictamente a 5 tarjetas
        const CAROUSEL_RADIUS = 280;           // Radio ideal y espacioso para 5 cartas
        let SHOWCASE_DURATION_MS = 15000;      // Duración de la exhibición al hacer clic

        // Estado del Widget
        let fullCollection = [];               // Todas las tarjetas de la colección activa
        let activeBatchCards = [];             // Las 5 tarjetas cargadas actualmente en el mostrador
        let currentBatchIndex = 0;             // Índice del lote actual (0, 1, 2...)
        let currentSlotIndex = 0;              // Índice de la tarjeta que está al frente dentro del lote (0 a 4)
        let turnsInCurrentBatch = 0;           // Cuántas cartas han pasado al frente en este lote
        let widgetState = 'CAROUSEL';          // 'CAROUSEL' | 'SHOWCASE' | 'EXITING' | 'TRANSITIONING' | 'EMPTY'
        
        let cycleStepTimer = null;             // Temporizador para la transición de giro entre cartas
        let centerPauseTimeout = null;         // Temporizador de pausa para admirar la carta al centro
        let showcaseTimeout = null;
        let countdownInterval = null;
        let cardElements = [];

        // Canal de sincronización
        const syncChannel = new BroadcastChannel('jikokun_tarjetas_channel');

        // Referencias DOM
        const carouselAnchor = document.getElementById('carousel-anchor');
        const carouselStage = document.getElementById('carousel-stage');
        const deckAura = document.getElementById('deck-aura');
        const timerHud = document.getElementById('timer-hud');
        const timerSeconds = document.getElementById('timer-seconds');
        const timerRarity = document.getElementById('timer-rarity');
        const timerBar = document.getElementById('timer-bar');
        const batchInfoText = document.getElementById('batch-info-text');
        const shockwave = document.getElementById('shockwave');
        const controlHud = document.getElementById('control-hud');
        const btnFastExit = document.getElementById('btn-fast-exit');
        const btnRestore = document.getElementById('btn-restore');

        // Configuración Global del Widget con Tiempos Personalizados Detallados
        let widgetConfig = {
            order: 'secuencial',
            position: 'centro',
            scale: 1.0,
            visibilityMode: 'ondemand', // Por defecto apagado / bajo demanda hasta activación
            ondemandDuration: 60,
            hideAfterShowcase: false,
            showcaseDuration: 15,     // Segundos en pantalla grande (80%)
            centerPauseTime: 3.5,     // Segundos para admirar detenidamente la carta al centro
            spinSpeed: 1.2,           // Velocidad de giro/órbita suave (segundos)
            fastRotateSpeed: 0.45     // Velocidad de giro rápido al recibir !rotar (segundos)
        };
        let ondemandTimer = null;
        let isSpecialQueryBatch = false;

        /**
         * Comprobar si el expositor está actualmente oculto en OBS
         */
        function isWidgetHidden() {
            if (!carouselAnchor) return true;
            return carouselAnchor.classList.contains('widget-hidden') || widgetState === 'EMPTY';
        }

        /**
         * Reiniciar o actualizar el temporizador de inactividad
         * Si no hay interacción durante 'ondemandDuration' segundos, el widget desaparece solo.
         */
        function resetInactivityTimer() {
            clearTimeout(ondemandTimer);
            ondemandTimer = null;

            // Se aplica en modo 'ondemand' o si el widget fue invocado temporalmente mientras estaba oculto
            const isOndemand = widgetConfig.visibilityMode === 'ondemand';
            if (!isOndemand && !isWidgetHidden()) return;

            const durationSec = parseInt(widgetConfig.ondemandDuration, 10) || 60;
            if (durationSec <= 0) return;

            ondemandTimer = setTimeout(() => {
                console.log(`[Tarjetero] ⏳ Tiempo de inactividad alcanzado (${durationSec}s sin interacción). Ocultando widget...`);
                if (widgetState === 'CAROUSEL') {
                    dismissWidget();
                }
            }, durationSec * 1000);
        }

        /**
         * Obtener todas las colecciones disponibles (locales y predeterminadas)
         */
        function getAllAvailableCollections() {
            let collections = {};
            const stored = localStorage.getItem('jikokun_tcg_all_collections');
            if (stored) {
                try {
                    collections = JSON.parse(stored);
                } catch(e) {}
            }
            if (!collections || Object.keys(collections).length === 0) {
                if (window.DEFAULT_JIKOKUN_COLLECTIONS) {
                    collections = JSON.parse(JSON.stringify(window.DEFAULT_JIKOKUN_COLLECTIONS));
                }
            } else if (window.DEFAULT_JIKOKUN_COLLECTIONS) {
                Object.keys(window.DEFAULT_JIKOKUN_COLLECTIONS).forEach(k => {
                    if (!collections[k]) collections[k] = window.DEFAULT_JIKOKUN_COLLECTIONS[k];
                });
            }
            return collections;
        }

        /**
         * Verificar si una carta coincide con la numeración consultada
         */
        function cardMatchesNumber(card, queryStr) {
            if (!card) return false;
            const cleanQ = queryStr.toString().replace(/^#/, '').trim().toLowerCase();
            const queryInt = parseInt(cleanQ, 10);

            const cardNumStr = (card.num !== undefined ? String(card.num) : '').replace(/^#/, '').trim().toLowerCase();
            const cardIdStr = (card.id !== undefined ? String(card.id) : '').trim().toLowerCase();
            const cardNumInt = parseInt(cardNumStr, 10);
            const cardIdInt = parseInt(cardIdStr, 10);

            if (cardNumStr === cleanQ || cardIdStr === cleanQ) return true;

            if (!isNaN(queryInt)) {
                if (!isNaN(cardNumInt) && cardNumInt === queryInt) return true;
                if (!isNaN(cardIdInt) && cardIdInt === queryInt) return true;
            }

            return false;
        }

        /**
         * Buscar cartas con una numeración específica en todas las colecciones
         */
        function findCardsMatchingNumber(queryStr) {
            const collections = getAllAvailableCollections();
            const matches = [];
            const seenKeys = new Set();

            // 1. Priorizar la colección activa actual
            (fullCollection || []).forEach(card => {
                if (cardMatchesNumber(card, queryStr)) {
                    const key = `${card.title || ''}_${card.num}_${card.frontImage}`;
                    if (!seenKeys.has(key)) {
                        seenKeys.add(key);
                        matches.push({ ...card, _sourceCollection: 'Colección Activa' });
                    }
                }
            });

            // 2. Buscar en las demás colecciones registradas
            Object.keys(collections).forEach(colId => {
                const col = collections[colId];
                const cards = col.cards || [];
                cards.forEach(card => {
                    if (cardMatchesNumber(card, queryStr)) {
                        const key = `${card.title || ''}_${card.num}_${card.frontImage}`;
                        if (!seenKeys.has(key)) {
                            seenKeys.add(key);
                            matches.push({ ...card, _sourceCollection: col.name || colId });
                        }
                    }
                });
            });

            // 3. Respaldo directo en constantes por defecto
            if (matches.length === 0) {
                if (window.DEFAULT_JIKOKUN_CARDS_00_33) {
                    window.DEFAULT_JIKOKUN_CARDS_00_33.forEach(card => {
                        if (cardMatchesNumber(card, queryStr)) {
                            const key = `${card.title || ''}_${card.num}_${card.frontImage}`;
                            if (!seenKeys.has(key)) {
                                seenKeys.add(key);
                                matches.push({ ...card, _sourceCollection: 'Colección 00-33' });
                            }
                        }
                    });
                }
                if (window.DEFAULT_JIKOKUN_CARDS_001_100) {
                    window.DEFAULT_JIKOKUN_CARDS_001_100.forEach(card => {
                        if (cardMatchesNumber(card, queryStr)) {
                            const key = `${card.title || ''}_${card.num}_${card.frontImage}`;
                            if (!seenKeys.has(key)) {
                                seenKeys.add(key);
                                matches.push({ ...card, _sourceCollection: 'Colección 001-100' });
                            }
                        }
                    });
                }
            }

            return matches;
        }

        /**
         * Manejar consulta directa por número de carta (!carta <numero>)
         * Si el carrusel está oculto o se especifica un número concreto:
         * - Si hay 1 carta: aparece directamente en pantalla grande por el tiempo establecido.
         * - Si hay varias de otras colecciones con el mismo número: carrusel sólo de esa numeración con 1..5.
         */
        function handleDirectCardQuery(rawArg, isHidden = false) {
            if (!rawArg) return false;
            const cleanArg = rawArg.toString().replace(/^!carta\s*/i, '').replace(/^#/, '').trim();
            if (!cleanArg) return false;

            console.log(`[TCG Query] 🔎 Buscando carta #${cleanArg} (Widget oculto: ${isHidden})`);
            const matches = findCardsMatchingNumber(cleanArg);

            if (matches.length === 0) {
                console.log(`[TCG Query] ⚠️ Ninguna carta coincide con #${cleanArg}`);
                return false;
            }

            // Despertar el widget si estaba oculto
            if (isWidgetHidden()) {
                if (carouselAnchor) carouselAnchor.classList.remove('widget-hidden');
            }

            if (matches.length === 1) {
                // EXACTAMENTE 1 CARTA: Mostrar directamente en pantalla grande (showcase)
                const card = matches[0];
                console.log(`[TCG Query] 🎯 1 coincidencia: "${card.title}" (#${card.num}). Mostrando en pantalla grande...`);

                const colIdx = (fullCollection || []).findIndex(c => cardMatchesNumber(c, cleanArg));
                if (colIdx !== -1) {
                    isSpecialQueryBatch = false;
                    const batchIdx = Math.floor(colIdx / BATCH_SIZE);
                    const slotIdx = colIdx % BATCH_SIZE;
                    mountBatch(batchIdx, true);
                    currentSlotIndex = slotIdx;
                    updateCarouselPositions();
                    setTimeout(() => selectCard(slotIdx), 320);
                } else {
                    isSpecialQueryBatch = true;
                    activeBatchCards = [card];
                    currentBatchIndex = 0;
                    currentSlotIndex = 0;
                    renderBatchCards(false);
                    updateCarouselPositions();
                    setTimeout(() => selectCard(0), 320);
                }
                resetInactivityTimer();
                return true;
            } else {
                // MÚLTIPLES CARTAS CON EL MISMO NÚMERO (distintas colecciones)
                // "si hay mas cartas de otras colecciones con el mismo numero entonces se mostrará un carrusel solo de la numeracion para asi ver cual es la que quieren ver usando siempre del 1 al 5"
                console.log(`[TCG Query] 🎴 ${matches.length} coincidencias para #${cleanArg}. Mostrando carrusel numerado (1..${Math.min(5, matches.length)})...`);
                isSpecialQueryBatch = true;
                activeBatchCards = matches.slice(0, BATCH_SIZE);
                currentBatchIndex = 0;
                currentSlotIndex = 0;
                turnsInCurrentBatch = 0;

                batchInfoText.textContent = `RESULTADOS #${cleanArg} (${activeBatchCards.length} COLECCIONES // USA !carta 1..${activeBatchCards.length})`;

                renderBatchCards(false);
                updateCarouselPositions();
                widgetState = 'CAROUSEL';
                startAutoCycle();
                resetInactivityTimer();
                return true;
            }
        }

        /**
         * Aplicar configuración visual del widget (Posición, Escala, Visibilidad, Tiempos)
         */
        function applyWidgetConfig(cfg) {
            if (!cfg) return;
            widgetConfig = { ...widgetConfig, ...cfg };

            if (widgetConfig.showcaseDuration) {
                SHOWCASE_DURATION_MS = widgetConfig.showcaseDuration * 1000;
            }

            // Actualizar velocidad CSS de rotación del carrusel
            if (carouselStage) {
                carouselStage.style.setProperty('--spin-transition', `${widgetConfig.spinSpeed || 1.2}s`);
            }

            // Reflejar en inputs del HUD si están en el DOM
            const hudPause = document.getElementById('hud-pause-time');
            if (hudPause && widgetConfig.centerPauseTime) {
                hudPause.value = widgetConfig.centerPauseTime;
            }
            const hudSpin = document.getElementById('hud-spin-speed');
            if (hudSpin && widgetConfig.spinSpeed) {
                hudSpin.value = widgetConfig.spinSpeed;
            }

            // 1. Aplicar posición automática en el lienzo
            if (carouselAnchor) {
                const targetPos = widgetConfig.position || 'centro';
                const positions = [
                    'pos-centro', 'pos-arriba-centro', 'pos-arriba-izquierda', 'pos-arriba-derecha',
                    'pos-izquierda-centro', 'pos-derecha-centro', 'pos-abajo-centro', 'pos-abajo-izquierda', 'pos-abajo-derecha'
                ];
                positions.forEach(p => carouselAnchor.classList.remove(p));
                carouselAnchor.classList.add(`pos-${targetPos}`);

                try {
                    localStorage.setItem('jikokun_tcg_config', JSON.stringify(widgetConfig));
                } catch(e) {}

                // 2. Aplicar escala proporcional
                carouselAnchor.style.setProperty('--carousel-scale', widgetConfig.scale || 1.0);
            }

            // 3. Aplicar modo de visibilidad (Por defecto apagado hasta recibir activación)
            const urlParams = new URLSearchParams(window.location.search);
            const isExplicitContinuous = urlParams.get('mode') === 'continuous';

            if (widgetConfig.visibilityMode === 'continuous' || isExplicitContinuous) {
                if (carouselAnchor) carouselAnchor.classList.remove('widget-hidden');
            } else {
                // Modo ondemand: permanece apagado a menos que esté actualmente activo o en exhibición
                if (widgetState !== 'SHOWCASE' && !ondemandTimer) {
                    if (carouselAnchor) carouselAnchor.classList.add('widget-hidden');
                    stopAutoCycle();
                }
            }

            // Si el widget está visible en pantalla, actualizar timer de inactividad
            if (!isWidgetHidden()) {
                resetInactivityTimer();
            }
        }

        /**
         * Hacer visible el widget al recibir activación de la web o comando (!tarjetasjikokun)
         */
        function summonWidget() {
            if (carouselAnchor) carouselAnchor.classList.remove('widget-hidden');
            if (widgetState === 'EMPTY') {
                resetCarousel();
            } else {
                widgetState = 'CAROUSEL';
                updateCarouselPositions();
                startAutoCycle();
            }

            resetInactivityTimer();
        }

        /**
         * Ocultar el widget de pantalla
         */
        function dismissWidget() {
            if (widgetState === 'SHOWCASE') return;
            stopAutoCycle();
            clearTimeout(ondemandTimer);
            ondemandTimer = null;
            if (carouselAnchor) carouselAnchor.classList.add('widget-hidden');
        }

        /**
         * Disparar aura luminosa sobre el paquete de cartas entrante
         */
        function triggerDeckAura() {
            const aura = document.getElementById('deck-aura');
            if (aura) {
                aura.classList.remove('active');
                void aura.offsetWidth;
                aura.classList.add('active');
                setTimeout(() => aura.classList.remove('active'), 1300);
            }
        }

        /**
         * Asignar carta al centro para activar su flotación y respiración viva en pausa
         */
        function setFrontCenterCard(index) {
            cardElements.forEach((slot, i) => {
                if (i === index) {
                    slot.classList.add('is-front-center');
                } else {
                    slot.classList.remove('is-front-center');
                }
            });
        }

        function removeFrontCenterCard() {
            cardElements.forEach(slot => slot.classList.remove('is-front-center'));
        }

        /**
         * Ciclo automático continuo y suave con pausa en el centro para admirar la carta
         */
        function startAutoCycle() {
            stopAutoCycle();
            if (widgetState !== 'CAROUSEL' || activeBatchCards.length === 0) return;

            // La carta actual al centro comienza a flotar y respirar suavemente
            setFrontCenterCard(currentSlotIndex);

            // Pausar los segundos configurados para que el espectador la admire
            const pauseMs = Math.max(800, (widgetConfig.centerPauseTime || 3.5) * 1000);
            centerPauseTimeout = setTimeout(() => {
                advanceCarouselStep();
            }, pauseMs);
        }

        /**
         * Avanzar el carrusel de manera suave hacia la siguiente carta
         */
        function advanceCarouselStep() {
            if (widgetState !== 'CAROUSEL' || activeBatchCards.length === 0) return;
            turnsInCurrentBatch++;

            // Si ya pasaron las 5 cartas de este lote al frente una vez, realizar cambio de lote
            if (turnsInCurrentBatch >= activeBatchCards.length) {
                transitionToNextBatch();
            } else {
                removeFrontCenterCard();
                currentSlotIndex = (currentSlotIndex + 1) % activeBatchCards.length;
                updateCarouselPositions();

                // Esperar a que concluya la rotación orbital suave
                const spinMs = Math.max(350, (widgetConfig.spinSpeed || 1.2) * 1000);
                cycleStepTimer = setTimeout(() => {
                    if (widgetState === 'CAROUSEL') {
                        setFrontCenterCard(currentSlotIndex);
                        const pauseMs = Math.max(800, (widgetConfig.centerPauseTime || 3.5) * 1000);
                        centerPauseTimeout = setTimeout(() => {
                            advanceCarouselStep();
                        }, pauseMs);
                    }
                }, spinMs);
            }
        }

        /**
         * Detener el ciclo automático (al hacer clic, comando manual o exhibición)
         */
        function stopAutoCycle() {
            clearTimeout(centerPauseTimeout);
            clearTimeout(cycleStepTimer);
            centerPauseTimeout = null;
            cycleStepTimer = null;
            removeFrontCenterCard();
        }

        /**
         * Giro rápido de las 5 cartas del lote al recibir !rotar
         */
        function fastRotateCurrentBatch() {
            if (widgetState !== 'CAROUSEL') return;
            stopAutoCycle();

            let count = activeBatchCards.length;
            const fastSpeed = widgetConfig.fastRotateSpeed || 0.45;
            const fastSpeedMs = Math.max(200, fastSpeed * 1000);

            // Acelerar temporalmente la transición CSS del carrusel
            carouselStage.style.setProperty('--spin-transition', `${fastSpeed}s`);

            const fastTimer = setInterval(() => {
                currentSlotIndex = (currentSlotIndex + 1) % activeBatchCards.length;
                updateCarouselPositions();
                count--;
                if (count <= 0) {
                    clearInterval(fastTimer);
                    // Restaurar velocidad normal de giro
                    carouselStage.style.setProperty('--spin-transition', `${widgetConfig.spinSpeed || 1.2}s`);
                    setTimeout(() => {
                        transitionToNextBatch();
                    }, fastSpeedMs + 120);
                }
            }, fastSpeedMs);
        }

        /**
         * Transición elegante y misteriosa al siguiente lote (Anti-Spoiler)
         * 1. Las cartas actuales se juntan al centro girando hacia su reverso.
         * 2. El mazo recogido sale hacia el fondo.
         * 3. El nuevo lote aparece como un MAZO CERRADO en el centro mostrando estrictamente
         *    el REVERSO OFICIAL (raro, épico, común, etc.) de una de las cartas que vienen.
         * 4. Desde ese mazo cerrado, las 5 cartas se expanden (Fan-Out) en 3D girando hacia
         *    el frente a sus respectivas órbitas, revelando el arte sin spoilers previos.
         */
        function transitionToNextBatch() {
            if (widgetState !== 'CAROUSEL' && widgetState !== 'EMPTY') return;
            widgetState = 'TRANSITIONING';
            stopAutoCycle();

            // Asegurar que el ancla del lienzo mantenga firmemente la posición configurada
            if (carouselAnchor) {
                carouselAnchor.classList.remove('showcase-center-override');
                const targetPos = widgetConfig.position || 'centro';
                const positions = [
                    'pos-centro', 'pos-arriba-centro', 'pos-arriba-izquierda', 'pos-arriba-derecha',
                    'pos-izquierda-centro', 'pos-derecha-centro', 'pos-abajo-centro', 'pos-abajo-izquierda', 'pos-abajo-derecha'
                ];
                positions.forEach(p => carouselAnchor.classList.remove(p));
                carouselAnchor.classList.add(`pos-${targetPos}`);
            }

            // 1. Las 5 cartas actuales se juntan en el centro girándose hacia su reverso
            carouselStage.classList.add('deck-gathering');

            setTimeout(() => {
                // 2. El mazo recogido sale hacia el fondo
                carouselStage.classList.remove('deck-gathering');
                carouselStage.classList.add('deck-exit');

                setTimeout(() => {
                    carouselStage.classList.remove('deck-exit');

                    // 3. Montar el nuevo lote directamente en modo MAZO CERRADO (reverso hacia el frente)
                    const totalBatches = Math.ceil(fullCollection.length / BATCH_SIZE);
                    currentBatchIndex = (currentBatchIndex + 1) % totalBatches;

                    const start = currentBatchIndex * BATCH_SIZE;
                    activeBatchCards = fullCollection.slice(start, start + BATCH_SIZE);
                    if (activeBatchCards.length < BATCH_SIZE && fullCollection.length >= BATCH_SIZE) {
                        const deficit = BATCH_SIZE - activeBatchCards.length;
                        activeBatchCards = activeBatchCards.concat(fullCollection.slice(0, deficit));
                    }

                    currentSlotIndex = 0;
                    turnsInCurrentBatch = 0;

                    const loteNum = currentBatchIndex + 1;
                    batchInfoText.textContent = `LOTE ${loteNum}/${totalBatches} (${activeBatchCards.length} CARTAS // TOTAL ${fullCollection.length})`;

                    // Renderizar con startInDeckStack = true (Cero caras frontales visibles)
                    renderBatchCards(true);
                    preloadNextBatchImages();

                    // Pequeño pulso de onda / brillo misterioso en el mazo cerrado
                    triggerDeckAura();

                    // 4. Mantener el paquete cerrado unos instantes para generar intriga
                    setTimeout(() => {
                        // Expandir (Fan-out) a posiciones orbitales girando al frente
                        cardElements.forEach(slot => slot.classList.remove('in-deck-stack'));
                        updateCarouselPositions();

                        const fanOutMs = Math.max(600, (widgetConfig.spinSpeed || 1.2) * 1000);
                        setTimeout(() => {
                            widgetState = 'CAROUSEL';
                            startAutoCycle();
                        }, fanOutMs);
                    }, 650);

                }, 480);
            }, 520);
        }

        /**
         * Cargar colección y aplicar orden configurado
         */
        async function loadCollection() {
            try {
                // 1. Verificar configuración guardada
                const storedConfig = localStorage.getItem('jikokun_tcg_config');
                let displayOrder = 'secuencial';
                if (storedConfig) {
                    try {
                        const cfg = JSON.parse(storedConfig);
                        applyWidgetConfig(cfg);
                        if (cfg.order) displayOrder = cfg.order;
                    } catch(e) {}
                }

                // 2. Cargar tarjetas de la colección activa
                const storedCards = localStorage.getItem('jikokun_tarjetas_data');
                if (storedCards) {
                    const parsed = JSON.parse(storedCards);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        fullCollection = parsed;
                    }
                }

                if (!fullCollection || fullCollection.length === 0) {
                    if (window.DEFAULT_JIKOKUN_CARDS_00_33 && window.DEFAULT_JIKOKUN_CARDS_00_33.length > 0) {
                        fullCollection = JSON.parse(JSON.stringify(window.DEFAULT_JIKOKUN_CARDS_00_33));
                    } else {
                        try {
                            const res = await fetch('../data/tarjetas_coleccion_00_33.json');
                            if (res.ok) fullCollection = await res.json();
                        } catch(fErr) {}
                    }
                }

                // 2.1 Respaldo final: si los archivos locales fallaran, consultar el script de Google Drive en vivo
                if (!fullCollection || fullCollection.length === 0) {
                    try {
                        const driveRes = await fetch('https://script.google.com/macros/s/AKfycbz5Zq7CYZTgrA6QoCAWCLzIRx-Y_fLyex_OMS124dCQPCxj-fJTd6okjS6Bovv4PT_w/exec?folder=tarjetas_jikokun');
                        if (driveRes.ok) {
                            const driveJson = await driveRes.json();
                            const subfolders = driveJson.data?.subfolders || [];
                            const colFolder = subfolders.find(s => s.name && (s.name.includes('00-33') || s.name.includes('00_33'))) || subfolders[0];
                            if (colFolder && colFolder.files) {
                                fullCollection = colFolder.files.map((file, i) => {
                                    const fn = file.name.replace(/\.png$/i, '');
                                    let rarity = 'COMÚN';
                                    const lower = fn.toLowerCase();
                                    if (lower.includes('ultra_rara') || lower.includes('mitic')) rarity = 'MÍTICO';
                                    else if (lower.includes('legendari')) rarity = 'LEGENDARIO';
                                    else if (lower.includes('epic')) rarity = 'ÉPICO';
                                    else if (lower.includes('rar')) rarity = 'RARO';
                                    else if (lower.includes('especial')) rarity = 'ESPECIAL';
                                    return {
                                        id: i,
                                        num: String(i).padStart(2, '0'),
                                        title: fn,
                                        rarity: rarity,
                                        frontImage: file.cdnUrl,
                                        backImage: OFFICIAL_BACKS[rarity] || OFFICIAL_BACKS['COMÚN']
                                    };
                                });
                            }
                        }
                    } catch(dErr) {
                        console.warn('[Tarjetero] Respaldo Drive no disponible:', dErr);
                    }
                }

                // 3. Aplicar orden (secuencial, aleatorio, rareza, inverso)
                applyCollectionOrder(displayOrder);

            } catch (err) {
                console.warn('[Tarjetero] Error al cargar la colección:', err);
            }
        }

        // ═══════════ SISTEMA DE PRECARGA Y CACHÉ ULTRA-RÁPIDO EN OBS ═══════════
        const tcgImageMemoryCache = new Map();

        function preloadSingleImage(url) {
            if (!url || tcgImageMemoryCache.has(url)) return;
            try {
                const img = new Image();
                img.decoding = 'async';
                img.src = url;
                if (img.decode) {
                    img.decode().catch(() => {});
                }
                tcgImageMemoryCache.set(url, img);
            } catch(e) {}
        }

        function preloadCollectionImages(cards) {
            if (!Array.isArray(cards) || cards.length === 0) return;
            console.log(`[Tarjetero Caché OBS] 🚀 Pre-cargando y decodificando ${cards.length} cartas y reversos en memoria...`);

            // 1. Pre-cargar todos los reversos oficiales en memoria
            const officialBackList = (typeof OFFICIAL_BACKS !== 'undefined') ? Object.values(OFFICIAL_BACKS) : [];
            officialBackList.forEach(url => preloadSingleImage(url));

            // 2. Pre-cargar portadas y contraportadas de cada carta de la colección
            cards.forEach(card => {
                if (card.frontImage) preloadSingleImage(card.frontImage);
                const rarityKey = (card.rarity || 'COMÚN').toUpperCase();
                const back = card.backImage || (typeof OFFICIAL_BACKS !== 'undefined' ? OFFICIAL_BACKS[rarityKey] : null);
                if (back) preloadSingleImage(back);
            });

            // 3. Cache Storage API para persistencia en disco de Chromium en OBS Studio
            if ('caches' in window) {
                try {
                    caches.open('jikokun-tcg-cache-v1').then(cache => {
                        const urlsToCache = [];
                        officialBackList.forEach(u => { if (u && u.startsWith('http')) urlsToCache.push(u); });
                        cards.forEach(card => {
                            if (card.frontImage && card.frontImage.startsWith('http')) urlsToCache.push(card.frontImage);
                            if (card.backImage && card.backImage.startsWith('http')) urlsToCache.push(card.backImage);
                        });

                        urlsToCache.forEach(u => {
                            cache.match(u).then(found => {
                                if (!found) {
                                    fetch(u, { mode: 'no-cors' })
                                        .then(resp => { if (resp) cache.put(u, resp); })
                                        .catch(() => {});
                                }
                            }).catch(() => {});
                        });
                    }).catch(() => {});
                } catch(e) {}
            }
        }

        function preloadNextBatchImages() {
            if (!fullCollection || fullCollection.length === 0) return;
            const totalBatches = Math.ceil(fullCollection.length / BATCH_SIZE);
            const nextIdx = (currentBatchIndex + 1) % totalBatches;
            const start = nextIdx * BATCH_SIZE;
            const nextCards = fullCollection.slice(start, start + BATCH_SIZE);
            nextCards.forEach(c => {
                if (c.frontImage) preloadSingleImage(c.frontImage);
                const rKey = (c.rarity || 'COMÚN').toUpperCase();
                const b = c.backImage || (typeof OFFICIAL_BACKS !== 'undefined' ? OFFICIAL_BACKS[rKey] : null);
                if (b) preloadSingleImage(b);
            });
        }

        /**
         * Aplicar orden a la colección
         */
        let currentAppliedOrder = null;

        function applyCollectionOrder(orderType, forceReset = false) {
            if (!fullCollection || fullCollection.length === 0) return;
            if (!forceReset && currentAppliedOrder === orderType) return;
            currentAppliedOrder = orderType;

            if (orderType === 'aleatorio') {
                for (let i = fullCollection.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [fullCollection[i], fullCollection[j]] = [fullCollection[j], fullCollection[i]];
                }
            } else if (orderType === 'rareza') {
                const ranks = { "MÍTICO": 6, "LEGENDARIO": 5, "ÉPICO": 4, "RARO": 3, "ESPECIAL": 2, "COMÚN": 1 };
                fullCollection.sort((a, b) => (ranks[b.rarity] || 0) - (ranks[a.rarity] || 0));
            } else if (orderType === 'inverso') {
                fullCollection.sort((a, b) => parseInt(b.num !== undefined ? b.num : b.id, 10) - parseInt(a.num !== undefined ? a.num : a.id, 10));
            } else {
                fullCollection.sort((a, b) => parseInt(a.num !== undefined ? a.num : a.id, 10) - parseInt(b.num !== undefined ? b.num : b.id, 10));
            }

            // Iniciar caché de imágenes inmediatamente para toda la colección
            preloadCollectionImages(fullCollection);

            currentBatchIndex = 0;
            currentSlotIndex = 0;
            turnsInCurrentBatch = 0;
            mountBatch(currentBatchIndex);
        }

        /**
         * Montar un lote específico de 5 tarjetas en el carrusel
         */
        function mountBatch(batchIdx, immediate = false) {
            if (fullCollection.length === 0) return;

            const totalBatches = Math.ceil(fullCollection.length / BATCH_SIZE);
            currentBatchIndex = batchIdx % totalBatches;

            const start = currentBatchIndex * BATCH_SIZE;
            activeBatchCards = fullCollection.slice(start, start + BATCH_SIZE);

            if (activeBatchCards.length < BATCH_SIZE && fullCollection.length >= BATCH_SIZE) {
                const deficit = BATCH_SIZE - activeBatchCards.length;
                activeBatchCards = activeBatchCards.concat(fullCollection.slice(0, deficit));
            }

            currentSlotIndex = 0;
            turnsInCurrentBatch = 0;

            const loteNum = currentBatchIndex + 1;
            batchInfoText.textContent = `LOTE ${loteNum}/${totalBatches} (${activeBatchCards.length} CARTAS // TOTAL ${fullCollection.length})`;

            if (immediate || isWidgetHidden()) {
                renderBatchCards(false);
                preloadNextBatchImages();
                updateCarouselPositions();
                if (!isWidgetHidden()) {
                    startAutoCycle();
                } else {
                    stopAutoCycle();
                }
            } else {
                // Entrada misteriosa anti-spoiler: aparece como mazo cerrado con su reverso y luego se expande
                renderBatchCards(true);
                preloadNextBatchImages();
                triggerDeckAura();
                setTimeout(() => {
                    cardElements.forEach(slot => slot.classList.remove('in-deck-stack'));
                    updateCarouselPositions();
                    const fanOutMs = Math.max(600, (widgetConfig.spinSpeed || 1.2) * 1000);
                    setTimeout(() => {
                        widgetState = 'CAROUSEL';
                        startAutoCycle();
                    }, fanOutMs);
                }, 550);
            }
        }

        /**
         * Renderizar las 5 tarjetas LIMPIAS (Sin texto, puro arte, marco, holograma y reverso oficial)
         */
        function renderBatchCards(startInDeckStack = false) {
            carouselStage.innerHTML = '';
            cardElements = [];

            activeBatchCards.forEach((card, index) => {
                const rarityKey = (card.rarity || 'COMÚN').toUpperCase();
                const rarityConfig = RARITY_STYLES[rarityKey] || RARITY_STYLES["COMÚN"];
                
                const slot = document.createElement('div');
                slot.className = `card-slot ${rarityConfig.className}${startInDeckStack ? ' in-deck-stack' : ''}`;
                slot.dataset.index = index;
                slot.dataset.id = card.id;
                slot.style.setProperty('--rarity-glow-primary', rarityConfig.holoColor);
                slot.style.setProperty('--stack-z', `${(4 - index) * 6}px`);

                const frontCoverUrl = card.frontImage || "";
                const backCoverUrl = card.backImage || OFFICIAL_BACKS[rarityKey] || OFFICIAL_BACKS["COMÚN"];

                // Estructura 100% limpia de texto para arte TCG completo + Badge con número de ranura (!carta 1..5)
                slot.innerHTML = `
                    <div class="card-rotator">
                        <!-- CARA FRONTAL (PORTADA LIMPIA SIN TEXTO) -->
                        <div class="card-face tcg-card-outer" style="background: linear-gradient(135deg, ${rarityConfig.primary}, rgba(255,255,255,0.45), ${rarityConfig.secondary});">
                            <div class="card-inner tcg-card-inner">
                                <div class="holo-sheen"></div>
                                <div class="absolute inset-1.5 tcg-card-art bg-slate-950 border border-white/10 overflow-hidden">
                                    <img src="${frontCoverUrl}" 
                                         alt="Carta Jikokun" 
                                         class="w-full h-full object-cover object-center transform hover:scale-105 transition duration-500"
                                         decoding="async"
                                         onerror="this.src='https://placehold.co/260x380/0f172a/00f3ff?text=JIKOKUN'">
                                </div>
                            </div>
                        </div>

                        <!-- CARA TRASERA (CONTRAPORTADA LIMPIA SIN TEXTO) -->
                        <div class="card-face card-back tcg-card-outer" style="background: linear-gradient(135deg, ${rarityConfig.secondary}, #1e1b4b, ${rarityConfig.primary});">
                            <div class="card-inner tcg-card-inner flex items-center justify-center bg-[#090d16] relative">
                                <div class="holo-sheen"></div>
                                <div class="absolute inset-1.5 tcg-card-art overflow-hidden bg-slate-950 border border-white/10">
                                    <img src="${backCoverUrl}" 
                                         alt="Contraportada" 
                                         class="w-full h-full object-cover object-center"
                                         decoding="async"
                                         onerror="this.src='https://placehold.co/260x380/090d16/ff0055?text=REVERSO'">
                                </div>
                            </div>
                        </div>

                        <!-- RECUADRO NUMÉRICO GRUESO ESTILO CONTENEDOR TCG (1..5) -->
                        <div class="card-slot-badge" data-slot="${index + 1}" title="Carta ${index + 1}">
                            <div class="badge-inner">
                                <span class="badge-num">${index + 1}</span>
                            </div>
                        </div>
                    </div>
                `;

                slot.addEventListener('click', () => handleCardClick(index));
                carouselStage.appendChild(slot);
                cardElements.push(slot);
            });
        }

        /**
         * Actualizar posiciones 3D para las 5 tarjetas en el carrusel
         */
        function updateCarouselPositions() {
            const total = cardElements.length;
            if (total === 0) return;

            if (widgetState === 'CAROUSEL' || widgetState === 'TRANSITIONING') {
                cardElements.forEach((slot, index) => {
                    slot.classList.remove('is-selected', 'epic-exit');
                    
                    // Cálculo de offset circular en el rango [-2, 2] para 5 tarjetas
                    let offset = (index - currentSlotIndex) % total;
                    if (offset > total / 2) offset -= total;
                    if (offset < -total / 2) offset += total;

                    const absOffset = Math.abs(offset);
                    const sign = Math.sign(offset);

                    let x = 0;
                    let z = 0;
                    let rotateY = 0;
                    let scale = 1.0;
                    let opacity = 1.0;
                    let zIndex = 30;

                    if (absOffset === 0) {
                        x = 0;
                        z = 0;
                        rotateY = 0;
                        scale = 1.0;
                        opacity = 1.0;
                        zIndex = 30;
                    } else if (absOffset === 1) {
                        x = sign * 230;
                        z = -90;
                        rotateY = -sign * 22; // Inclinación suave hacia el centro para admirar el arte
                        scale = 0.82;
                        opacity = 0.88;
                        zIndex = 20;
                    } else { // absOffset === 2
                        x = sign * 430;
                        z = -220;
                        rotateY = -sign * 36; // Inclinación suave hacia el centro
                        scale = 0.68;
                        opacity = 0.68;
                        zIndex = 10;
                    }

                    slot.style.transform = `translate3d(${x}px, 0px, ${z}px) rotateY(${rotateY}deg) scale(${scale})`;
                    slot.style.opacity = opacity;
                    slot.style.pointerEvents = 'auto';
                    slot.style.zIndex = zIndex;
                });
            }
        }

        function handleCardClick(index) {
            if (widgetState !== 'CAROUSEL') return;
            resetInactivityTimer();
            stopAutoCycle();

            if (index !== currentSlotIndex) {
                // Si la carta tocada NO es la principal, se traslada directamente al centro con movimiento suave
                currentSlotIndex = index;
                turnsInCurrentBatch = 0; // Reiniciar conteo para darle tiempo de observación
                updateCarouselPositions();

                // Al llegar al centro tras el giro, reactivar la pausa y ciclo
                const spinMs = Math.max(350, (widgetConfig.spinSpeed || 1.2) * 1000);
                setTimeout(() => {
                    if (widgetState === 'CAROUSEL') {
                        startAutoCycle();
                    }
                }, spinMs);
            } else {
                // Si la carta ya está al centro, entonces SÍ se amplía a pantalla grande
                selectCard(index);
            }
        }

        /**
         * Seleccionar una carta para exhibirla en pantalla grande al centro
         */
        function selectCard(index) {
            if (widgetState !== 'CAROUSEL' && widgetState !== 'SHOWCASE') return;
            widgetState = 'SHOWCASE';
            stopAutoCycle();

            btnFastExit.classList.remove('hidden');

            // El carrusel viaja suavemente al centro absoluto de la pantalla sin importar su posición base
            if (carouselAnchor) carouselAnchor.classList.add('showcase-center-override');

            // Calcular ampliación para ocupar hasta el 78-80% de la altura de la pantalla
            const viewportH = window.innerHeight || 800;
            const targetHeight = viewportH * 0.78;
            const cardHeight = 380;
            const showcaseScale = Math.min(2.35, Math.max(1.3, targetHeight / cardHeight));

            cardElements.forEach((slot, i) => {
                slot.classList.remove('is-front-center');
                if (i === index) {
                    slot.style.transform = `translate3d(0px, 0px, 120px) scale(${showcaseScale.toFixed(2)})`;
                    slot.style.opacity = '1';
                    slot.style.zIndex = '50';
                    slot.classList.add('is-selected');
                    slot.style.pointerEvents = 'auto';
                } else {
                    slot.classList.remove('is-selected');
                    const angle = (i - index) * (360 / cardElements.length);
                    const rad = (angle * Math.PI) / 180;
                    const x = Math.sin(rad) * (CAROUSEL_RADIUS * 1.5);
                    const z = -700;
                    slot.style.transform = `translate3d(${x.toFixed(1)}px, 80px, ${z}px) rotateY(${angle}deg) scale(0.3)`;
                    slot.style.opacity = '0';
                    slot.style.pointerEvents = 'none';
                }
            });

            startShowcaseTimer(index);
        }

        function startShowcaseTimer(selectedIndex) {
            const startTime = performance.now();
            const cardData = activeBatchCards[selectedIndex];
            const rarityKey = (cardData.rarity || 'COMÚN').toUpperCase();
            const rarityConfig = RARITY_STYLES[rarityKey] || RARITY_STYLES["COMÚN"];

            timerRarity.textContent = rarityKey;
            timerRarity.style.color = rarityConfig.primary;
            timerBar.style.background = `linear-gradient(90deg, ${rarityConfig.primary}, ${rarityConfig.secondary})`;
            timerHud.classList.remove('opacity-0');

            clearInterval(countdownInterval);
            clearTimeout(showcaseTimeout);

            countdownInterval = setInterval(() => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, SHOWCASE_DURATION_MS - elapsed);
                const secs = Math.ceil(remaining / 1000);
                const progress = remaining / SHOWCASE_DURATION_MS;

                timerSeconds.textContent = secs;
                timerBar.style.transform = `scaleX(${progress})`;

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 80);

            showcaseTimeout = setTimeout(() => {
                finishShowcase(selectedIndex, false);
            }, SHOWCASE_DURATION_MS);
        }

        /**
         * Finalizar la exhibición de una carta según la configuración:
         * - Si hideAfterShowcase es true: salida épica con explosión y ocultar carrusel.
         * - Si hideAfterShowcase es false: volver suavemente al carrusel y reanudar donde se quedó.
         */
        function finishShowcase(selectedIndex, forceEpicExit = false) {
            clearInterval(countdownInterval);
            clearTimeout(showcaseTimeout);
            timerHud.classList.add('opacity-0');
            btnFastExit.classList.add('hidden');

            if (forceEpicExit || widgetConfig.hideAfterShowcase) {
                triggerEpicExit(selectedIndex);
            } else {
                returnFromShowcaseToCarousel(selectedIndex);
            }
        }

        /**
         * Regresar suavemente la carta desde pantalla grande a su posición en el carrusel
         * sin hiperespacio ni saltar de lote, retomando el giro donde se quedó.
         */
        function returnFromShowcaseToCarousel(selectedIndex) {
            if (typeof selectedIndex !== 'number' || selectedIndex < 0 || selectedIndex >= activeBatchCards.length) {
                selectedIndex = currentSlotIndex;
            }

            clearInterval(countdownInterval);
            clearTimeout(showcaseTimeout);
            timerHud.classList.add('opacity-0');
            btnFastExit.classList.add('hidden');

            const selectedSlot = cardElements[selectedIndex];
            if (selectedSlot) {
                selectedSlot.classList.remove('is-selected');
            }

            // Quitar anulación de centro para que vuelva a su posición configurada en el lienzo
            if (carouselAnchor) {
                carouselAnchor.classList.remove('showcase-center-override');
            }

            widgetState = 'CAROUSEL';
            currentSlotIndex = selectedIndex;

            // Restaurar suavemente las posiciones 3D del anfiteatro
            updateCarouselPositions();

            // Reanudar el ciclo de rotación y pausa exactamente donde se quedó
            const spinMs = Math.max(400, (widgetConfig.spinSpeed || 1.2) * 1000);
            setTimeout(() => {
                if (widgetState === 'CAROUSEL') {
                    startAutoCycle();
                }
            }, spinMs);

            resetInactivityTimer();
        }

        function triggerEpicExit(selectedIndex) {
            if (typeof selectedIndex !== 'number' || selectedIndex < 0 || selectedIndex >= activeBatchCards.length) {
                selectedIndex = currentSlotIndex;
            }
            stopAutoCycle();
            widgetState = 'EXITING';

            clearInterval(countdownInterval);
            clearTimeout(showcaseTimeout);
            timerHud.classList.add('opacity-0');
            btnFastExit.classList.add('hidden');

            const selectedSlot = cardElements[selectedIndex];
            const cardData = activeBatchCards[selectedIndex] || {};
            const rarityKey = (cardData.rarity || 'COMÚN').toUpperCase();
            const rarityConfig = RARITY_STYLES[rarityKey] || RARITY_STYLES["COMÚN"];

            if (selectedSlot) {
                selectedSlot.classList.remove('is-selected');
                selectedSlot.classList.add('epic-exit');
            }

            setTimeout(() => {
                shockwave.style.borderColor = rarityConfig.primary;
                shockwave.style.boxShadow = `0 0 50px ${rarityConfig.primary}, inset 0 0 40px ${rarityConfig.secondary}`;
                shockwave.classList.remove('active');
                void shockwave.offsetWidth;
                shockwave.classList.add('active');
                spawnEpicParticles(rarityConfig.primary, rarityConfig.secondary);
            }, 350);

            // Reanudar carrusel o auto-ocultar según configuración
            setTimeout(() => {
                if (carouselAnchor) carouselAnchor.classList.remove('showcase-center-override');
                if (selectedSlot) selectedSlot.classList.remove('epic-exit');

                // Si está activado auto-ocultar tarjetero o modo ondemand, ocultar el expositor
                if (widgetConfig.hideAfterShowcase || widgetConfig.visibilityMode === 'ondemand') {
                    dismissWidget();
                }

                widgetState = 'CAROUSEL';
                if (isSpecialQueryBatch) {
                    isSpecialQueryBatch = false;
                    mountBatch(currentBatchIndex, true);
                } else {
                    transitionToNextBatch();
                }
            }, 1700);
        }

        function resetCarousel() {
            clearInterval(countdownInterval);
            clearTimeout(showcaseTimeout);
            timerHud.classList.add('opacity-0');
            btnFastExit.classList.add('hidden');
            shockwave.classList.remove('active');
            if (carouselAnchor) carouselAnchor.classList.remove('showcase-center-override');

            widgetState = 'CAROUSEL';
            mountBatch(currentBatchIndex);
        }

        // ═══════════ SISTEMA DE PARTÍCULAS CANVAS ═══════════
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnEpicParticles(color1, color2) {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < 110; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 18;
                particles.push({
                    x: centerX + (Math.random() - 0.5) * 120,
                    y: centerY + (Math.random() - 0.5) * 180,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    size: 2 + Math.random() * 5,
                    color: Math.random() > 0.5 ? color1 : (Math.random() > 0.3 ? color2 : '#ffffff'),
                    alpha: 1,
                    decay: 0.012 + Math.random() * 0.02
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.97;
                p.vy *= 0.97;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 14;
                
                ctx.translate(p.x, p.y);
                ctx.rotate(Math.PI / 4);
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }

            requestAnimationFrame(animateParticles);
        }

        // ═══════════ BOTONES Y CONTROLES ═══════════
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (widgetState !== 'CAROUSEL') return;
            resetInactivityTimer();
            stopAutoCycle();
            currentSlotIndex = (currentSlotIndex - 1 + activeBatchCards.length) % activeBatchCards.length;
            updateCarouselPositions();
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (widgetState !== 'CAROUSEL') return;
            resetInactivityTimer();
            stopAutoCycle();
            currentSlotIndex = (currentSlotIndex + 1) % activeBatchCards.length;
            updateCarouselPositions();
        });

        document.getElementById('btn-next-batch').addEventListener('click', () => {
            resetInactivityTimer();
            transitionToNextBatch();
        });

        document.getElementById('btn-random').addEventListener('click', () => {
            resetInactivityTimer();
            if (widgetState !== 'CAROUSEL') {
                resetCarousel();
                return;
            }
            const randIdx = Math.floor(Math.random() * activeBatchCards.length);
            currentSlotIndex = randIdx;
            updateCarouselPositions();
            setTimeout(() => selectCard(randIdx), 400);
        });

        btnFastExit.addEventListener('click', () => {
            finishShowcase(currentSlotIndex, true);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            resetInactivityTimer();
            resetCarousel();
        });

        document.getElementById('btn-bg').addEventListener('click', () => {
            document.body.classList.toggle('preview-bg');
        });

        // Listeners para ajustes de tiempos manuales en el HUD
        const hudPauseInput = document.getElementById('hud-pause-time');
        if (hudPauseInput) {
            hudPauseInput.addEventListener('change', (e) => {
                const val = parseFloat(e.target.value) || 3.5;
                applyWidgetConfig({ centerPauseTime: val });
                localStorage.setItem('jikokun_tcg_config', JSON.stringify(widgetConfig));
                syncChannel.postMessage({ action: 'update_config', config: widgetConfig });
            });
        }

        const hudSpinInput = document.getElementById('hud-spin-speed');
        if (hudSpinInput) {
            hudSpinInput.addEventListener('change', (e) => {
                const val = parseFloat(e.target.value) || 1.2;
                applyWidgetConfig({ spinSpeed: val });
                localStorage.setItem('jikokun_tcg_config', JSON.stringify(widgetConfig));
                syncChannel.postMessage({ action: 'update_config', config: widgetConfig });
            });
        }

        function toggleHud() {
            const isHidden = controlHud.classList.toggle('opacity-0');
            controlHud.classList.toggle('pointer-events-none', isHidden);
            document.body.classList.toggle('clean-stream-mode', isHidden);
            document.getElementById('batch-hud').classList.toggle('opacity-0', isHidden);
        }

        document.getElementById('btn-hide-hud').addEventListener('click', toggleHud);
        btnRestore.addEventListener('click', () => {
            controlHud.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.remove('clean-stream-mode');
            document.getElementById('batch-hud').classList.remove('opacity-0');
            if (widgetState === 'EMPTY') resetCarousel();
        });

        // Controles de teclado para OBS
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && widgetState === 'CAROUSEL') {
                stopAutoCycle();
                currentSlotIndex = (currentSlotIndex - 1 + activeBatchCards.length) % activeBatchCards.length;
                updateCarouselPositions();
            } else if (e.key === 'ArrowRight' && widgetState === 'CAROUSEL') {
                stopAutoCycle();
                currentSlotIndex = (currentSlotIndex + 1) % activeBatchCards.length;
                updateCarouselPositions();
            } else if (e.key === 'Enter' || e.key === ' ') {
                if (widgetState === 'CAROUSEL') selectCard(currentSlotIndex);
            } else if (e.key.toLowerCase() === 'n') {
                transitionToNextBatch();
            } else if (e.key.toLowerCase() === 'r') {
                resetCarousel();
            } else if (e.key.toLowerCase() === 'h') {
                toggleHud();
            }
        });

        // ═══════════ WEBSOCKET STREAMER.BOT (IDÉNTICO A TIENDITA.HTML) ═══════════
        const urlParams = new URLSearchParams(window.location.search);
        const WS_PORT = urlParams.get('port') || urlParams.get('wsport') || '4445';
        const WS_URL = `ws://127.0.0.1:${WS_PORT}/`;
        let sbSocket = null;
        let wsReconnectTimer = null;

        function setStatus(estado, txt) {
            console.log(`[Tarjetero Streamer.bot] [${estado}] ${txt}`);
            syncChannel.postMessage({
                action: 'sb_status',
                connected: estado === 'ok',
                reconnecting: estado === 'warn',
                port: WS_PORT
            });
        }

        function conectarWS() {
            if (sbSocket) {
                try {
                    sbSocket.onopen = null;
                    sbSocket.onmessage = null;
                    sbSocket.onerror = null;
                    sbSocket.onclose = null;
                    sbSocket.close();
                } catch(e) {}
                sbSocket = null;
            }

            try {
                sbSocket = new WebSocket(WS_URL);
            } catch(err) {
                setStatus('warn', 'Reconectando…');
                clearTimeout(wsReconnectTimer);
                wsReconnectTimer = setTimeout(conectarWS, 3000);
                return;
            }

            sbSocket.onopen = () => { 
                setStatus('ok', 'Conectado');
                console.log(`[Tarjetero] 🟢 WebSocket conectado con éxito a Streamer.bot en ${WS_URL}`);
                try {
                    sbSocket.send(JSON.stringify({
                        request: 'Subscribe',
                        id: 'sub-tarjetero',
                        events: {
                            General: ['Custom'],
                            Kick: ['ChatMessage', 'Message'],
                            Twitch: ['ChatMessage']
                        }
                    }));
                } catch(err) {
                    console.warn('[Tarjetero] Error enviando Subscribe a Streamer.bot:', err);
                }
            };

            sbSocket.onmessage = (ev) => {
                let msg;
                try { msg = JSON.parse(ev.data); } catch(e) { return; }

                const eventObj = msg.event || {};
                const eventType = (
                    (typeof eventObj === 'object' ? (eventObj.type || eventObj.name || '') : eventObj) || 
                    msg.method || msg.type || ''
                ).toString().toLowerCase();

                const rawData = msg.data || msg.body || msg;
                const data = rawData.data || rawData;

                // 1. Evento personalizado desde Streamer.bot (Custom Broadcast)
                if (eventType === 'custom' || msg.method === 'Custom') {
                    console.log('[Tarjetero] 📦 Evento Custom recibido:', data);
                    const customCmd = data.command || data.action || data.cmd || (typeof data === 'string' ? data : '');
                    const customUser = data.user || data.userName || data.username || 'Streamerbot';
                    if (customCmd) {
                        handleChatMessage(customUser, customCmd);
                    }
                    return;
                }

                // 2. Mensajes de chat en vivo de Kick / Twitch (idéntico a tiendita.html)
                const isChat = eventType.includes('chatmessage') || eventType.includes('message') || eventType === 'message' || data.message || data.messageText || data.text || data.content;
                if (isChat) {
                    const messageObj = data.message || data;
                    let userObj = data.user || data.sender || (typeof messageObj === 'object' ? (messageObj.user || messageObj.sender) : null) || {};
                    let user = 'anon';
                    if (typeof userObj === 'string') user = userObj;
                    else if (typeof userObj === 'object' && userObj !== null) {
                        user = userObj.username || userObj.name || userObj.displayName || userObj.user_name || data.userName || data.username || 'anon';
                    }

                    let contenido = '';
                    if (typeof data.messageText === 'string') contenido = data.messageText;
                    else if (typeof data.message === 'string') contenido = data.message;
                    else if (typeof data.text === 'string') contenido = data.text;
                    else if (typeof data.content === 'string') contenido = data.content;
                    else if (typeof messageObj === 'object' && messageObj !== null) {
                        contenido = messageObj.message || messageObj.text || messageObj.content || '';
                    }

                    if (!contenido) return;

                    // Filtro estricto de bots (idéntico a tiendita.html)
                    const userNorm = (user || '').toLowerCase().trim();
                    const BOTS_IGNORADOS = [
                        'botrix', 'lobito_mensajero', 'kickbot', 'nightbot',
                        'streamelements', 'streamlabs', 'jikobot', 'creepingbot',
                        'wizebot', 'bot'
                    ];
                    if (BOTS_IGNORADOS.includes(userNorm)) return;

                    console.log(`[Tarjetero Streamer.bot] 💬 Comando recibido de [@${user}]: "${contenido}"`);
                    handleChatMessage(user, contenido);
                }
            };

            sbSocket.onclose = () => {
                setStatus('warn', 'Reconectando…');
                clearTimeout(wsReconnectTimer);
                wsReconnectTimer = setTimeout(conectarWS, 3000);
            };

            sbSocket.onerror = () => {
                setStatus('warn', 'Reconectando…');
            };
        }

        // ═══════════ PROCESAMIENTO Y DEDUPLICACIÓN DE COMANDOS DE CHAT ═══════════
        const recentCommandsMap = new Map();

        function handleChatMessage(user, message) {
            if (!message) return;
            const clean = message.trim().toLowerCase();
            
            // Deduplicación en ventana de 2.2s para evitar duplicados entre Pusher y Streamer.bot
            const dedupKey = `${user.toLowerCase()}:${clean}`;
            const now = Date.now();
            if (recentCommandsMap.has(dedupKey) && (now - recentCommandsMap.get(dedupKey) < 2200)) {
                return;
            }
            recentCommandsMap.set(dedupKey, now);

            console.log(`[TCG Control] 💬 Comando procesado de ${user}: "${clean}"`);

            if (clean === '!tarjetasjikokun' || clean === '!tarjetas' || clean === '!mostrar') {
                summonWidget();
            } else if (clean === '!rotar') {
                resetInactivityTimer();
                fastRotateCurrentBatch();
            } else if (clean.startsWith('!carta')) {
                resetInactivityTimer();
                const rawArg = clean.replace(/^!carta\s*/, '').trim();
                const hidden = isWidgetHidden();

                if (hidden) {
                    // Cuando el carrusel está oculto, buscar inmersivamente por número de carta
                    handleDirectCardQuery(rawArg, true);
                } else {
                    // Cuando el carrusel está visible en pantalla:
                    // Si el argumento es un número del 1 al 5 y cabe en las cartas del lote:
                    const slotNum = parseInt(rawArg, 10);
                    if (!isNaN(slotNum) && slotNum >= 1 && slotNum <= activeBatchCards.length && /^[1-5]$/.test(rawArg)) {
                        selectCard(slotNum - 1);
                    } else {
                        // Si es otro número (ej. !carta 18, !carta 00, !carta 25), buscar por número de carta
                        handleDirectCardQuery(rawArg, false);
                    }
                }
            } else if (clean === '!siguiente' || clean === '!lote' || clean === '!sig' || clean === '!next') {
                resetInactivityTimer();
                transitionToNextBatch();
            } else if (clean === '!ocultartarjetas' || clean === '!ocultar') {
                dismissWidget();
            } else if (clean === '!salidaepica' || clean === '!epica' || clean === '!exit') {
                finishShowcase(currentSlotIndex, true);
            } else if (clean === '!reset' || clean === '!reiniciar') {
                resetInactivityTimer();
                resetCarousel();
            } else if (clean === '!azar' || clean === '!random') {
                resetInactivityTimer();
                if (activeBatchCards.length > 0) {
                    const rIdx = Math.floor(Math.random() * activeBatchCards.length);
                    selectCard(rIdx);
                }
            }
        }

        // ═══════════ ESCUCHA DIRECTA DE POSTMESSAGE (DESDE IFRAME EN PRUEBA.HTML) ═══════════
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.type === 'COMMAND' && event.data.command) {
                console.log('[Tarjetero PostMessage] ⚡ Comando directo:', event.data.command);
                handleChatMessage(event.data.user || 'ParentFrame', event.data.command);
            } else if (event.data.type === 'UPDATE_CONFIG' && event.data.config) {
                console.log('[Tarjetero PostMessage] ⚙️ Configuración recibida:', event.data.config);
                applyWidgetConfig(event.data.config);
                if (event.data.config.order && event.data.config.order !== currentAppliedOrder) {
                    applyCollectionOrder(event.data.config.order);
                }
            } else if (event.data.type === 'ZOOM_CARD') {
                const idx = (typeof event.data.index === 'number' && event.data.index >= 0 && event.data.index < activeBatchCards.length) 
                    ? event.data.index 
                    : currentSlotIndex;
                selectCard(idx);
            } else if (event.data.type === 'FAST_EXIT') {
                triggerEpicExit(currentSlotIndex);
            } else if (event.data.type === 'RESET') {
                resetCarousel();
            }
        });

        // ═══════════ PARÁMETROS URL OBS ═══════════
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            
            if (params.get('obs') === 'true') {
                document.body.classList.remove('preview-bg');
                document.body.classList.add('clean-stream-mode');
                controlHud.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('batch-hud').classList.add('opacity-0');
            }

            const posParam = params.get('pos');
            if (posParam) {
                applyWidgetConfig({ position: posParam });
            }

            const scaleParam = parseFloat(params.get('scale'));
            if (!isNaN(scaleParam) && scaleParam > 0) {
                applyWidgetConfig({ scale: scaleParam });
            }

            const modeParam = params.get('mode');
            if (modeParam) {
                applyWidgetConfig({ visibilityMode: modeParam });
            }

            const orderParam = params.get('order');
            if (orderParam) {
                applyCollectionOrder(orderParam);
            }

            const dur = parseFloat(params.get('duration') || params.get('showcase'));
            if (!isNaN(dur) && dur > 0) {
                applyWidgetConfig({ showcaseDuration: dur });
            }

            const pauseParam = parseFloat(params.get('pause') || params.get('centerPause'));
            if (!isNaN(pauseParam) && pauseParam > 0) {
                applyWidgetConfig({ centerPauseTime: pauseParam });
            }

            const speedParam = parseFloat(params.get('speed') || params.get('spinSpeed'));
            if (!isNaN(speedParam) && speedParam > 0) {
                applyWidgetConfig({ spinSpeed: speedParam });
            }

            const fastParam = parseFloat(params.get('fastspeed') || params.get('fastRotateSpeed'));
            if (!isNaN(fastParam) && fastParam > 0) {
                applyWidgetConfig({ fastRotateSpeed: fastParam });
            }
        }

        // ═══════════ SINCRONIZACIÓN EN TIEMPO REAL CON ADMINTARJETAS (BROADCASTCHANNEL) ═══════════
        syncChannel.onmessage = (event) => {
            if (event.data) {
                if (event.data.action === 'update' && Array.isArray(event.data.cards)) {
                    console.log('[Tarjetero] Tarjetas actualizadas en vivo:', event.data.cards.length);
                    fullCollection = event.data.cards;
                    applyCollectionOrder(widgetConfig.order);
                } else if (event.data.action === 'change_order' && event.data.order) {
                    console.log('[Tarjetero] Cambio de orden en vivo:', event.data.order);
                    widgetConfig.order = event.data.order;
                    applyCollectionOrder(event.data.order);
                } else if (event.data.action === 'update_config' && event.data.config) {
                    console.log('[Tarjetero] Configuración recibida:', event.data.config);
                    applyWidgetConfig(event.data.config);
                    if (event.data.config.order && event.data.config.order !== currentAppliedOrder) {
                        applyCollectionOrder(event.data.config.order);
                    }
                } else if (event.data.action === 'command' && event.data.command) {
                    console.log('[Tarjetero] Comando manual recibido:', event.data.command);
                    handleChatMessage('Admin', event.data.command);
                } else if (event.data.action === 'switch_collection' && Array.isArray(event.data.cards)) {
                    console.log('[Tarjetero] Colección cambiada en vivo:', event.data.collectionName);
                    fullCollection = event.data.cards;
                    applyCollectionOrder(widgetConfig.order);
                }
            }
        };

        // ═══════════ SINCRONIZACIÓN UNIVERSAL CON FIREBASE REALTIME DATABASE ═══════════
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBPDKdjd6mTRre3TJ5nYxAaaZd7uKCcbyc",
            authDomain: "sensunshopweb.firebaseapp.com",
            databaseURL: "https://sensunshopweb-default-rtdb.firebaseio.com",
            projectId: "sensunshopweb",
            storageBucket: "sensunshopweb.firebasestorage.app",
            messagingSenderId: "618261314687",
            appId: "1:618261314687:web:b71c592f23538e2ca2d34a",
            measurementId: "G-WYP6KJ6B0J"
        };

        let fbApp = null;
        let fbDb = null;
        let fbTarjetasNode = null;
        let lastFirebaseCmdTs = Date.now() - 1000;

        function initFirebaseRealtime() {
            try {
                if (!window.firebase) {
                    console.warn('[TCG Firebase] SDK de Firebase no disponible, usando fallback local.');
                    return;
                }

                if (!firebase.apps.length) {
                    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
                } else {
                    fbApp = firebase.app();
                }

                try {
                    firebase.auth().signInAnonymously().catch(err => {
                        console.log('[TCG Firebase Auth]', err.message);
                    });
                } catch(e) {}

                fbDb = firebase.database();
                fbTarjetasNode = fbDb.ref('stream/widgets/tarjetas');

                // 1. Escucha en tiempo real de COMANDOS (!rotar, !tarjetasjikokun, !carta 1, etc.)
                fbTarjetasNode.child('command').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data || !data.command) return;

                    const cmdTs = data.timestamp || 0;
                    if (cmdTs > lastFirebaseCmdTs) {
                        lastFirebaseCmdTs = cmdTs;
                        console.log(`[TCG Firebase] ⚡ Comando recibido en vivo: "${data.command}" de ${data.sender || 'Remoto'}`);
                        handleChatMessage(data.sender || 'FirebaseRemote', data.command);
                    }
                });

                // 2. Escucha en tiempo real de CONFIGURACIÓN (Posición, Escala, Orden, Tiempos)
                fbTarjetasNode.child('config').on('value', (snapshot) => {
                    const cfg = snapshot.val();
                    if (!cfg) return;
                    console.log('[TCG Firebase] ⚙️ Configuración del expositor sincronizada en vivo:', cfg);
                    applyWidgetConfig(cfg);
                    if (cfg.order && cfg.order !== currentAppliedOrder) {
                        applyCollectionOrder(cfg.order);
                    }
                });

                // 3. Escucha en tiempo real de COLECCIÓN ACTIVA (Cartas, rarezas, reversos)
                fbTarjetasNode.child('activeCollection').on('value', (snapshot) => {
                    const col = snapshot.val();
                    if (!col || !Array.isArray(col.cards) || col.cards.length === 0) return;
                    console.log(`[TCG Firebase] 🎴 Colección activa sincronizada en vivo: ${col.collectionName || 'Colección'} (${col.cards.length} cartas)`);
                    fullCollection = col.cards;
                    applyCollectionOrder(widgetConfig.order);
                });

                console.log('[TCG Firebase] 🟢 Firebase RTDB conectado exitosamente bajo stream/widgets/tarjetas');
            } catch (err) {
                console.warn('[TCG Firebase] Error al inicializar Firebase RTDB:', err);
            }
        }

        window.onload = async () => {
            await loadCollection();
            animateParticles();
            checkUrlParams();
            conectarWS();
            initFirebaseRealtime();
        };
    </script>
