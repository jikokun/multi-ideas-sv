<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jikokun · Navidad · Vamos a mimir</title>
  
  <!-- Tipografías de Google: Bangers, Chewy, Luckiest Guy, Fredoka, Titan One, Orbitron, Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chewy&family=Comfortaa:wght@700;900&family=Dela+Gothic+One&family=Fredoka:wght@700;900&family=Luckiest+Guy&family=Nunito:wght@800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&family=Titan+One&display=swap" rel="stylesheet">
  
  <!-- Extracción Dinámica de Colores para Spotify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/node-vibrant/3.1.6/vibrant.min.js"></script>

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="base_modomimir.css">
  <link rel="stylesheet" href="navidad.css">
  <script src="musica.js" defer></script>
<script src="luces.js" defer></script>
<script src="nieve.js" defer></script>
<script src="navidad.js" defer></script>
</head>
<body class="navidad-scene navidad-mimir" data-scene="mimir">
  <div class="overlay-wrapper">
    <!-- Escenario OBS Nativo 1920x1080 (Auto-escalable a cualquier resolución) -->
    <div class="overlay-stage" id="overlay-stage">
      
      <!-- 1. Video de Fondo Exclusivo (recursos/fondomimir.webm) -->
      

      <!-- Reloj de El Salvador -->
      <div class="mimir-clock-widget">
        <div class="mimir-clock" id="mimir-clock" role="timer" aria-label="Hora de El Salvador">
          <span id="mimir-clock-time">--:--</span><span class="mimir-clock-period" id="mimir-clock-period">PM</span>
        </div>
      </div>

      <div class="mimir-chat-card">
        <div class="chat-area" id="chat-container"></div>
      </div>

      <!-- 5. Luna Llena Simulada con Logo Animado del Lobo Agrandado -->
      <div class="mimir-logo-circle">
        <video class="animated-logo" src="https://res.cloudinary.com/dn6fmqae9/video/upload/v1784993956/logoanimado_scqpxo.webm" autoplay loop muted playsinline></video>
      </div>

      <!-- 6. Texto Llamativo Inferior (Gracias por disfrutar / Vamos a mimir) -->
      <div class="mimir-bottom-title-container">
        <h1 class="mimir-main-text">
          <span class="mimir-line line-1">Gracias por disfrutar</span>
          <span class="mimir-line line-2">Vamos a mimir</span>
        </h1>
      </div>

    </div>
  </div>

  <!-- Script Principal JS -->
  <script src="base_modomimir.js" defer></script>
</body>
</html>
