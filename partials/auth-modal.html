<div id="auth-modal" class="auth-modal-overlay">
    <div class="auth-modal-card">
        <button id="auth-modal-close" class="auth-close-btn" aria-label="Cerrar modal">&times;</button>
        
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab-btn active">Iniciar Sesión</button>
            <button id="tab-register" class="auth-tab-btn">Registrarse</button>
        </div>

        <form id="auth-form" class="auth-form-content">
            <h3 id="auth-title">Ingresa a tu cuenta</h3>
            <p id="auth-subtitle" class="auth-subtitle">Accede a todas las funciones de Multi Ideas Sv</p>

            <div class="auth-input-group" id="group-name" style="display: none;">
                <label for="auth-name">Nombre Completo</label>
                <input type="text" id="auth-name" placeholder="Tu nombre" autocomplete="name">
            </div>

            <div class="auth-input-group">
                <label for="auth-email">Correo Electrónico</label>
                <input type="email" id="auth-email" required placeholder="correo@ejemplo.com" autocomplete="email">
            </div>

            <div class="auth-input-group">
                <label for="auth-password">Contraseña</label>
                <input type="password" id="auth-password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="auth-error-container" id="auth-error-msg" style="display: none;"></div>

            <button type="submit" id="auth-submit-btn" class="auth-submit-btn">Ingresar</button>

            <div class="auth-divider">
                <span>o</span>
            </div>

            <button type="button" id="auth-google-btn" class="auth-google-btn">
                <!-- Anillo Expansivo de Éxito -->
                <span class="g-ring"></span>

                <!-- Confetis de colores de Google -->
                <i class="g-confetti" style="--gc:#4285F4; --gx:-60px; --gy:-40px; --gd:0s;"></i>
                <i class="g-confetti" style="--gc:#EA4335; --gx:60px; --gy:-45px; --gd:0.04s;"></i>
                <i class="g-confetti" style="--gc:#FBBC05; --gx:-70px; --gy:20px; --gd:0.08s;"></i>
                <i class="g-confetti" style="--gc:#34A853; --gx:65px; --gy:25px; --gd:0.12s;"></i>
                <i class="g-confetti" style="--gc:#4285F4; --gx:10px; --gy:-60px; --gd:0.06s;"></i>
                <i class="g-confetti" style="--gc:#34A853; --gx:-15px; --gy:55px; --gd:0.1s;"></i>

                <!-- Icono Oficial Multicolor -->
                <svg class="google-g-icon" viewBox="0 0 24 24" width="20" height="20" style="margin-right: 8px;">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>

                <!-- Spinner de Carga -->
                <span class="google-spinner"></span>

                <!-- Visto Bueno de Éxito -->
                <span class="google-check">
                    <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>

                <span id="auth-google-text" class="google-btn-text">Iniciar con Google</span>
            </button>
        </form>
    </div>
</div>
