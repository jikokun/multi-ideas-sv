<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jikokun | Multi Ideas Sv</title>
    <link rel="icon" href="imagenes/iconos_generales/multiideassv_ico.webp?v=1" type="image/webp">
            <!-- Anti-FOUC & Fast Paint Inline Tokens -->
    <style>
        html { background-color: #0a0c10; color: #ffffff; }
        html.light-theme { background-color: #f0fbfb; color: #063d41; }
        #global-header, header { min-height: 72px; }
    </style>
    <script>
        (function() {
            try {
                const isLight = localStorage.getItem('theme') === 'light';
                if (isLight) {
                    document.documentElement.classList.add('light-theme');
                }
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    let p = window.location.pathname;
                    if (p.endsWith('/index.html')) p = p.slice(0, -10);
                    else if (p === '/index.html' || p === 'index.html') p = '/';
                    else if (p.endsWith('.html')) p = p.slice(0, -5);
                    if (p !== window.location.pathname) {
                        window.history.replaceState(null, document.title, p + window.location.search + window.location.hash);
                    }
                }
                if (isLight) {
                    const obs = new MutationObserver(() => {
                        if (document.body) {
                            document.body.classList.add('light-theme');
                            obs.disconnect();
                        }
                    });
                    obs.observe(document.documentElement, { childList: true });
                }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="estilo_claro_multi.css" id="theme-light-css">
</head>
<body>
    <header id="global-header"></header>

    <section class="hero">
        <div class="hero-content">
            <span class="badge">PROYECTO INDEPENDIENTE</span>
            <h1>Jiko<span class="gradient-text">kun</span></h1>
            <p>Sección en desarrollo para el ecosistema de Multi Ideas Sv.</p>
            <a href="index.html" class="btn-secundario">Volver al Inicio</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Multi Ideas Sv. San Salvador, El Salvador. Todos los derechos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
