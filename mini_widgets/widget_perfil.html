/* Efecto especial Unicornio Rainbow Shimmer en el borde */
.theme-unicorn .card-border {
    animation: rainbowBorder 8s linear infinite;
}

@keyframes rainbowBorder {
    0% { filter: drop-shadow(0 0 3px rgba(255, 112, 217, .9)) drop-shadow(0 0 14px rgba(168, 85, 247, .5)); }
    50% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, .9)) drop-shadow(0 0 16px rgba(255, 112, 217, .6)); }
    100% { filter: drop-shadow(0 0 3px rgba(255, 112, 217, .9)) drop-shadow(0 0 14px rgba(168, 85, 247, .5)); }
}

/* 9. CORONA DEL CREADOR / LOBO SUPREMO: Diseño ÚNICO y Exclusivo para Jikokun (Dueño del Canal) */
.theme-owner, .theme-creador {
    --glow-1: #ffd700;
    --glow-2: #00f2fe;
    --glow-3: #ff2a5f;
    --border-1: #fff8cc;
    --border-2: #ffd700;
    --border-3: #00f2fe;
    --border-4: #ff2a5f;
    --border-5: #ffe680;
    --glow-shadow-1: rgba(255, 215, 0, .85);
    --glow-shadow-2: rgba(0, 242, 254, .9);
    --glow-shadow-3: rgba(255, 42, 95, .5);
    --panel-bg-1: rgba(14, 18, 32, .92);
    --panel-bg-2: rgba(6, 8, 16, .84);
    --grid-color-1: rgba(255, 215, 0, .045);
    --grid-color-2: rgba(0, 242, 254, .035);
    --light-color-1: rgba(255, 215, 0, .22);
    --light-color-2: rgba(0, 242, 254, .1);
    --accent: #ffd700;
    --accent-glow: #00f2fe;
    --accent-shadow: rgba(255, 215, 0, .65);
    --accent-shadow-2: rgba(0, 242, 254, .85);
    --tag-color: #ffd700;
    --text-color: #ffffff;
    --level-bg: rgba(255, 215, 0, .14);
    --level-border: #ffd700;
    --level-text: #fff3a8;
    --divider-mid: #ffd700;
    --divider-glow: rgba(0, 242, 254, .35);
    --section-color: #00f2fe;
    --inner-bg-1: rgba(255, 215, 0, .12);
    --inner-bg-2: rgba(0, 242, 254, .08);
    --inner-border: rgba(255, 215, 0, .35);
    --stat-name: #fff2b2;
    --bar-bg: rgba(255, 255, 255, .09);
    --bar-fill-1: #00f2fe;
    --bar-fill-2: #ffd700;
    --bar-glow: rgba(255, 215, 0, .9);
    --hp-fill-1: #ff2a5f;
    --hp-fill-2: #ffd700;
    --skill-bg: rgba(255, 215, 0, .15);
    --skill-border: rgba(0, 242, 254, .45);
    --skill-shadow: rgba(255, 215, 0, .15);
    --avatar-1: #fff8cc;
    --avatar-2: #ffd700;
    --avatar-inner-1: rgba(0, 242, 254, .3);
    --avatar-inner-2: rgba(14, 18, 32, .96);
    --bevel-light: rgba(255, 250, 205, .45);
    --bevel-dark: rgba(20, 25, 45, .7);
    --specular: rgba(255, 255, 255, .22);
    --circuit: rgba(255, 215, 0, .08);
    --noise-opacity: .04;
}

/* Animación Aura Suprema del Creador */
.theme-owner .card-border, .theme-creador .card-border {
    animation: ownerCrownShimmer 6s ease-in-out infinite alternate;
}

@keyframes ownerCrownShimmer {
    0% {
        filter: drop-shadow(0 0 5px rgba(255, 215, 0, .95)) drop-shadow(0 0 16px rgba(0, 242, 254, .6));
    }
    50% {
        filter: drop-shadow(0 0 6px rgba(0, 242, 254, .95)) drop-shadow(0 0 20px rgba(255, 42, 95, .55));
    }
    100% {
        filter: drop-shadow(0 0 5px rgba(255, 215, 0, .95)) drop-shadow(0 0 18px rgba(255, 215, 0, .7));
    }
}

/* ==========================================================
   CONTENEDOR GENERAL & ANIMACIÓN FLOTANTE OBS
   ========================================================== */

#card-root {
    position: relative;
    display: none;
    opacity: 0;
    transform: translateY(35px) scale(0.92);
    transition: opacity .45s cubic-bezier(.16, 1, .3, 1), transform .45s cubic-bezier(.16, 1, .3, 1);
}

#card-root.visible {
    display: block;
    opacity: 1;
    transform: translateY(0) scale(1);
}

#card-root.saliendo {
    opacity: 0;
    transform: translateY(-25px) scale(0.94);
    transition: opacity .4s ease, transform .4s ease;
}

.card-wrapper {
    position: relative;
    width: 380px;
    height: 580px;
}

/* ==========================================================
   CAPA 0 — SOMBRA PROFUNDA
   ========================================================== */

.card-shadow {
    position: absolute;
    inset: 8px;
    background: transparent;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,.6)) drop-shadow(0 2px 8px rgba(0,0,0,.4));
    clip-path: polygon(
        28px 0, calc(100% - 70px) 0, calc(100% - 55px) 12px,
        calc(100% - 18px) 12px, 100% 30px, 100% calc(100% - 35px),
        calc(100% - 35px) 100%, 55px 100%, 40px calc(100% - 12px),
        15px calc(100% - 12px), 0 calc(100% - 28px), 0 28px
    );
    z-index: 0;
}

/* ==========================================================
   CAPA 1 — BRILLO EXTERIOR
   ========================================================== */

.card-glow {
    position: absolute;
    inset: -6px;
    background: linear-gradient(135deg, var(--glow-1), var(--glow-2) 45%, var(--glow-3));
    clip-path: polygon(
        28px 0, calc(100% - 70px) 0, calc(100% - 55px) 12px,
        calc(100% - 18px) 12px, 100% 30px, 100% calc(100% - 35px),
        calc(100% - 35px) 100%, 55px 100%, 40px calc(100% - 12px),
        15px calc(100% - 12px), 0 calc(100% - 28px), 0 28px
    );
    filter: blur(10px) drop-shadow(0 0 14px var(--glow-shadow-1));
    opacity: .5;
    animation: glowPulse 4s ease-in-out infinite;
}

@keyframes glowPulse {
    0%, 100% { opacity: .45; }
    50% { opacity: .7; }
}

/* ==========================================================
   CAPA 2 — BORDE PRINCIPAL (METÁLICO)
   ========================================================== */

.card-border {
    position: absolute;
    inset: 0;
    padding: 2.5px;
    background:
        linear-gradient(
            160deg,
            var(--border-1) 0%,
            var(--border-2) 15%,
            var(--border-3) 40%,
            var(--border-4) 65%,
            var(--border-5) 85%,
            var(--border-2) 100%
        );
    clip-path: polygon(
        28px 0, calc(100% - 70px) 0, calc(100% - 55px) 12px,
        calc(100% - 18px) 12px, 100% 30px, 100% calc(100% - 35px),
        calc(100% - 35px) 100%, 55px 100%, 40px calc(100% - 12px),
        15px calc(100% - 12px), 0 calc(100% - 28px), 0 28px
    );
    filter:
        drop-shadow(0 0 3px var(--glow-shadow-2))
        drop-shadow(0 0 14px var(--glow-shadow-3));
}

.card-border::before {
    content: "";
    position: absolute;
    top: 0;
    left: 30px;
    right: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--specular), transparent);
    z-index: 10;
}

.card-border::after {
    content: "";
    position: absolute;
    right: 24px;
    bottom: 4px;
    width: 70px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent-glow));
    box-shadow: 0 0 10px var(--accent-shadow-2);
    animation: accentPulse 3s ease-in-out infinite;
}

@keyframes accentPulse {
    0%, 100% { opacity: .5; }
    50% { opacity: 1; }
}

/* ==========================================================
   CAPA 3 — PANEL INTERIOR
   ========================================================== */

.card-panel {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 24px 22px;
    overflow: hidden;
    background: linear-gradient(155deg, var(--panel-bg-1), var(--panel-bg-2));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    clip-path: polygon(
        27px 0, calc(100% - 69px) 0, calc(100% - 54px) 12px,
        calc(100% - 18px) 12px, 100% 30px, 100% calc(100% - 34px),
        calc(100% - 34px) 100%, 55px 100%, 40px calc(100% - 11px),
        15px calc(100% - 11px), 0 calc(100% - 27px), 0 27px
    );
}

.card-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(180deg, var(--bevel-light) 0%, transparent 2%),
        linear-gradient(0deg, var(--bevel-dark) 0%, transparent 2%),
        linear-gradient(90deg, var(--bevel-light) 0%, transparent 1.5%),
        linear-gradient(270deg, var(--bevel-dark) 0%, transparent 1.5%);
    z-index: 2;
}

.card-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(90deg, var(--grid-color-1) 1px, transparent 1px),
        linear-gradient(var(--grid-color-2) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .8;
    mask-image: radial-gradient(ellipse at 30% 20%, black 10%, transparent 65%);
    -webkit-mask-image: radial-gradient(ellipse at 30% 20%, black 10%, transparent 65%);
}

.noise-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    mix-blend-mode: overlay;
    clip-path: inherit;
}

.inner-light {
    position: absolute;
    width: 280px;
    height: 280px;
    top: -100px;
    right: -100px;
    background: radial-gradient(circle, var(--light-color-1), var(--light-color-2) 40%, transparent 70%);
    pointer-events: none;
    z-index: 1;
    animation: lightPulse 5s ease-in-out infinite;
}

@keyframes lightPulse {
    0%, 100% { opacity: .6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
}

.inner-light-bottom {
    position: absolute;
    width: 200px;
    height: 200px;
    bottom: -60px;
    left: -40px;
    background: radial-gradient(circle, var(--light-color-2), transparent 60%);
    pointer-events: none;
    z-index: 1;
    opacity: .5;
}

.circuit-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
}

.circuit-lines::before {
    content: "";
    position: absolute;
    top: 45px;
    right: 20px;
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--circuit), var(--accent), transparent);
    opacity: .5;
}

.circuit-lines::after {
    content: "";
    position: absolute;
    bottom: 50px;
    left: 20px;
    width: 45px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--circuit), transparent);
    opacity: .4;
}

.scan-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 5%, var(--accent-glow) 30%, var(--accent) 50%, var(--accent-glow) 70%, transparent 95%);
    opacity: .12;
    pointer-events: none;
    z-index: 10;
    animation: scanMove 5s linear infinite;
}

@keyframes scanMove {
    0% { top: -2px; }
    100% { top: 100%; }
}

.corner {
    position: absolute;
    width: 16px;
    height: 16px;
    pointer-events: none;
    z-index: 12;
}

.corner::before, .corner::after {
    content: "";
    position: absolute;
    background: var(--accent);
    opacity: .4;
}

.corner.tl { top: 8px; left: 8px; }
.corner.tl::before { top: 0; left: 0; width: 12px; height: 1.5px; }
.corner.tl::after { top: 0; left: 0; width: 1.5px; height: 12px; }

.corner.tr { top: 8px; right: 32px; }
.corner.tr::before { top: 0; right: 0; width: 12px; height: 1.5px; }
.corner.tr::after { top: 0; right: 0; width: 1.5px; height: 12px; }

.corner.bl { bottom: 8px; left: 8px; }
.corner.bl::before { bottom: 0; left: 0; width: 12px; height: 1.5px; }
.corner.bl::after { bottom: 0; left: 0; width: 1.5px; height: 12px; }

.corner.br { bottom: 8px; right: 8px; }
.corner.br::before { bottom: 0; right: 0; width: 12px; height: 1.5px; }
.corner.br::after { bottom: 0; right: 0; width: 1.5px; height: 12px; }

.edge-notch {
    position: absolute;
    top: -2px;
    left: 65px;
    width: 110px;
    height: 5px;
    background: var(--accent);
    clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
    box-shadow: 0 0 8px var(--accent-glow), 0 0 16px var(--accent-shadow);
    z-index: 15;
}

.edge-notch-bottom {
    position: absolute;
    bottom: -1px;
    right: 60px;
    width: 50px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent));
    box-shadow: 0 0 8px var(--accent-shadow-2);
    z-index: 15;
}

.rivet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--border-1), var(--border-3));
    box-shadow: inset 0 1px 1px var(--specular), 0 0 3px var(--glow-shadow-3);
    z-index: 15;
    opacity: .6;
}

.rivet.r1 { top: 14px; left: 32px; }
.rivet.r2 { top: 14px; right: 62px; }
.rivet.r3 { bottom: 14px; left: 20px; }
.rivet.r4 { bottom: 14px; right: 40px; }

.theme-label {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 12px var(--glow-shadow-1);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    white-space: nowrap;
    opacity: .85;
}

/* ==========================================================
   CONTENIDO INTERNO DE LA FICHA
   ========================================================== */

.profile {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    align-items: center;
    gap: 16px;
}

.avatar-border {
    width: 96px;
    height: 96px;
    padding: 2.5px;
    background: linear-gradient(135deg, var(--avatar-1), var(--avatar-2));
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    flex-shrink: 0;
    position: relative;
}

.avatar {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, var(--avatar-inner-1), var(--avatar-inner-2));
    clip-path: inherit;
    font-size: 44px;
    position: relative;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    clip-path: inherit;
    display: block;
}

.avatar::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(180deg, var(--specular), transparent);
    clip-path: inherit;
    pointer-events: none;
}

.status-dot {
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 13px;
    height: 13px;
    background: var(--accent);
    border: 2px solid var(--panel-bg-2);
    border-radius: 50%;
    z-index: 6;
    box-shadow: 0 0 8px var(--glow-shadow-1);
    animation: statusPulse 2s ease-in-out infinite;
}

@keyframes statusPulse {
    0%, 100% { box-shadow: 0 0 6px var(--glow-shadow-1); }
    50% { box-shadow: 0 0 14px var(--glow-shadow-1), 0 0 20px var(--glow-shadow-3); }
}

.profile-info {
    flex: 1;
    min-width: 0;
}

.tag-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 2px;
}

.badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--tag-color);
    letter-spacing: 2px;
    font-size: 9.5px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--inner-border);
    padding: 2px 7px;
    border-radius: 4px;
}

.profile-info h1 {
    margin: 4px 0 8px 0;
    font-size: 23px;
    letter-spacing: 2px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    color: var(--text-color);
    text-shadow: 0 0 18px var(--glow-shadow-3);
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.level {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: var(--level-bg);
    border-left: 2px solid var(--level-border);
    color: var(--level-text);
    font-size: 11.5px;
    letter-spacing: 1.5px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    position: relative;
}

.level strong {
    color: var(--text-color);
    font-weight: 700;
    font-size: 13px;
    text-shadow: 0 0 10px var(--glow-shadow-1);
}

.divider {
    position: relative;
    height: 1px;
    margin: 16px 0 14px 0;
    background: linear-gradient(90deg, transparent, var(--divider-glow) 15%, var(--divider-mid) 50%, var(--divider-glow) 85%, transparent);
    flex-shrink: 0;
}

.divider::before {
    content: "";
    position: absolute;
    left: 15%; right: 15%;
    top: -1px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--glow-shadow-3), transparent);
    filter: blur(3px);
}

.divider::after {
    content: "";
    position: absolute;
    left: 50%; top: -3px;
    width: 7px; height: 7px;
    transform: translateX(-50%) rotate(45deg);
    background: var(--divider-mid);
    box-shadow: 0 0 10px var(--divider-mid), 0 0 20px var(--glow-shadow-3);
    animation: dividerPulse 3s ease-in-out infinite;
}

@keyframes dividerPulse {
    0%, 100% { box-shadow: 0 0 8px var(--divider-mid); }
    50% { box-shadow: 0 0 16px var(--divider-mid), 0 0 30px var(--glow-shadow-3); }
}

.section {
    margin-top: 10px;
}

.section-title {
    font-size: 10.5px;
    letter-spacing: 3px;
    color: var(--section-color);
    margin-bottom: 7px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-title::before {
    content: "";
    width: 4px; height: 4px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 6px var(--accent);
}

.section-title::after {
    content: "";
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--inner-border), transparent);
}

.inner-panel {
    position: relative;
    padding: 10px 14px;
    background: linear-gradient(120deg, var(--inner-bg-1), var(--inner-bg-2));
    border: 1px solid var(--inner-border);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}

.inner-panel::before {
    content: "";
    position: absolute;
    top: 0; left: 10px; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--specular), transparent 50%);
}

.stat {
    display: grid;
    grid-template-columns: 65px 1fr 65px;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
}

.stat-name {
    font-size: 11.5px;
    color: var(--stat-name);
    font-weight: 700;
    letter-spacing: 1.2px;
}

.stat-value {
    font-size: 12.5px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    text-align: right;
    letter-spacing: 0.5px;
}

.stat-value.pts-val {
    color: var(--accent);
    text-shadow: 0 0 8px var(--bar-glow);
}

.stat-value.hp-val {
    color: var(--hp-fill-2);
    text-shadow: 0 0 8px rgba(255, 53, 111, .4);
}

.bar {
    height: 8px;
    position: relative;
    overflow: hidden;
    background: var(--bar-bg);
    clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0 50%);
}

.bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--bar-fill-1), var(--bar-fill-2));
    box-shadow: 0 0 12px var(--bar-glow);
    position: relative;
}

.bar-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.25) 50%, transparent 100%);
    animation: barShimmer 3s ease-in-out infinite;
}

@keyframes barShimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
}

/* Banner de Título Cómico / Tiendita */
.title-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 12px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--inner-border);
    margin-bottom: 8px;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

.title-banner-text {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.title-banner-badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--tag-color);
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
}

/* Badges / Insignias Grid */
.skills {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

}

.xp-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    font-size: 9.5px;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;

}

.xp-bar-outer {
    height: 6px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
}

.xp-bar-fill {
    height: 100%;
    width: 65%;

    border-radius: 3px;
    box-shadow: 0 0 8px var(--glow-shadow-3);
    position: relative;
    transition: width .6s ease;
}

.xp-bar-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    animation: barShimmer 4s ease-in-out infinite;
}

/* Temporizador de cierre en la parte inferior */
.timer-footer {
    height: 2px;
    width: 100%;
    background: rgba(255,255,255,0.06);
    margin-top: 8px;
    position: relative;
    overflow: hidden;
}

.timer-footer-fill {
    height: 100%;
    width: 100%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    transition: width linear;
}

/* Partículas */
.particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
}

.particle:nth-child(1) {
    width: 3px; height: 3px;
    background: var(--accent);
    top: 20%; left: 15%;
    animation: float1 7s ease-in-out infinite;
    opacity: .4;
}

.particle:nth-child(2) {
    width: 2px; height: 2px;
    background: var(--accent);
    top: 60%; right: 20%;
    animation: float2 9s ease-in-out infinite;
    opacity: .3;
}

.particle:nth-child(3) {
    width: 2px; height: 2px;
    background: var(--glow-1);
    bottom: 30%; left: 25%;
    animation: float3 8s ease-in-out infinite;
    opacity: .3;
}

@keyframes float1 {
    0%, 100% { transform: translate(0, 0); opacity: .3; }
    50% { transform: translate(8px, -12px); opacity: .7; }
}

@keyframes float2 {
    0%, 100% { transform: translate(0, 0); opacity: .2; }
    50% { transform: translate(-6px, 10px); opacity: .6; }
}

@keyframes float3 {

<script>
  /* ═══════════ PARÁMETROS URL & CONFIGURACIÓN ═══════════ */
  const urlParams = new URLSearchParams(window.location.search);
  const WS_PORT = urlParams.get('port') || '4445';
  const WS_URL = `ws://127.0.0.1:${WS_PORT}/`;
  const DURATION_SEC = parseInt(urlParams.get('duration'), 10) || 12; // 12 segundos visible
  const isMuted = urlParams.get('mute') === 'true';
  const isOverlay = urlParams.has('overlay') || urlParams.get('overlay') === 'true';

  if (isOverlay) {
    const tp = document.getElementById('test-panel');
    if (tp) tp.style.display = 'none';
  }

  // Alternar panel con Shift+P
  window.addEventListener('keydown', (e) => {
    if (e.key === 'P' && e.shiftKey) {
      const tp = document.getElementById('test-panel');
      if (tp) tp.style.display = tp.style.display === 'none' ? 'flex' : 'none';
    }
  });

  /* ═══════════ WEB AUDIO FX ═══════════ */
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume().catch(()=>{}); }
  }
  document.addEventListener('pointerdown', initAudio, { once: true });

  function playSciFiSound() {
    if (isMuted) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(440, now);
      osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      osc1.frequency.exponentialRampToValueAtTime(1320, now + 0.35);

      osc2.frequency.setValueAtTime(220, now);
      osc2.frequency.exponentialRampToValueAtTime(660, now + 0.3);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.45);
      osc2.stop(now + 0.45);
    } catch(e){}
  }

  /* ═══════════ MOTOR DE CÁLCULO DE PERFILES Y TEMAS ═══════════ */
  const avatarMemCache = {};

  async function obtenerAvatarKick(username) {
    const cleanUser = String(username || '').replace(/^@/, '').trim().toLowerCase();
    if (!cleanUser) return null;
    if (avatarMemCache[cleanUser]) return avatarMemCache[cleanUser];

    // 1. Firebase RTDB Cache
    if (window.StreamDB && typeof StreamDB.getUser === 'function') {
      try {
        const u = await StreamDB.getUser(cleanUser);
        if (u && u.avatar && String(u.avatar).startsWith('http')) {
          avatarMemCache[cleanUser] = u.avatar;
          return u.avatar;
        }
      } catch(e){}
    }

    // 2. Kick API v1
    try {
      const res = await fetch(`https://kick.com/api/v1/users/${encodeURIComponent(cleanUser)}`);
      if (res.ok) {
        const d = await res.json();
        const pic = d.profilepic || d.profile_pic || d.profile_image || d.avatar;
        if (pic && typeof pic === 'string' && pic.startsWith('http')) {
          avatarMemCache[cleanUser] = pic;
          if (window.StreamDB && typeof StreamDB.actualizarUsuario === 'function') {
            StreamDB.actualizarUsuario(cleanUser, { avatar: pic }).catch(()=>{});
          }
          return pic;
        }
      }
    } catch(e){}

    // 3. Kick API v2 (Canales / Broadcasters como Jikokun)
    try {
      const res2 = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(cleanUser)}`);
      if (res2.ok) {
        const d2 = await res2.json();
        const pic2 = d2.user?.profilepic || d2.user?.profile_pic || d2.user?.profile_image || d2.user?.avatar;
        if (pic2 && typeof pic2 === 'string' && pic2.startsWith('http')) {
          avatarMemCache[cleanUser] = pic2;
          if (window.StreamDB && typeof StreamDB.actualizarUsuario === 'function') {
            StreamDB.actualizarUsuario(cleanUser, { avatar: pic2 }).catch(()=>{});
          }
          return pic2;
        }
      }
    } catch(e2){}

    return null;
  }

  function calcularDatosTarjeta(u) {

    const xpPct = Math.min(100, Math.max(0, nivelInfo.porcentajeProgreso !== undefined ? nivelInfo.porcentajeProgreso : Math.round((xpEnNivel / xpParaSubir) * 100)));

    // Roles y Badges

      'theme-cyan': '🔵 CAZADOR FIEL',
      'theme-azul': '🔵 CAZADOR FIEL',
      'theme-green': '🟢 EXPLORADOR',
      'theme-verde': '🟢 EXPLORADOR',
      'theme-silver': '⚪ CACHORRO',
      'theme-gris': '⚪ CACHORRO'
    };

    if (u.marcoPerfil && u.marcoPerfil !== 'auto' && MARCO_LABELS[u.marcoPerfil]) {
      themeClass = u.marcoPerfil;
      themeLabel = MARCO_LABELS[u.marcoPerfil];
    } else if (isJiko) {
      themeClass = 'theme-owner';
      themeLabel = '👑 CREADOR & DUEÑO';
    } else if (esManadaVip) {
      themeClass = 'theme-unicorn';
      themeLabel = '🦄 MANADA VIP';
    } else if (isSub) {
      themeClass = 'theme-gold';
      themeLabel = '🪙 SUB GOLD';
    } else if (nivel >= 43) {
      themeClass = 'theme-red';
      themeLabel = '👑 MÁXIMO RANGO';
    } else if (nivel >= 34) {
      themeClass = 'theme-orange';
      themeLabel = '🐺 LOBO BETA';
    } else if (nivel >= 26) {
      themeClass = 'theme-purple';
      themeLabel = '🛡️ GUARDIÁN';
    } else if (nivel >= 16) {
      themeClass = 'theme-cyan';
      themeLabel = '🏹 CAZADOR FIEL';
    } else if (nivel >= 6) {
      themeClass = 'theme-green';
      themeLabel = '🌲 EXPLORADOR';
    } else {
      themeClass = 'theme-silver';
      themeLabel = '🐾 SEGUIDOR';
    }

    // Slots de Habilidades / Medallas
    const favDishKey = u.widgets?.tiendita?.platoFavorito || 'pupusas';
    const favDishEmoji = {
      pupusas:'🫓', tamal:'🫔', cafe:'☕', cerveza:'🍺', vinito:'🍷',
      hamburguesa:'🍔', taco:'🌮', pollofrito:'🍗', salchipapa:'🍟'
    }[favDishKey] || '🍽️';

    return {
      username: normUser,
      displayName: displayName,
      avatar: (u.avatar && String(u.avatar).startsWith('http')) ? u.avatar : null,
      nivel: nivel,
      rangoTitulo: (u._forceLevel && nivel >= 43) ? 'Lobo Alfa' : ((u._forceLevel && nivel >= 34) ? 'Lobo Beta' : (nivelInfo.rangoTitulo || 'Cachorro')),
      insigniaEmoji: (u._forceLevel && nivel >= 43) ? '👑' : ((u._forceLevel && nivel >= 34) ? '🐺' : (nivelInfo.insigniaEmoji || '🐾')),
      pts: pts,
      asistencias: asistencias,
      xpTotal: xpTotal,
      xpEnNivel: xpEnNivel,
      xpParaSubir: xpParaSubir,
      xpPct: xpPct,
      roleTag: roleTag,
      isOg: isOg,
      consumerTitle: consumerTitle,
      consumerBadge: consumerBadge,
      themeClass: themeClass,
      themeLabel: themeLabel,
      favDishEmoji: favDishEmoji,
      favDishKey: favDishKey,
      totalCompras: u.totalCompras || 0
    };
  }

  /* ═══════════ RENDER & DISPLAY DEL PERFIL FLOTANTE ═══════════ */
  let cardHideTimer = null;
  let cardTimerInterval = null;

  async function mostrarTarjetaPerfil(usernameOObjeto) {
    let uData = null;

    if (typeof usernameOObjeto === 'object' && usernameOObjeto !== null) {
      uData = usernameOObjeto;
    } else {
      const clean = String(usernameOObjeto || 'usuario').replace(/^@/, '').trim().toLowerCase();
      if (window.StreamDB) {
        try { uData = await StreamDB.getUser(clean); } catch(e){}
      }
      if (!uData) {
        uData = {
          username: clean,
          displayName: clean,
          jikopuntos: 1000,
          asistenciasCount: 0,
          experiencia: 0,
          nivel: 1,
          rangoTitulo: 'Cachorro',
          insigniaEmoji: '🐾'
        };
      }
    }

    const d = calcularDatosTarjeta(uData);

    const root = document.getElementById('card-root');
    if (!root) return;

    // Resetear clases de temas
    root.className = 'card-wrapper ' + d.themeClass;
    document.getElementById('card-theme-label').textContent = d.themeLabel;

    // Foto de perfil Kick
    const avEl = document.getElementById('card-avatar');
    if (d.avatar) {
      avEl.innerHTML = `<img src="${d.avatar}" alt="${d.displayName}" onerror="this.parentElement.textContent='${d.insigniaEmoji}';">`;
    } else {
      avEl.textContent = d.insigniaEmoji;
      // Intentar obtener avatar en segundo plano
      obtenerAvatarKick(d.username).then(pic => {
        if (pic && root.classList.contains('visible')) {
          avEl.innerHTML = `<img src="${pic}" alt="${d.displayName}" onerror="this.parentElement.textContent='${d.insigniaEmoji}';">`;
        }
      });
    }

    // Datos principales
    document.getElementById('card-role-badge').textContent = d.roleTag;
    const ogBadge = document.getElementById('card-extra-badge');
    if (d.isOg) {
      ogBadge.style.display = 'inline-flex';
      ogBadge.textContent = '🐺 OG';
    } else {
      ogBadge.style.display = 'none';
    }

    document.getElementById('card-display-name').textContent = '@' + d.displayName;
    document.getElementById('card-level-num').textContent = d.nivel;
    document.getElementById('card-rank-title').textContent = d.rangoTitulo.toUpperCase();

    // Estado Puntos & Asistencias
    document.getElementById('card-pts-val').textContent = '🪙 ' + d.pts.toLocaleString();
    const ptsWidth = Math.min(100, Math.max(15, Math.round((d.pts / 10000) * 100)));
    document.getElementById('card-pts-bar').style.width = ptsWidth + '%';

    document.getElementById('card-attend-val').textContent = '🐺 ' + d.asistencias + ' streams';
    const attWidth = Math.min(100, Math.max(10, Math.round((d.asistencias / 30) * 100)));
    document.getElementById('card-attend-bar').style.width = attWidth + '%';

    // Título Tiendita
    document.getElementById('card-consumer-title').textContent = d.consumerTitle;
    document.getElementById('card-consumer-tag').textContent = d.consumerBadge;

    // Slots de Habilidades / Medallas
    document.getElementById('skill-icon-1').textContent = d.insigniaEmoji;
    document.getElementById('skill-lbl-1').textContent = d.rangoTitulo;

    document.getElementById('skill-icon-2').textContent = d.roleTag.split(' ')[0] || '🐾';
    document.getElementById('skill-lbl-2').textContent = d.roleTag.split(' ')[1] || 'Manada';

    document.getElementById('skill-icon-3').textContent = d.asistencias >= 10 ? '🥇' : (d.asistencias >= 3 ? '🥈' : '🥉');
    document.getElementById('skill-lbl-3').textContent = d.asistencias > 0 ? `${d.asistencias} Asist.` : 'Novato';

    document.getElementById('skill-icon-4').textContent = d.favDishEmoji;
    document.getElementById('skill-lbl-4').textContent = d.favDishKey ? (d.favDishKey.slice(0, 7)) : 'Platillo';

    // XP
    document.getElementById('card-xp-ratio').textContent = `${d.xpTotal.toLocaleString()} XP (${d.xpPct}%)`;
    document.getElementById('card-xp-fill').style.width = d.xpPct + '%';

    // Mostrar en pantalla con animación
    root.classList.remove('saliendo');
    root.classList.add('visible');
    playSciFiSound();

    // Barra de tiempo y autocierre
    const timerBar = document.getElementById('card-timer-bar');
    if (timerBar) {
      timerBar.style.transition = 'none';
      timerBar.style.width = '100%';
      void timerBar.offsetWidth;
      timerBar.style.transition = `width ${DURATION_SEC}s linear`;
      timerBar.style.width = '0%';
    }

    if (cardHideTimer) clearTimeout(cardHideTimer);
    cardHideTimer = setTimeout(() => {
      ocultarTarjetaPerfil();
    }, DURATION_SEC * 1000);
  }

  function ocultarTarjetaPerfil() {
    const root = document.getElementById('card-root');
    if (!root) return;
    root.classList.add('saliendo');
    setTimeout(() => {
      root.classList.remove('visible', 'saliendo');
    }, 450);
  }

  /* ═══════════ WEBSOCKET STREAMER.BOT ═══════════ */
  let socket = null;
  function conectarWS() {
    try {
      socket = new WebSocket(WS_URL);
    } catch(e) {
      setTimeout(conectarWS, 3000);
      return;
    }

    socket.onopen = () => {
      console.log('[WidgetPerfil] 🟢 Conectado a Streamer.bot');
      socket.send(JSON.stringify({
        request: 'Subscribe',
        id: 'sub-perfil',
        events: {
          General: ['Custom'],
          Kick: ['ChatMessage', 'Message'],
          Twitch: ['ChatMessage']
        }
      }));
    };

    socket.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch(e){ return; }

      const eventObj = msg.event || {};
      const eventType = (
        (typeof eventObj === 'object' ? (eventObj.type || eventObj.name || '') : eventObj) || 
        msg.method || msg.type || ''
      ).toString().toLowerCase();

      const rawData = msg.data || msg.body || msg;
      const data = rawData.data || rawData;

      // Evento Custom
      if (eventType === 'custom' || msg.method === 'Custom') {
        if (data.action === 'Perfil' || data.command === '!perfil' || data.command === '!perfill') {
          const u = data.user || data.username || 'usuario';
          mostrarTarjetaPerfil(u);
          return;
        }
      }

      // Mensajes de Chat Kick / Twitch
      const isChat = eventType.includes('chatmessage') || eventType === 'message' || data.message || data.messageText;
      if (isChat) {
        const messageObj = data.message || data;
        let userObj = data.user || data.sender || (typeof messageObj === 'object' ? (messageObj.user || messageObj.sender) : null) || {};
        let sender = 'anon';
        if (typeof userObj === 'string') sender = userObj;
        else if (typeof userObj === 'object' && userObj !== null) {
          sender = userObj.username || userObj.name || userObj.displayName || data.userName || data.username || 'anon';
        }

        let texto = '';
        if (typeof data.messageText === 'string') texto = data.messageText;
        else if (typeof data.message === 'string') texto = data.message;
        else if (typeof messageObj === 'object' && messageObj !== null) {
          texto = messageObj.message || messageObj.text || '';
        }

        const t = (texto || '').toLowerCase().trim();
        if (t === '!perfil' || t === '!perfill' || t.startsWith('!perfil ') || t.startsWith('!perfill ')) {
          let target = sender;
          const partes = t.split(/\s+/);
          if (partes.length > 1 && partes[1].replace(/^@/, '').trim()) {
            target = partes[1].replace(/^@/, '').trim();
          }
          console.log(`[WidgetPerfil] 🪪 Comando !perfil invocado por @${sender} para @${target}`);
          mostrarTarjetaPerfil(target);
        }
      }
    };

    socket.onclose = () => setTimeout(conectarWS, 3000);
    socket.onerror = () => {};
  }
  conectarWS();

  /* ═══════════ FUNCIONES DE PRUEBA / DEMO ═══════════ */
  window.testPerfilUsuario = function(username) {
    mostrarTarjetaPerfil(username);
  };

    else if (themeClass === 'theme-cyan') { lvl = 21; xp = 14000; }
    else if (themeClass === 'theme-green') { lvl = 12; xp = 7800; }

    };

  };

  // Exponer a ventana global
  window.mostrarTarjetaPerfil = mostrarTarjetaPerfil;
  window.ocultarTarjetaPerfil = ocultarTarjetaPerfil;
</script>
