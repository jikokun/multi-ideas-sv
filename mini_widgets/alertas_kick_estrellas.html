<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Estelar Animada — Streamer.bot</title>
    
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Colores de fondo de la página para previsualización */
            --bg-page-start: #e1cbed;
            --bg-page-end: #f4e1f9;
            
            /* Colores base de la alerta (Modo Sub / Púrpura Estelar por defecto) */
            --alert-bg-dark: #1b1928;
            --alert-bg-light: #252336;
            --accent-border: #b1a7d1;
            --accent-fill-top: #4e4868;
            --accent-fill-bottom: #2d2940;
            --star-dark: #111016;
            --star-yellow: #fce882;
            --star-purple: #8f79c2;
            --star-white: #ffffff;
            --subtext-color: #b1a7d1;
            --username-glow: rgba(252, 232, 130, 0.6);
            --pill-shadow: rgba(0, 0, 0, 0.3);
        }

        /* =====================================================================
           TEMAS DE COLOR POR TIPO DE ALERTA DE KICK
           ===================================================================== */
        /* 1. SEGUIDOR: Verde Neón Kick & Jade Estelar */
        .theme-follow {
            --alert-bg-dark: #0a1f12;
            --alert-bg-light: #13331e;
            --accent-border: #53fc18;
            --accent-fill-top: #1b4d27;
            --accent-fill-bottom: #0f2e17;
            --star-dark: #07150c;
            --star-yellow: #53fc18;
            --star-purple: #86efac;
            --star-white: #ffffff;
            --subtext-color: #a7f3d0;
            --username-glow: rgba(83, 252, 24, 0.65);
        }

        /* 2. SUSCRIPCIÓN: Púrpura Cósmico y Oro Celestial */
        .theme-sub {
            --alert-bg-dark: #1b1928;
            --alert-bg-light: #252336;
            --accent-border: #b1a7d1;
            --accent-fill-top: #4e4868;
            --accent-fill-bottom: #2d2940;
            --star-dark: #111016;
            --star-yellow: #fce882;
            --star-purple: #8f79c2;
            --star-white: #ffffff;
            --subtext-color: #b1a7d1;
            --username-glow: rgba(252, 232, 130, 0.6);
        }

        /* 3. SUSCRIPCIÓN REGALADA: Rosa Neón & Flor de Loto Estelar */
        .theme-gift {
            --alert-bg-dark: #260e1d;
            --alert-bg-light: #3d172e;
            --accent-border: #f472b6;
            --accent-fill-top: #6d284f;
            --accent-fill-bottom: #38152a;
            --star-dark: #160811;
            --star-yellow: #fbcfe8;
            --star-purple: #f43f5e;
            --star-white: #ffffff;
            --subtext-color: #fbcfe8;
            --username-glow: rgba(244, 114, 182, 0.7);
        }

        /* 4. RAID / HOST: Naranja Fuego Solar Cósmico */
        .theme-raid {
            --alert-bg-dark: #291207;
            --alert-bg-light: #421e0d;
            --accent-border: #fb923c;
            --accent-fill-top: #7c3111;
            --accent-fill-bottom: #3d1708;
            --star-dark: #170904;
            --star-yellow: #fed7aa;
            --star-purple: #ea580c;
            --star-white: #ffffff;
            --subtext-color: #fed7aa;
            --username-glow: rgba(251, 146, 60, 0.7);
        }

        /* 5. KICKS / DONACIÓN / TIPS: Oro Brillante & Verde Esmeralda */
        .theme-kicks, .theme-donation, .theme-cheer {
            --alert-bg-dark: #211c05;
            --alert-bg-light: #3b320d;
            --accent-border: #facc15;
            --accent-fill-top: #63520e;
            --accent-fill-bottom: #332a07;
            --star-dark: #141103;
            --star-yellow: #fef08a;
            --star-purple: #53fc18;
            --star-white: #ffffff;
            --subtext-color: #fef08a;
            --username-glow: rgba(250, 204, 21, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        /* Fondo completamente transparente para OBS Studio por defecto */
        body {
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Si se activa modo fondo (para pruebas directas en navegador) */
        body.with-bg {
            background: linear-gradient(135deg, var(--bg-page-start), var(--bg-page-end)) !important;
        }

        /* Botón discreto para accionar la alerta en pruebas */
        .trigger-btn {
            position: fixed;
            bottom: 20px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            background: #6a4c93;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(106, 76, 147, 0.4);
            transition: transform 0.2s, background 0.2s;
            z-index: 10;
        }

        .trigger-btn:hover {
            background: #593c7a;
            transform: scale(1.05);
        }

        .trigger-btn.hidden {
            display: none !important;
        }

        /* Panel de botones de prueba - Oculto por defecto, visible con clic/interacción */
        .test-bar {
            position: fixed;
            bottom: 15px;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .test-bar.hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(20px) !important;
        }

        .test-bar button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .test-bar button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* Estado de conexión Kick Cloud - Oculto por defecto, visible con clic/interacción */
        .kick-status-indicator {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(83, 252, 24, 0.45);
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 11px;
            font-weight: 700;
            color: #53fc18;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .kick-status-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #53fc18;
            box-shadow: 0 0 8px #53fc18;
        }

        .kick-status-indicator.hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(-20px) !important;
        }

        /* Contenedor del Overlay (Transparente para OBS Studio) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        /* En modo con fondo previsualizador aplica suave desenfoque */
        body.with-bg .overlay {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(3px);
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Caja de la alerta */
        .alert-box {
            width: 90%;
            max-width: 550px;
            height: 180px;
            background: linear-gradient(120deg, var(--alert-bg-dark) 0%, var(--alert-bg-light) 50%, var(--alert-bg-dark) 100%);
            border-radius: 16px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transform: scale(0.5);
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .overlay.active .alert-box {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .overlay.exiting .alert-box {
            animation: popOut 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8) translateY(-20px); opacity: 0; }
        }

        /* Píldora Superior */
        .top-pill {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 48px;
            background: linear-gradient(to bottom, var(--accent-fill-top), var(--accent-fill-bottom));
            border-radius: 999px;
            border: 2px solid var(--accent-border);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        .top-pill h2 {
            font-size: 16px;
            color: #ffffff;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Rombo Inferior */
        .bottom-diamond {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-fill-top), var(--accent-fill-bottom));
            border-radius: 8px;
            border: 2px solid var(--accent-border);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
            z-index: 2;
            transition: all 0.4s ease;
        }

        /* Contenido de texto interno */
        .content {
            z-index: 5;
            color: white;
            padding: 0 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 100%;
        }

        .username {
            color: var(--star-yellow); /* Color estelar integrado al tema */
            font-weight: 800;
            font-size: 32px; /* Más grande al aprovechar el espacio */
            letter-spacing: 0.5px;
            text-shadow: 0 0 16px var(--username-glow);
            display: block;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 440px;
            line-height: 1.15;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .alert-subtitle {
            font-size: 15px;
            color: var(--subtext-color);
            margin: 0;
            letter-spacing: 0.5px;
            font-weight: 600;
            line-height: 1.35;
            max-width: 460px;
            white-space: normal;
            transition: color 0.4s ease;
        }

        /* Decoraciones Absolutas (Estrellas y Líneas) */
        .deco {
            position: absolute;
            pointer-events: none;
        }

        /* Estrellas Oscuras Grandes */
        .star-large-left {
            top: -30px;
            left: -40px;
            width: 130px;
            height: 130px;
            z-index: 3;
            transform: rotate(-15deg);
            animation: float 4s ease-in-out infinite;
        }

        .star-large-right {
            bottom: -30px;
            right: -25px;
            width: 100px;
            height: 100px;
            z-index: 3;
            transform: rotate(15deg);
            animation: float 5s ease-in-out infinite reverse;
        }

        /* Estrellas Pequeñas de Colores con Resplandor y Movimiento */
        .star-small { 
            width: 15px; 
            height: 15px; 
            animation: twinkle 3s ease-in-out infinite;
        }
        .s-purple-1 { bottom: 15px; left: 20%; width: 22px; height: 22px; --base-rot: -20deg; --glow: var(--star-purple); animation-delay: 0.2s;}
        .s-yellow-1 { top: 40px; right: 25%; width: 12px; height: 12px; --base-rot: 0deg; --glow: var(--star-yellow); animation-delay: 1.5s;}
        .s-white-1 { top: 30px; left: 15%; width: 8px; height: 8px; --base-rot: 0deg; --glow: var(--star-white); animation-delay: 0.8s;}
        .s-yellow-2 { bottom: 30px; left: 40%; width: 12px; height: 12px; --base-rot: 0deg; --glow: var(--star-yellow); animation-delay: 2.1s;}
        .s-purple-2 { top: 20px; right: 8%; width: 16px; height: 16px; --base-rot: 25deg; --glow: var(--star-purple); animation-delay: 1.1s;}
        .s-white-2 { bottom: 40px; right: 18%; width: 10px; height: 10px; --base-rot: 0deg; --glow: var(--star-white); animation-delay: 0.5s;}

        /* Constelaciones (Líneas punteadas) */
        .constellation {
            fill: none;
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 1.5;
            stroke-dasharray: 2 4;
            stroke-linecap: round;
        }
        
        .constellation-svg {
            width: 80px;
            height: 80px;
            z-index: 1;
        }

        .c-bottom-left {
            bottom: 10px;
            left: 10px;
            transform: rotate(15deg);
        }

        .c-top-right {
            top: 10px;
            right: 15%;
            transform: rotate(-10deg);
            width: 120px;
        }

        /* Animación flotante y resplandor para las estrellas gigantes */
        @keyframes float {
            0% { transform: translateY(0) rotate(var(--rot, 0deg)); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)) drop-shadow(0 0 4px rgba(255,255,255,0.0)); }
            50% { transform: translateY(-8px) rotate(calc(var(--rot, 0deg) + 3deg)); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.3)) drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
            100% { transform: translateY(0) rotate(var(--rot, 0deg)); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)) drop-shadow(0 0 4px rgba(255,255,255,0.0)); }
        }

        /* Animación de destello, movimiento y brillo para las estrellas pequeñas */
        @keyframes twinkle {
            0% { transform: rotate(var(--base-rot)) scale(0.8) translate(0, 0); opacity: 0.6; filter: drop-shadow(0 0 2px var(--glow)); }
            50% { transform: rotate(var(--base-rot)) scale(1.3) translate(3px, -3px); opacity: 1; filter: drop-shadow(0 0 12px var(--glow)); }
            100% { transform: rotate(var(--base-rot)) scale(0.8) translate(0, 0); opacity: 0.6; filter: drop-shadow(0 0 2px var(--glow)); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .alert-box { height: 160px; }
            .star-large-left { width: 100px; height: 100px; left: -20px; top: -20px;}
            .star-large-right { width: 80px; height: 80px; right: -10px; bottom: -20px;}
            .top-pill { width: 75%; height: 40px; top: -20px;}
            .username { font-size: 26px; }
        }
    </style>
</head>
<body>

    <!-- Indicador de Estado Kick Cloud (Oculto por defecto, visible con clic/interacción) -->
    <div class="kick-status-indicator hidden" id="kickStatusBadge">
        <span class="dot" id="kickDot"></span>
        <span id="kickStatusText">Kick: Conectando...</span>
    </div>

    <!-- Botonera de Pruebas de Alerta (Oculta por defecto, visible con clic/interacción) -->
    <div class="test-bar hidden" id="testBar">
        <button onclick="triggerAlertByType('follow')">💚 Follow</button>
        <button onclick="triggerAlertByType('sub')">⭐ Sub</button>
        <button onclick="triggerAlertByType('gift')">🎁 Gift</button>
        <button onclick="triggerAlertByType('raid')">🚀 Raid</button>
        <button onclick="triggerAlertByType('kicks')">💎 Kicks</button>
    </div>

    <!-- Overlay y Contenedor de la Alerta -->
    <div class="overlay" id="overlay">
        <div class="alert-box" id="alertBox">
            
            <!-- Elementos UI Superiores/Inferiores -->
            <div class="top-pill">
                <h2 id="alertTitle">¡Nuevo Seguidor!</h2>
            </div>
            <div class="bottom-diamond"></div>

            <!-- Constelaciones (Líneas punteadas curvas) -->
            <svg class="deco constellation-svg c-bottom-left" viewBox="0 0 100 100">
                <path class="constellation" d="M 10 90 Q 30 40 80 10" />
            </svg>
            <svg class="deco constellation-svg c-top-right" viewBox="0 0 150 100">
                <path class="constellation" d="M 0 50 Q 75 90 150 10" />
            </svg>

            <!-- Estrella Gigante Izquierda -->
            <svg class="deco star-large-left" style="--rot: -15deg;" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" 
                      fill="var(--star-dark)" 
                      stroke="var(--accent-border)" 
                      stroke-width="3" 
                      stroke-linejoin="round"/>
            </svg>

            <!-- Estrella Gigante Derecha -->
            <svg class="deco star-large-right" style="--rot: 15deg;" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" 
                      fill="var(--star-dark)" 
                      stroke="var(--accent-border)" 
                      stroke-width="3.5" 
                      stroke-linejoin="round"/>
            </svg>

            <!-- Estrellas Pequeñas Esparcidas -->
            <!-- Morada inferior -->
            <svg class="deco star-small s-purple-1" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" fill="var(--star-purple)" />
            </svg>
            <!-- Amarilla superior -->
            <svg class="deco star-small s-yellow-1" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" fill="var(--star-yellow)" />
            </svg>
            <!-- Blanca izquierda -->
            <svg class="deco star-small s-white-1" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" fill="var(--star-white)" />
            </svg>
            <!-- Amarilla inferior centro -->
            <svg class="deco star-small s-yellow-2" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" fill="var(--star-yellow)" />
            </svg>
             <!-- Morada superior derecha -->
             <svg class="deco star-small s-purple-2" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" fill="var(--star-purple)" />
            </svg>
            <!-- Blanca derecha -->
            <svg class="deco star-small s-white-2" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L93 35 L67 54 L77 84 L50 65 L23 84 L33 54 L7 35 L39 35 Z" fill="var(--star-white)" />
            </svg>

            <!-- Contenido textual de Alerta Kick: Usuario que la activó y por qué la activó -->
            <div class="content">
                <span id="followerName" class="username">Usuario</span>
                <p id="alertSubtitle" class="alert-subtitle">Se ha unido a la tripulación</p>
            </div>

        </div>
    </div>

    <script>
        // =====================================================================
        // PARÁMETROS URL Y CONFIGURACIÓN
        // =====================================================================
        const urlParams = new URLSearchParams(window.location.search);
        const kickChannel = (urlParams.get('channel') || urlParams.get('streamer') || 'jikokun').trim().toLowerCase().replace(/^@/, '');
        const isPreview = urlParams.get('preview') === 'true';
        let isLoopMode = urlParams.get('loop') === 'true';
        const isMuted = urlParams.get('mute') === 'true';
        const hideControls = urlParams.get('hidecontrols') === 'true';
        const withBg = urlParams.get('bg') === 'true';
        
        const durationParam = parseFloat(urlParams.get('duration'));
        const alertDuration = (!isNaN(durationParam) && durationParam >= 2 && durationParam <= 20) 
            ? durationParam * 1000 
            : 5000;

        let alertVolume = 0.85;
        const volParam = parseFloat(urlParams.get('volume'));
        if (!isNaN(volParam)) {
            alertVolume = volParam > 1 ? volParam / 100 : volParam;
        }

        if (withBg) {
            document.body.classList.add('with-bg');
        }

        // =====================================================================
        // CONTROLES INTERACTIVOS (OCULTOS POR DEFECTO, VISIBLES AL DAR CLIC)
        // =====================================================================
        let controlsVisible = false;

        function toggleControls(forceState) {
            controlsVisible = typeof forceState === 'boolean' ? forceState : !controlsVisible;
            const testBar = document.getElementById('testBar');
            const statusBadge = document.getElementById('kickStatusBadge');

            if (controlsVisible) {
                testBar?.classList.remove('hidden');
                statusBadge?.classList.remove('hidden');
            } else {
                testBar?.classList.add('hidden');
                statusBadge?.classList.add('hidden');
            }
        }

        // Alternar visibilidad al interactuar o hacer clic en la pantalla
        window.addEventListener('click', (e) => {
            // Si el clic fue dentro de los botones de prueba, no cerrar la barra
            if (e.target.closest('#testBar') || e.target.closest('#kickStatusBadge')) {
                return;
            }
            toggleControls();
        });

        // Si se fuerza ocultar por parámetro URL (ej. hidecontrols=true)
        if (hideControls) {
            toggleControls(false);
        }

        // =====================================================================
        // PLANTILLAS DE TEXTOS PERSONALIZABLES CON VARIABLES DINÁMICAS
        // =====================================================================
        const customTexts = {
            follow: urlParams.get('txt_follow') || 'Se ha unido a la tripulación',
            sub: urlParams.get('txt_sub') || 'Lleva {meses} meses en la nave',
            sub_new: urlParams.get('txt_newsub') || 'Ha abordado la nave estelar',
            gift: urlParams.get('txt_gift') || 'Regaló {subs} suscripciones a la tripulación',
            raid: urlParams.get('txt_raid') || 'Aterrizó con {viewers} tripulantes',
            kicks: urlParams.get('txt_kicks') || 'Ha enviado {kicks} de combustible estelar'
        };

        function formatAlertSubtitle(template, vars = {}) {
            let res = String(template || '');
            const count = vars.count !== undefined ? vars.count : (vars.amount !== undefined ? vars.amount : (vars.months || vars.subs || vars.viewers || vars.kicks || 1));
            const formattedKicks = (vars.kicks !== undefined && !isNaN(vars.kicks)) ? Number(vars.kicks).toLocaleString() : count;
            
            // Reemplazo flexible de variables tolerante a espacios y mayúsculas
            res = res.replace(/\{\s*(meses|mes)\s*\}/gi, vars.months !== undefined ? vars.months : count);
            res = res.replace(/\{\s*(subs|sub|regaladas)\s*\}/gi, vars.subs !== undefined ? vars.subs : count);
            res = res.replace(/\{\s*(viewers|espectadores|raiders|personas)\s*\}/gi, vars.viewers !== undefined ? vars.viewers : count);
            res = res.replace(/\{\s*(kicks|kick|gemas|monedas)\s*\}/gi, formattedKicks);
            res = res.replace(/\{\s*(cantidad|count|amount|n)\s*\}/gi, count);
            res = res.replace(/\{\s*(user|usuario|streamer|gifter|autor)\s*\}/gi, vars.user || '');
            res = res.replace(/\{\s*(recipient|destinatario|para)\s*\}/gi, vars.recipient || 'la comunidad');
            res = res.replace(/\{\s*(tier|nivel)\s*\}/gi, vars.tier || '1');
            return res;
        }

        // =====================================================================
        // SINTETIZADOR DE AUDIO WEB AUDIO API (Campanillas Celestes)
        // =====================================================================
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playAlertSound(type) {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(0.3 * alertVolume, now);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
                masterGain.connect(ctx.destination);

                let freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Follow)
                if (type === 'sub') freqs = [587.33, 739.99, 880.00, 1174.66, 1479.98]; // Re Mayor Celestial
                else if (type === 'gift') freqs = [659.25, 830.61, 987.77, 1318.51]; // Rosa Mágico
                else if (type === 'raid') freqs = [440.00, 554.37, 659.25, 880.00, 1108.73]; // Fanfarria
                else if (type === 'kicks') freqs = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51]; // Oro brillante

                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const noteGain = ctx.createGain();
                    const startTime = now + (idx * 0.08);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    noteGain.gain.setValueAtTime(0.001, startTime);
                    noteGain.gain.linearRampToValueAtTime(0.3, startTime + 0.015);
                    noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.8);

                    osc.connect(noteGain);
                    noteGain.connect(masterGain);

                    osc.start(startTime);
                    osc.stop(startTime + 0.85);
                });
            } catch(e) {
                console.warn("[Web Audio Error]:", e);
            }
        }

        // =====================================================================
        // COLA DE ALERTAS FIFO Y CONTROL VISUAL
        // =====================================================================
        const alertQueue = [];
        let isAlertActive = false;
        let alertTimeout = null;
        let currentAlertData = null;

        const overlay = document.getElementById('overlay');
        const alertBox = document.getElementById('alertBox');
        const alertTitle = document.getElementById('alertTitle');
        const alertSubtitle = document.getElementById('alertSubtitle');
        const followerName = document.getElementById('followerName');

        function queueAlert(data) {
            alertQueue.push(data);
            processQueue();
        }

        function processQueue() {
            if (isAlertActive || alertQueue.length === 0) return;
            const current = alertQueue.shift();
            displayAlert(current);
        }

        function displayAlert(data) {
            isAlertActive = true;
            currentAlertData = data;

            // 1. Limpiar temas anteriores y asignar el tema de color correspondiente
            document.body.className = document.body.className.replace(/\btheme-\S+/g, '').trim();
            document.body.classList.add(`theme-${data.type}`);

            // 2. Insertar contenidos textuales
            alertTitle.textContent = data.title || '¡Nuevo Evento!';
            alertSubtitle.textContent = data.subtitle || 'Se ha unido a la tripulación';
            followerName.textContent = data.username || 'Usuario';

            // 3. Reproducir audio sintetizado
            playAlertSound(data.type);

            // 4. Forzar reinicio limpio de la animación
            overlay.classList.remove('active', 'exiting');
            void overlay.offsetWidth; // Forzar reflow para reiniciar la animación popIn inmediatamente
            overlay.classList.add('active');

            // 5. Temporizador para ocultar y dar paso a la siguiente alerta
            const visibleDuration = Math.max(2500, alertDuration - 500);

            alertTimeout = setTimeout(() => {
                overlay.classList.add('exiting');
                setTimeout(() => {
                    overlay.classList.remove('active');
                    overlay.classList.remove('exiting');
                    isAlertActive = false;
                    currentAlertData = null;

                    // Si está en modo bucle continuo (para previsualización)
                    if (isLoopMode && alertQueue.length === 0) {
                        setTimeout(() => {
                            triggerRandomTest();
                        }, 1200);
                    } else {
                        processQueue();
                    }
                }, 450);
            }, visibleDuration);
        }

        // =====================================================================
        // SIMULADOR DE EVENTOS DE PRUEBA
        // =====================================================================
        const mockUsers = ["NinjaEspacial", "EstrellaFugaz_99", "CapitanKick", "NovaGamerZ", "Astro_Boy", "CosmicLuna", "Jikokun"];

        function triggerAlertByType(type) {
            if (alertTimeout) {
                clearTimeout(alertTimeout);
                alertTimeout = null;
            }
            isAlertActive = false;

            const randomName = mockUsers[Math.floor(Math.random() * mockUsers.length)];

            switch(type) {
                case 'follow':
                    displayAlert({
                        type: 'follow',
                        title: '¡Nuevo Seguidor!',
                        subtitle: formatAlertSubtitle(customTexts.follow, { user: randomName }),
                        username: randomName
                    });
                    break;
                case 'sub':
                    const months = [1, 2, 3, 6, 12][Math.floor(Math.random() * 5)];
                    const isResub = months > 1;
                    const subTpl = (months === 1 && customTexts.sub_new && customTexts.sub_new !== 'Ha abordado la nave estelar') 
                        ? customTexts.sub_new 
                        : (isResub ? customTexts.sub : '¡Se ha suscrito al canal estelar!');
                    displayAlert({
                        type: 'sub',
                        count: months,
                        months: months,
                        title: isResub ? '¡Resuscripción!' : '¡Nueva Suscripción!',
                        subtitle: formatAlertSubtitle(subTpl, { months: months, count: months, user: randomName }),
                        username: randomName
                    });
                    break;
                case 'gift':
                    const gifts = [1, 5, 10, 20][Math.floor(Math.random() * 4)];
                    const otherUser = mockUsers.filter(u => u !== randomName)[0] || 'Tripulante';
                    const giftSubtitle = gifts > 1 
                        ? formatAlertSubtitle(customTexts.gift, { subs: gifts, count: gifts, user: randomName })
                        : formatAlertSubtitle('¡Le regaló una sub a @{recipient}!', { subs: 1, count: 1, user: randomName, recipient: otherUser });
                    displayAlert({
                        type: 'gift',
                        count: gifts,
                        subs: gifts,
                        title: gifts > 1 ? '¡Lluvia de Subs!' : '¡Sub Regalada!',
                        subtitle: giftSubtitle,
                        username: randomName
                    });
                    break;
                case 'raid':
                    const viewers = Math.floor(Math.random() * 200) + 15;
                    displayAlert({
                        type: 'raid',
                        count: viewers,
                        viewers: viewers,
                        title: '¡Raid Entrante!',
                        subtitle: formatAlertSubtitle(customTexts.raid, { viewers: viewers, count: viewers, user: randomName }),
                        username: randomName
                    });
                    break;
                case 'kicks':
                    const kicks = [100, 250, 500, 1000, 2500][Math.floor(Math.random() * 5)];
                    displayAlert({
                        type: 'kicks',
                        count: kicks,
                        kicks: kicks,
                        title: '¡Kicks Aportados!',
                        subtitle: formatAlertSubtitle(customTexts.kicks, { kicks: kicks, count: kicks, user: randomName }),
                        username: randomName
                    });
                    break;
            }
        }

        function triggerRandomTest() {
            const types = ['follow', 'sub', 'gift', 'raid', 'kicks'];
            const randomType = types[Math.floor(Math.random() * types.length)];
            triggerAlertByType(randomType);
        }

        // =====================================================================
        // CONEXIÓN DIRECTA CON STREAMER.BOT (0 MS DE LATENCIA LOCAL)
        // PUERTO 4445 POR DEFECTO EN EL 99% DE LAS INSTALACIONES MODERNAS
        // =====================================================================
        let streamerBotWs = null;
        let streamerBotHost = urlParams.get('host') || '127.0.0.1';
        let streamerBotPort = urlParams.get('port') || '4445'; // Puerto 4445 por defecto
        let wsReconnectAttempts = 0;
        let currentPortIndex = 0;
        const FALLBACK_PORTS = [streamerBotPort, '4445', '8080', '7474'].filter((v, i, a) => a.indexOf(v) === i);

        function updateSbStatus(status, text) {
            const statusText = document.getElementById('kickStatusText');
            const statusDot = document.getElementById('kickDot');
            if (statusText) statusText.textContent = text;
            if (statusDot) {
                if (status === 'connected') {
                    statusDot.style.background = '#53fc18';
                    statusDot.style.boxShadow = '0 0 10px #53fc18';
                } else if (status === 'connecting') {
                    statusDot.style.background = '#38bdf8';
                    statusDot.style.boxShadow = '0 0 8px #38bdf8';
                } else {
                    statusDot.style.background = '#f43f5e';
                    statusDot.style.boxShadow = 'none';
                }
            }
        }

        function connectStreamerBot() {
            if (streamerBotWs) {
                try {
                    streamerBotWs.onclose = null;
                    streamerBotWs.onerror = null;
                    streamerBotWs.close();
                } catch(e) {}
                streamerBotWs = null;
            }

            const activePort = FALLBACK_PORTS[currentPortIndex % FALLBACK_PORTS.length];
            const wsUrl = `ws://${streamerBotHost}:${activePort}/`;
            updateSbStatus('connecting', `Streamer.bot: ${streamerBotHost}:${activePort}...`);

            try {
                streamerBotWs = new WebSocket(wsUrl);

                streamerBotWs.onopen = () => {
                    console.log(`[Streamer.bot Alertas Estelares] ¡Conectado con éxito a ${wsUrl}!`);
                    wsReconnectAttempts = 0;
                    updateSbStatus('connected', `Streamer.bot: Conectado (${activePort})`);

                    // Suscribirse EXCLUSIVAMENTE a los 5 eventos solicitados (Sub, Gift, Raid, Kicks, Follow)
                    // Se excluyen expresamente ChatMessage, RewardRedemption y eventos Custom generales
                    const subscribePayload = {
                        request: "Subscribe",
                        id: "star-alerts-sub",
                        events: {
                            Kick: [
                                "Follow",
                                "Subscription",
                                "GiftSub",
                                "GiftBomb",
                                "Raid",
                                "Kicks"
                            ],
                            Twitch: [
                                "Follow",
                                "Sub",
                                "Resub",
                                "GiftSub",
                                "GiftBomb",
                                "CommunityGift",
                                "Raid",
                                "Cheer"
                            ],
                            YouTube: [
                                "Subscribe",
                                "MembershipGift",
                                "SuperChat"
                            ]
                        }
                    };
                    streamerBotWs.send(JSON.stringify(subscribePayload));
                };

                streamerBotWs.onmessage = (event) => {
                    try {
                        const payload = JSON.parse(event.data);
                        handleStreamerBotEvent(payload);
                    } catch(err) {
                        console.warn("[Streamer.bot] Error procesando mensaje WebSocket:", err);
                    }
                };

                streamerBotWs.onerror = (e) => {
                    console.warn(`[Streamer.bot] Error en puerto ${activePort}:`, e);
                };

                streamerBotWs.onclose = () => {
                    updateSbStatus('offline', `Streamer.bot: Desconectado`);
                    // Rotar al siguiente puerto si falla
                    currentPortIndex++;
                    wsReconnectAttempts++;
                    const delay = wsReconnectAttempts > 4 ? 5000 : 2000;
                    setTimeout(connectStreamerBot, delay);
                };

            } catch(e) {
                console.warn("[Streamer.bot] Fallo al instanciar WebSocket:", e);
                currentPortIndex++;
                setTimeout(connectStreamerBot, 2500);
            }
        }

        // =====================================================================
        // PROCESADOR DE EVENTOS DE STREAMER.BOT (FILTRADO ESTRICTO DE 5 EVENTOS)
        // Solo absorbe: sub, regalos de sub, raid, kicks y follow
        // Muestra el nombre de usuario que la activó y por qué la activó
        // =====================================================================
        function handleStreamerBotEvent(payload) {
            if (!payload) return;

            // Descartar confirmaciones de suscripción o mensajes de estado
            if (payload.status === 'ok' || payload.id === 'star-alerts-sub') {
                console.log("[Streamer.bot Alertas] Suscripción a eventos confirmada por Streamer.bot.");
                return;
            }

            // Identificar fuente y tipo de evento de Streamer.bot
            let source = '';
            let eventType = '';
            if (payload.event) {
                if (typeof payload.event === 'string') {
                    eventType = payload.event;
                } else if (typeof payload.event === 'object') {
                    source = payload.event.source || '';
                    eventType = payload.event.type || '';
                }
            }
            if (!eventType && payload.type) eventType = payload.type;
            if (!eventType && payload.data?.event) eventType = payload.data.event;
            if (!eventType && payload.data?.type) eventType = payload.data.type;

            const data = payload.data || {};
            const evLower = String(eventType).toLowerCase().trim();
            const srcLower = String(source).toLowerCase().trim();

            console.log(`[Streamer.bot Evento Entrante]: [${source}].[${eventType}]`, data);

            // Helper para extraer nombre de usuario seguro de cualquier estructura de Streamer.bot
            function getUsername(candidates, fallback = 'Usuario') {
                for (const c of candidates) {
                    if (!c) continue;
                    if (typeof c === 'string' && c.trim()) return c.trim();
                    if (typeof c === 'object') {
                        const name = c.username || c.displayName || c.display_name || c.name || c.user_name || c.login || c.slug;
                        if (name && typeof name === 'string' && name.trim()) return name.trim();
                    }
                }
                return fallback;
            }

            // -----------------------------------------------------------------
            // 1. REGALOS DE SUBS (GiftSub, GiftBomb, CommunityGift)
            // Se evalúa PRIMERO porque "giftsub" contiene la palabra "sub"
            // -----------------------------------------------------------------
            const isGiftEvent = evLower.includes('giftsub') || 
                                evLower.includes('giftbomb') || 
                                evLower.includes('communitygift') || 
                                evLower.includes('membershipgift') || 
                                (evLower.includes('gift') && !evLower.includes('kicks')) ||
                                data.is_gift === true || 
                                data.isGift === true;

            if (isGiftEvent) {
                // Quién la activó: El usuario que regaló las suscripciones
                const gifter = getUsername([
                    data.gifter, data.gifterUser, data.gifter_username,
                    data.user, data.user_name, data.username, data.sender
                ], 'Amigo del Canal');

                // Cantidad de subs regaladas
                const giftCount = Number(data.giftCount || data.count || data.numGifts || data.totalGifts || data.gifts || data.subCount || data.gifted_usernames?.length || 1) || 1;

                // Destinatario si fue regalo individual
                const recipient = getUsername([
                    data.recipient, data.recipientUser, data.recipient_username, data.targetUser
                ], '');

                // Por qué la activó (motivo descriptivo)
                let reason = '';
                if (giftCount > 1) {
                    reason = formatAlertSubtitle(customTexts.gift, { user: gifter, subs: giftCount, count: giftCount });
                } else if (recipient) {
                    reason = formatAlertSubtitle('¡Le regaló una sub a @{recipient}!', { user: gifter, subs: 1, count: 1, recipient: recipient });
                } else {
                    reason = formatAlertSubtitle(customTexts.gift, { user: gifter, subs: 1, count: 1 });
                }

                queueAlert({
                    type: 'gift',
                    title: giftCount > 1 ? '¡Lluvia de Subs!' : '¡Sub Regalada!',
                    subtitle: reason,
                    username: gifter,
                    subs: giftCount,
                    count: giftCount
                });
                return;
            }

            // -----------------------------------------------------------------
            // 2. SUSCRIPCIONES (Sub, Resub, Subscription)
            // -----------------------------------------------------------------
            const isSubEvent = (evLower.includes('subscription') || 
                               evLower.includes('resub') || 
                               evLower === 'sub' || 
                               (srcLower === 'youtube' && evLower === 'subscribe')) && !isGiftEvent;

            if (isSubEvent) {
                // Quién la activó: El suscriptor
                const u = getUsername([
                    data.user, data.subscriber, data.user_name, data.username, data.name
                ], 'Nuevo Suscriptor');

                // Meses acumulados / antigüedad
                const months = Number(data.months || data.cumulative_months || data.sub_months || data.duration || data.monthsSubscribed || data.tier_months || 1) || 1;
                const isResub = months > 1;

                // Plantilla según sea primera vez o renovación
                const subTpl = (months === 1 && customTexts.sub_new && customTexts.sub_new !== 'Ha abordado la nave estelar')
                    ? customTexts.sub_new
                    : (isResub ? customTexts.sub : '¡Se ha suscrito al canal estelar!');

                // Por qué la activó
                const reason = formatAlertSubtitle(subTpl, { user: u, months: months, count: months });

                queueAlert({
                    type: 'sub',
                    title: isResub ? '¡Resuscripción!' : '¡Nueva Suscripción!',
                    subtitle: reason,
                    username: u,
                    months: months,
                    count: months
                });
                return;
            }

            // -----------------------------------------------------------------
            // 3. SEGUIDOR / FALLOW (Follow)
            // -----------------------------------------------------------------
            const isFollowEvent = evLower.includes('follow') || (srcLower === 'kick' && evLower === 'follow');

            if (isFollowEvent) {
                // Quién la activó: El nuevo seguidor
                const u = getUsername([
                    data.user, data.follower, data.user_name, data.username, data.name
                ], 'Nuevo Seguidor');

                // Por qué la activó
                const reason = formatAlertSubtitle(customTexts.follow, { user: u });

                queueAlert({
                    type: 'follow',
                    title: '¡Nuevo Seguidor!',
                    subtitle: reason,
                    username: u
                });
                return;
            }

            // -----------------------------------------------------------------
            // 4. RAID / HOST (Raid, Host)
            // -----------------------------------------------------------------
            const isRaidEvent = evLower.includes('raid') || evLower.includes('host');

            if (isRaidEvent) {
                // Quién la activó: El streamer que envía la raid
                const u = getUsername([
                    data.raider, data.host, data.from_broadcaster_user_name,
                    data.user, data.user_name, data.username, data.name
                ], 'Streamer Amigo');

                // Cantidad de espectadores
                const viewers = Number(data.viewers || data.viewerCount || data.viewer_count || data.raiders || data.count || 0) || 0;

                // Por qué la activó
                const reason = formatAlertSubtitle(customTexts.raid, { user: u, viewers: viewers, count: viewers });

                queueAlert({
                    type: 'raid',
                    title: '¡Raid Entrante!',
                    subtitle: reason,
                    username: u,
                    viewers: viewers,
                    count: viewers
                });
                return;
            }

            // -----------------------------------------------------------------
            // 5. KICKS / MONEDA DE APOYO (Kicks, Cheer, Tip, Donación directa)
            // Se descarta expresamente cualquier mensaje común de chat
            // -----------------------------------------------------------------
            const isKicksEvent = (evLower === 'kicks' || 
                                 evLower === 'kick' || 
                                 (evLower.includes('kick') && !evLower.includes('message') && !evLower.includes('chat')) || 
                                 evLower.includes('cheer') || 
                                 evLower.includes('tip') || 
                                 evLower === 'superchat') && 
                                 !evLower.includes('message');

            if (isKicksEvent) {
                // Quién la activó: El donante de kicks
                const u = getUsername([
                    data.user, data.sender, data.donor, data.donorUser,
                    data.user_name, data.username, data.name
                ], 'Tripulante VIP');

                // Cantidad de kicks / gemas aportadas
                const kicksAmount = Number(data.amount || data.kicks || data.quantity || data.count || data.bits || 100) || 100;

                // Por qué la activó
                const reason = formatAlertSubtitle(customTexts.kicks, { user: u, kicks: kicksAmount, count: kicksAmount });

                queueAlert({
                    type: 'kicks',
                    title: '¡Kicks Aportados!',
                    subtitle: reason,
                    username: u,
                    kicks: kicksAmount,
                    count: kicksAmount
                });
                return;
            }

            // -----------------------------------------------------------------
            // CUALQUIER OTRO EVENTO: DESCARTAR COMPLETAMENTE
            // (ChatMessage, RewardRedemption, Ban, Custom actions, etc.)
            // -----------------------------------------------------------------
            console.log(`[Streamer.bot Alertas Estelares] Evento ignorado (no es sub, regalos de sub, raid, kicks ni follow): [${source}].[${eventType}]`);
        }

        // =====================================================================
        // COMUNICACIÓN CON LA GALERÍA INDEX.HTML (POSTMESSAGE)
        // =====================================================================
        window.addEventListener('message', (event) => {
            if (!event.data) return;

            if (event.data.type === 'TRIGGER_TEST_ALERT') {
                triggerAlertByType(event.data.alertType || 'follow');
            } else if (event.data.type === 'SET_STREAMERBOT_CONFIG') {
                let changed = false;
                if (event.data.host && event.data.host !== streamerBotHost) {
                    streamerBotHost = event.data.host;
                    changed = true;
                }
                if (event.data.port && event.data.port !== streamerBotPort) {
                    streamerBotPort = String(event.data.port);
                    if (!FALLBACK_PORTS.includes(streamerBotPort)) {
                        FALLBACK_PORTS.unshift(streamerBotPort);
                    }
                    currentPortIndex = 0;
                    changed = true;
                }
                if (changed) {
                    connectStreamerBot();
                }
            } else if (event.data.type === 'SET_CUSTOM_TEXTS') {
                if (event.data.customTexts) {
                    Object.assign(customTexts, event.data.customTexts);
                    if (isAlertActive && currentAlertData) {
                        const type = currentAlertData.type;
                        let tpl = customTexts[type] || '';
                        if (type === 'sub') {
                            const m = currentAlertData.months || 1;
                            tpl = (m === 1 && customTexts.sub_new && customTexts.sub_new !== 'Ha abordado la nave estelar') ? customTexts.sub_new : customTexts.sub;
                        }
                        const count = currentAlertData.count || currentAlertData.months || currentAlertData.subs || currentAlertData.viewers || currentAlertData.kicks || 1;
                        alertSubtitle.textContent = formatAlertSubtitle(tpl, {
                            months: currentAlertData.months || count,
                            subs: currentAlertData.subs || count,
                            viewers: currentAlertData.viewers || count,
                            kicks: currentAlertData.kicks || count,
                            count: count,
                            user: currentAlertData.username || ''
                        });
                    }
                }
            } else if (event.data.type === 'SET_LOOP_MODE') {
                isLoopMode = !!event.data.isLoop;
                if (isLoopMode && !isAlertActive) {
                    triggerRandomTest();
                }
            }
        });

        // =====================================================================
        // INICIALIZACIÓN
        // =====================================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Conexión en tiempo real con Streamer.bot
            connectStreamerBot();

            // Si es vista previa o loop, disparar primera alerta
            if (isPreview || isLoopMode) {
                setTimeout(() => {
                    triggerAlertByType(urlParams.get('test') || 'follow');
                }, 400);
            }
        });
    </script>
</body>
