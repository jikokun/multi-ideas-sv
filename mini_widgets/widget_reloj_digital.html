<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Widget - Reloj Digital Futurista (Transparente OBS)</title>
  
  <!-- Tipografías de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Escenario OBS 100% Transparente -->
  <div class="widget-stage">
    
    <!-- Widget de Reloj Digital Futurista (Sin fondo / Transparente) -->
    <div class="digital-clock-widget">
      <div class="digital-time" id="digital-clock-time">--:-- PM</div>
      <div class="digital-date" id="digital-clock-date">Cargando fecha...</div>
    </div>

  </div>

  <!-- Script Principal JS -->
  <script src="js/script.js"></script>
</body>
</html>
