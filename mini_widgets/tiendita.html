<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiendita de Jiko ✦ Kick</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/chakra-petch/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/chakra-petch/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/chakra-petch/700.css">
<style>
  :root{
    --kick:#53fc18;
    --kick-soft:#b4ff8a;
    --kick-dim:rgba(83,252,24,.16);
    --oro:#ffd35c;
    --rojo:#ff5c6c;
    --tinta:#eaffea;
    --apagado:#8fa88f;
    --madera-1:#7a5230; --madera-2:#5a3a1e; --madera-3:#3c2611;
    --f-display:'Unbounded',system-ui,sans-serif;
    --f-cuerpo:'Chakra Petch',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:var(--f-cuerpo);color:var(--tinta)}

  /* ════════════ WIDGET TIENDA (TIRA GRANDE) ════════════ */
  #tiendita-menu{
    position:absolute;bottom:35px;right:-1150px;width:840px;max-width:calc(100vw - 30px);z-index:10;opacity:0;
    filter:drop-shadow(0 26px 60px rgba(0,0,0,.85)) drop-shadow(0 0 35px rgba(83,252,24,.22));
    transition:right .75s cubic-bezier(.18,.9,.24,1.15),opacity .45s ease;
  }
  #tiendita-menu.visible{right:35px;opacity:1}

  @media (max-width: 880px) {
    #tiendita-menu {
      width: calc(100% - 20px) !important;
      right: -120% !important;
      bottom: 15px !important;
    }
    #tiendita-menu.visible {
      right: 10px !important;
    }
    .head-row {
      margin-right: 0 !important;
    }
    .chips {
      margin-right: 0 !important;
    }
    .neon-title {
      font-size: 18px !important;
    }
  }

  /* ── Toldo a rayas estilo Kick ── */
  .awning{
    position:relative;height:44px;margin:0 -14px;z-index:4;
    background:repeating-linear-gradient(90deg,var(--kick) 0 32px,#0d2f0c 32px 64px);
    border-radius:18px 18px 0 0;
    box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 -8px 14px rgba(0,0,0,.45),inset 0 3px 5px rgba(255,255,255,.3);
  }
  .scallops{
    position:absolute;top:100%;left:0;right:0;height:16px;z-index:4;
    background:
      radial-gradient(circle 16px at 16px 0,var(--kick) 14.5px,transparent 15.5px),
      radial-gradient(circle 16px at 16px 0,#0d2f0c 14.5px,transparent 15.5px);
    background-size:64px 16px,64px 16px;
    background-position:0 0,32px 0;
    background-repeat:repeat-x;
    filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));
  }

  /* ── Cuerpo de madera sci-fi ── */
  .shop-body{
    position:relative;z-index:1;padding:16px 18px 14px;
    border:3px solid #3f2b14;border-top:none;border-radius:0 0 24px 24px;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 92px),
      linear-gradient(180deg,#1e150b 0%,#130d06 50%,#0a0603 100%);
    box-shadow:0 0 0 1px rgba(83,252,24,.15),0 0 40px rgba(83,252,24,.12),inset 0 0 70px rgba(0,0,0,.6);
    overflow:hidden;
  }

  /* Letrero colgante ABIERTO */
  .open-sign{position:absolute;top:3px;right:22px;z-index:6;transform-origin:top center;animation:balanceo 3.4s ease-in-out infinite}
  .open-sign .cadena{width:2px;height:14px;margin:0 auto;background:linear-gradient(#caa64f,#7a5f22)}
  .open-sign .letrero{
    padding:4px 13px;border-radius:8px;background:#120c06;border:2px solid var(--kick);
    font-weight:800;font-size:10.5px;letter-spacing:2.5px;color:var(--kick);
    text-shadow:0 0 8px var(--kick);
    box-shadow:0 0 18px rgba(83,252,24,.5),inset 0 0 10px rgba(83,252,24,.25);
  }
  @keyframes balanceo{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

  /* Título Neón */
  .head-row{display:flex;align-items:center;gap:12px;margin-right:110px}
  .neon-title{
    margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.6px;color:#d9ffb0;
    text-shadow:0 0 6px var(--kick),0 0 22px rgba(83,252,24,.9),0 0 48px rgba(83,252,24,.4);
    animation:neonFlicker 4.2s infinite;
  }
  .neon-title .sub{color:#fff;text-shadow:0 0 6px #fff,0 0 20px rgba(83,252,24,.9)}
  .chips{display:flex;gap:7px;margin:8px 110px 10px 0}
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;
    letter-spacing:1.2px;padding:3.5px 11px;border-radius:999px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--apagado);
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .chip.live{color:var(--rojo);border-color:rgba(255,92,108,.4)}
  .chip.live i{animation:parpadeo 1.1s ease-in-out infinite}
  @keyframes parpadeo{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
  .chip.ok{color:var(--kick);border-color:rgba(83,252,24,.4)}
  .chip.warn{color:var(--oro);border-color:rgba(255,211,92,.4)}
  .chip.warn i{animation:parpadeo .7s ease-in-out infinite}

  /* Barra de usuario (Cliente y Saldo 1000 pts) */
  .user-bar{
    display:flex;align-items:center;gap:14px;padding:11px 16px;margin-bottom:12px;
    border-radius:14px;background:rgba(83,252,24,.07);border:1px solid rgba(83,252,24,.26);
  }
  .user-bar.flash{animation:flashSaldo .6s ease}
  @keyframes flashSaldo{0%{box-shadow:0 0 0 0 rgba(83,252,24,.6)}100%{box-shadow:0 0 0 18px rgba(83,252,24,0)}}
  .avatar{
    width:42px;height:42px;flex:none;display:grid;place-items:center;
    font-family:var(--f-display);font-weight:800;font-size:16px;color:#04120a;
    background:linear-gradient(140deg,var(--kick-soft),var(--kick));
    border-radius:12px;box-shadow:0 0 16px rgba(83,252,24,.5);
    overflow:hidden;position:relative;border:1px solid rgba(83,252,24,.4);
  }
  .avatar img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;
  }
  .avatar span{
    display:grid;place-items:center;width:100%;height:100%;
  }
  .user-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .user-meta .label{font-size:9px;letter-spacing:2px;color:var(--apagado);font-weight:700}
  .user-meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saldo{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-weight:700}
  .saldo .coin{filter:drop-shadow(0 0 7px rgba(255,211,92,.9));font-size:17px}
  .saldo b{font-size:21px;color:var(--oro);font-variant-numeric:tabular-nums}
  .saldo small{font-size:11px;color:var(--apagado)}

  /* ════════════ TIRA CONTINUA / CARRUSEL ════════════ */
  .stage{position:relative;margin:4px 0 0;overflow:hidden;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid rgba(83,252,24,.18)}
  .viewport{
    overflow:hidden;position:relative;width:100%;height:190px;
    mask-image:linear-gradient(90deg,transparent 0%,black 4%,black 96%,transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,black 4%,black 96%,transparent 100%);
  }
  .track{
    display:flex;align-items:center;gap:14px;position:absolute;top:0;left:0;height:100%;padding:10px 20px;
    will-change:transform;
  }
  .track.animando{transition:transform .65s cubic-bezier(.22,.9,.3,1.08)}

  /* Cartas de ítem en la tira */
  .item-card{
    position:relative;flex:0 0 134px;width:134px;height:164px;overflow:hidden;text-align:center;padding:10px 8px 8px;
    border-radius:15px;cursor:pointer;
    background:linear-gradient(180deg,rgba(83,252,24,.09),rgba(255,255,255,.02));
    border:1px solid rgba(83,252,24,.22);
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.25s ease-out, background 0.3s ease;
    transform-style:preserve-3d;will-change:transform;
  }
  .item-card:hover{border-color:rgba(83,252,24,.7);box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 20px rgba(83,252,24,.25);transform:translateY(-4px) scale(1.03)}
  .item-card::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);
    transform:translateX(-140%);transition:transform .7s ease;
  }
  .item-card:hover::after{transform:translateX(140%)}

  /* Estado seleccionado (carrusel detenido y centrado) */
  .item-card.seleccionado{
    border-color:var(--oro);
    background:linear-gradient(180deg,rgba(255,211,92,.18),rgba(83,252,24,.06));
    box-shadow:0 0 0 2px var(--oro),0 0 28px rgba(255,211,92,.55),0 12px 28px rgba(0,0,0,.7);
    transform:translateY(-6px) scale(1.08);
    animation:latidoSeleccion 1.4s ease-in-out infinite alternate;
  }
  @keyframes latidoSeleccion{
    from{box-shadow:0 0 0 2px var(--oro),0 0 20px rgba(255,211,92,.4)}
    to{box-shadow:0 0 0 3px var(--oro),0 0 32px rgba(255,211,92,.8)}
  }

  .item-card.comprado{animation:anilloCompra .9s ease}
  @keyframes anilloCompra{0%{box-shadow:0 0 0 0 rgba(83,252,24,.8)}100%{box-shadow:0 0 0 30px rgba(83,252,24,0)}}

  .item-visual{
    position:relative;width:72px;height:72px;margin:0 auto 6px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(83,252,24,.3);
    background:radial-gradient(circle at 50% 60%,rgba(83,252,24,.14),rgba(0,0,0,.55));
    box-shadow:inset 0 0 16px rgba(0,0,0,.6);
  }
  .item-visual img{width:100%;height:100%;object-fit:cover;display:block;animation:flotar 3.4s ease-in-out infinite;transition:transform .4s}
  .item-card:hover .item-visual img{transform:scale(1.12)}
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .item-visual .emoji-fallback{
    position:absolute;inset:0;display:none;place-items:center;font-size:38px;
    filter:drop-shadow(0 0 10px var(--kick));
    background:radial-gradient(circle at center,rgba(83,252,24,.15) 0%,transparent 70%);
  }
  .item-card.sin-img .emoji-fallback{display:grid}
  .item-card.sin-img img{display:none}

  .item-cmd{
    font-family:var(--f-cuerpo);
    font-weight:900;
    font-size:16.5px;
    letter-spacing:.6px;
    color:var(--kick);
    text-shadow:0 0 10px rgba(83,252,24,.6);
    margin-bottom:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.2;
  }
  .item-price{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:5px;
    font-size:14px;
    color:var(--oro);
    font-weight:800;
  }
  .item-price small{
    font-size:11px;
    color:var(--apagado);
    font-weight:600;
  }

  /* ════════════ PANEL DE CONFIRMACIÓN DE COMPRA ════════════ */
  #confirm-box{
    margin-top:10px;padding:10px 14px;border-radius:13px;
    background:linear-gradient(180deg,rgba(255,211,92,.12),rgba(18,12,6,.92));
    border:1px solid rgba(255,211,92,.45);
    display:none;align-items:center;gap:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 20px rgba(255,211,92,.2);
    animation:slideDown .35s cubic-bezier(.2,.9,.3,1.2);
  }
  #confirm-box.activo{display:flex}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  .confirm-visual{font-size:28px;flex:none;filter:drop-shadow(0 0 8px var(--oro))}
  .confirm-info{flex:1;min-width:0;line-height:1.25}
  .confirm-title{font-size:12px;font-weight:700;color:var(--oro);letter-spacing:.5px}
  .confirm-sub{font-size:11px;color:var(--tinta);margin-top:2px}
  .confirm-sub code{color:var(--kick);background:rgba(83,252,24,.1);padding:1px 5px;border-radius:4px;font-weight:700}
  .confirm-prompt-btn{
    display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;
    background:linear-gradient(180deg,var(--kick-soft),var(--kick));
    border:none;color:#04120a;font-family:var(--f-cuerpo);
    box-shadow:0 3px 0 #2b840d,0 0 16px rgba(83,252,24,.4);
    white-space:nowrap;flex:none;cursor:pointer;transition:.2s ease;
  }
  .confirm-prompt-btn:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 4px 0 #2b840d,0 0 22px rgba(83,252,24,.65)}
  .confirm-prompt-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2b840d}
  .prompt-icon{font-size:16px;line-height:1}
  .prompt-col{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .prompt-hint{font-size:8px;letter-spacing:1px;color:#104008;font-weight:800;text-transform:uppercase}
  .prompt-cmd{font-family:var(--f-cuerpo);font-weight:900;font-size:13px;letter-spacing:.5px;color:#04120a}

  /* Barra de temporizador ampliada (40s) */
  .countdown{height:6px;margin:12px 0 4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  #cd-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--kick),var(--kick-soft));box-shadow:0 0 10px rgba(83,252,24,.7)}
  #cd-fill.urgente{background:linear-gradient(90deg,var(--rojo),var(--oro));box-shadow:0 0 10px rgba(255,92,108,.7)}

  /* Chispas ambientales */
  .chispa{
    position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;
    background:var(--kick);box-shadow:0 0 8px var(--kick);opacity:0;
    animation:subir linear infinite;pointer-events:none;
  }
  @keyframes subir{0%{transform:translateY(0) scale(1);opacity:0}12%{opacity:.5}100%{transform:translateY(-460px) scale(.2);opacity:0}}

  /* ════════════ TOASTS ════════════ */
  #toast-zone{position:fixed;left:24px;bottom:24px;z-index:70;display:flex;flex-direction:column;gap:10px}
  .toast{
    display:flex;align-items:center;gap:10px;max-width:380px;padding:12px 18px;border-radius:14px;
    background:rgba(12,16,9,.94);border:1px solid rgba(83,252,24,.55);
    box-shadow:0 8px 28px rgba(0,0,0,.6),0 0 20px rgba(83,252,24,.2);
    font-size:13.5px;font-weight:600;backdrop-filter:blur(8px);
    animation:toastIn .45s cubic-bezier(.2,.9,.3,1.3);
  }
  .toast.err{border-color:rgba(255,92,108,.6);box-shadow:0 8px 28px rgba(0,0,0,.6),0 0 20px rgba(255,92,108,.25)}
  .toast.out{animation:toastOut .35s ease forwards}
  @keyframes toastIn{from{opacity:0;transform:translateX(-40px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(-40px) scale(.9)}}

  .spark{
    position:fixed;width:7px;height:7px;border-radius:50%;z-index:80;pointer-events:none;
    background:var(--kick);box-shadow:0 0 10px var(--kick);animation:chispaVuela .85s ease-out forwards;
  }
  @keyframes chispaVuela{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

  /* ════════════ ZONA DE PRUEBA ════════════ */
  #demo-zone{
    position:fixed;left:20px;bottom:20px;z-index:60;display:flex;gap:8px;align-items:center;
    padding:10px 14px;border-radius:14px;background:rgba(12,16,9,.94);
    border:1px solid rgba(83,252,24,.4);box-shadow:0 10px 30px rgba(0,0,0,.6);backdrop-filter:blur(8px);
    transition:transform .55s cubic-bezier(.4,.9,.4,1),opacity .4s;
  }
  #demo-zone.oculto{transform:translateY(190%);opacity:0;pointer-events:none}
  .dz-title{font-size:10px;letter-spacing:1.8px;color:var(--apagado);font-weight:700;margin-right:2px}
  #demo-zone button{
    font-family:var(--f-cuerpo);font-weight:700;font-size:11px;letter-spacing:.4px;cursor:pointer;
    color:var(--tinta);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);
    padding:7px 12px;border-radius:999px;transition:.25s;
  }
  #demo-zone button:hover{border-color:var(--kick);color:var(--kick);box-shadow:0 0 12px rgba(83,252,24,.35)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.15s !important}
  }
</style>
</head>
<body>

  <div id="tiendita-menu">
    <div class="tienda">
      <div class="awning"><div class="scallops"></div></div>

      <div class="shop-body" id="panel">
        <div class="open-sign"><div class="cadena"></div><div class="letrero">ABIERTO</div></div>

        <div class="head-row">
          <h1 class="neon-title">TIENDITA <span class="sub">DE JIKO</span></h1>
        </div>
        <div class="chips">
          <span class="chip live"><i></i>EN VIVO</span>
          <span class="chip warn" id="ws-chip"><i></i><span id="ws-txt">Conectando…</span></span>
        </div>

        <div class="user-bar" id="user-bar">
          <div class="avatar" id="avatar">
            <img id="avatar-img" src="" alt="Avatar" style="display:none;" onerror="this.style.display='none'; document.getElementById('avatar-txt').style.display='grid';">
            <span id="avatar-txt">?</span>
          </div>
          <div class="user-meta">
            <span class="label">CLIENTE</span>
            <b id="user-name">Esperando cliente…</b>
          </div>
          <div class="saldo"><span class="coin">🪙</span><b id="pts-val">1000</b><small>pts</small></div>
        </div>

        <!-- TIRA CONTINUA / CARRUSEL -->
        <div class="stage" id="stage">
          <div class="viewport" id="viewport">
            <div class="track" id="track"></div>
          </div>
        </div>

        <!-- PANEL DE CONFIRMACIÓN DE COMPRA -->
        <div id="confirm-box">
          <div class="confirm-visual" id="c-emoji">🎁</div>
          <div class="confirm-info">
            <div class="confirm-title" id="c-title">¿Deseas comprar Ítem?</div>
            <div class="confirm-sub" id="c-sub">Costo: <b style="color:var(--oro)">0 pts</b> · Cancelar: <code>!cancelar</code></div>
          </div>
          <div class="confirm-prompt-btn" id="confirm-prompt-btn" title="Escribe !comprar en el chat (o haz clic)">
            <span class="prompt-icon">💬</span>
            <div class="prompt-col">
              <span class="prompt-hint">ESCRIBE EN CHAT</span>
              <span class="prompt-cmd">!comprar</span>
            </div>
          </div>
        </div>

        <!-- BARRA DE TIEMPO EXTENDIDA (40 segundos) -->
        <div class="countdown"><div id="cd-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="toast-zone"></div>

  <!-- Panel de prueba -->
  <div id="demo-zone">
    <span class="dz-title">🧪 PRUEBAS</span>
    <button id="demo-cliente">Cliente (1000 pts)</button>
    <button id="demo-select">Seleccionar</button>
    <button id="demo-compra">!comprar</button>
    <button id="demo-cancelar">!cancelar</button>
    <button id="demo-regalo">+500 JikoPts</button>
    <button id="demo-reset">Reset Pts</button>
  </div>

<script>
  /* ═══════════ CONFIGURACIÓN & PARÁMETROS URL ═══════════ */
  const urlParams = new URLSearchParams(window.location.search);
  const WS_PORT = urlParams.get('port') || '4445';
  const WS_URL = `ws://127.0.0.1:${WS_PORT}/`;
  const customDuration = parseInt(urlParams.get('duration'), 10);
  let AUTO_CIERRE_MS = (customDuration > 0 ? customDuration : 40) * 1000;
  const USER_DEFAULT_POINTS = 1000; // 1000 puntos exactos por usuario para pruebas
  let isMuted = urlParams.get('mute') === 'true';
  const isPreview = urlParams.get('preview') === 'true';
  const isOverlayMode = urlParams.has('overlay') || location.search.includes('overlay');

  // Catálogo completo de objetos para la tira continua
  const ITEMS = [
    { key:'galleta',  nombre:'Galleta Cósmica', precio:50,  emoji:'🍪',
      img:'https://image.qwenlm.ai/public_source/3f05bc45-bb58-4e4f-afc6-a1dbbecb8c96/1534bcc37-419e-46d3-9e8a-e36748955800.png' },
    { key:'pocion',   nombre:'Poción de Maná',  precio:100, emoji:'🧪',
      img:'https://image.qwenlm.ai/public_source/3f05bc45-bb58-4e4f-afc6-a1dbbecb8c96/104fd90d2-8285-4e50-9ba4-0e406aed8820.png' },
    { key:'cafe',     nombre:'Café Turbo',      precio:75,  emoji:'☕',
      img:'https://image.qwenlm.ai/public_source/3f05bc45-bb58-4e4f-afc6-a1dbbecb8c96/112ed93e7-4f44-4a32-a2bc-7d2855a82a58.png' },
    { key:'caja',     nombre:'Caja Sorpresa',   precio:150, emoji:'🎁',
      img:'https://image.qwenlm.ai/public_source/3f05bc45-bb58-4e4f-afc6-a1dbbecb8c96/19a8309c8-a579-418f-8e22-922e164cc2ba.png' },
    { key:'espada',   nombre:'Espada Neón',     precio:250, emoji:'⚔️', img:'' },
    { key:'pizza',    nombre:'Rebanada Épica',  precio:120, emoji:'🍕', img:'' },
    { key:'estrella', nombre:'Estrella Kick',   precio:500, emoji:'⭐', img:'' }
  ];

  const $menu=document.getElementById('tiendita-menu'), $panel=document.getElementById('panel'),
        $viewport=document.getElementById('viewport'), $track=document.getElementById('track'),
        $fill=document.getElementById('cd-fill'), $toasts=document.getElementById('toast-zone'),
        $confirmBox=document.getElementById('confirm-box'),
        $cEmoji=document.getElementById('c-emoji'), $cTitle=document.getElementById('c-title'), $cSub=document.getElementById('c-sub'),
        demoZone=document.getElementById('demo-zone');

  let socket, saldoActual=USER_DEFAULT_POINTS, usuarioActual='cliente';
  let itemSeleccionado = null;

  const norm = s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  /* ═══════════ ABSORCIÓN Y CACHÉ DE AVATARS KICK ═══════════ */
  const avatarCache = {};

  async function cargarAvatarUsuario(user, urlDirecto = null){
    const cleanUser = String(user || '').replace(/^@/, '').trim();
    if(!cleanUser) return;

    const imgEl = document.getElementById('avatar-img');
    const txtEl = document.getElementById('avatar-txt');
    if(!imgEl || !txtEl) return;

    txtEl.textContent = (cleanUser[0] || '?').toUpperCase();

    const userKey = norm(cleanUser);
    if(urlDirecto){
      avatarCache[userKey] = urlDirecto;
    }

    if(avatarCache[userKey]){
      imgEl.src = avatarCache[userKey];
      imgEl.style.display = 'block';
      txtEl.style.display = 'none';
      return;
    }

    // Fallback visible mientras busca la foto
    imgEl.style.display = 'none';
    txtEl.style.display = 'grid';

    try {
      const res = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(cleanUser)}`);
      if(res.ok){
        const data = await res.json();
        const pic = data.user?.profile_pic || data.user?.profile_image || data.user?.avatar;
        if(pic){
          avatarCache[userKey] = pic;
          if(norm(usuarioActual) === userKey){
            imgEl.src = pic;
            imgEl.onload = ()=>{
              imgEl.style.display = 'block';
              txtEl.style.display = 'none';
            };
          }
        }
      }
    } catch(err){
      console.warn(`[Tiendita] No se pudo absorber avatar de @${cleanUser}:`, err);
    }
  }

  /* ═══════════ GESTOR DE PUNTOS POR USUARIO (1000 PTS INICIALES) ═══════════ */
  function getUserPoints(user){
    if(!user) return USER_DEFAULT_POINTS;
    try {
      const key = 'tiendita_pts_' + norm(user);
      const val = localStorage.getItem(key);
      if(val !== null) return parseInt(val, 10);
      localStorage.setItem(key, USER_DEFAULT_POINTS);
    } catch(e){}
    return USER_DEFAULT_POINTS;
  }
  function setUserPoints(user, pts){
    try {
      const key = 'tiendita_pts_' + norm(user);
      localStorage.setItem(key, pts);
    } catch(e){}
  }

  /* ═══════════ EFECTOS DE SONIDO WEB AUDIO ═══════════ */
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume().catch(()=>{}); }
  }
  document.addEventListener('pointerdown', initAudio, { once: true });
  document.addEventListener('keydown', initAudio, { once: true });

  function playSfx(type){
    if(isMuted) return;
    if(!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      if(type==='buy'){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.35);
      } else if(type==='select'){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
      } else if(type==='error'){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(120, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.25);
      } else if(type==='open'){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
      }
    } catch(e){}
  }

  /* ═══════════ RENDER DE LA TIRA CONTINUA ═══════════ */
  // Duplicamos el array para lograr un bucle continuo suave
  const itemsCiclo = [...ITEMS, ...ITEMS];

  /* ═══════════ LÓGICA DE CARRUSEL CONTINUO & CENTRADO ═══════════ */
  let scrollPos = 0;
  let isAutoScrolling = true;
  let animId = null;
  const scrollSpeed = 0.55; // velocidad de deslizamiento suave

  function getHalfWidth(){
    const cards = $track.querySelectorAll('.item-card');
    let w = 0;
    for(let i=0; i<ITEMS.length; i++){
      w += cards[i].offsetWidth + 14; // card + gap
    }
    return w;
  }

  function loopCarousel(){
    if(isAutoScrolling){
      scrollPos -= scrollSpeed;
      const halfWidth = getHalfWidth();
      if(halfWidth > 0 && Math.abs(scrollPos) >= halfWidth){
        scrollPos += halfWidth;
      }
      $track.style.transform = `translateX(${scrollPos}px)`;
    }
    animId = requestAnimationFrame(loopCarousel);
  }
  animId = requestAnimationFrame(loopCarousel);

  // Centra un ítem seleccionado y detiene el carrusel
  function centrarItem(cardEl){
    isAutoScrolling = false;
    $track.classList.add('animando');

    const vWidth = $viewport.offsetWidth;
    const cardLeft = cardEl.offsetLeft;
    const cardWidth = cardEl.offsetWidth;

    // Calcular desplazamiento para que el centro de la tarjeta coincida con el centro del viewport
    scrollPos = -(cardLeft - (vWidth / 2) + (cardWidth / 2));
    $track.style.transform = `translateX(${scrollPos}px)`;

    setTimeout(()=>{
      $track.classList.remove('animando');
    }, 700);
  }

  function reanudarCarrusel(){
    isAutoScrolling = true;
    $track.classList.remove('animando');
  }

  // Pausar al pasar el mouse por la vitrina
  $viewport.addEventListener('mouseenter',()=>{ if(!itemSeleccionado) isAutoScrolling=false; });
  $viewport.addEventListener('mouseleave',()=>{ if(!itemSeleccionado) isAutoScrolling=true; });

  /* ═══════════ SELECCIÓN DE ÍTEM ═══════════ */
  function seleccionarItem(itemKey, user=null){
    const it = ITEMS.find(x=>x.key === norm(itemKey));
    if(!it) return false;

    if(user) {
      usuarioActual = user;
      saldoActual = getUserPoints(user);
      document.getElementById('user-name').textContent = '@' + user;
      cargarAvatarUsuario(user);
      document.getElementById('pts-val').textContent = saldoActual;
    }

    if(!$menu.classList.contains('visible')){
      mostrarMenu(usuarioActual, saldoActual);
    } else {
      iniciarCd(AUTO_CIERRE_MS); // refresca el temporizador para dar tiempo a decidir
    }

    itemSeleccionado = it;
    playSfx('select');

    // Desmarcar selecciones previas
    document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('seleccionado'));

    // Buscar la tarjeta correspondiente (primera ocurrencia más visible)
    const cards = Array.from(document.querySelectorAll(`.item-card[data-key="${it.key}"]`));
    let targetCard = cards[0];
    if(cards.length > 1 && Math.abs(scrollPos) > getHalfWidth() / 2){
      targetCard = cards[1];
    }

    if(targetCard){
      targetCard.classList.add('seleccionado');
      centrarItem(targetCard);
    }

    // Mostrar panel de confirmación
    $cEmoji.textContent = it.emoji;
    $cTitle.textContent = `¿Deseas comprar !${it.key}?`;
    $cSub.innerHTML = `Costo: <b style="color:var(--oro)">🪙 ${it.precio} pts</b> · Saldo: <b>${saldoActual} pts</b> · Cancelar: <code>!cancelar</code>`;
    $confirmBox.classList.add('activo');

    toast(`🎯 <b>@${usuarioActual}</b> seleccionó <b>!${it.key}</b>. Escribe <b>!comprar</b> para confirmar.`);
    return true;
  }

  function cancelarSeleccion(cerrarSiVacio = false, user = usuarioActual){
    if(itemSeleccionado){
      itemSeleccionado = null;
      document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('seleccionado'));
      $confirmBox.classList.remove('activo');
      reanudarCarrusel();
      toast(`ℹ️ Selección cancelada.`);
    } else if(cerrarSiVacio){
      ocultarMenu();
      toast(`🚪 <b>@${user}</b> cerró la tiendita.`);
    }
  }

  const confirmPromptBtn = document.getElementById('confirm-prompt-btn');
  if(confirmPromptBtn) confirmPromptBtn.onclick = ()=> procesarPagoConfirmado();

  // Click directo en cualquier tarjeta de ítem
  $track.addEventListener('click', e=>{
    const card = e.target.closest('.item-card');

    const key = card.dataset.key;
    seleccionarItem(key, usuarioActual);

  /* ═══════════ PROCESAR PAGO CON !comprar ═══════════ */
  function procesarPagoConfirmado(){
    if(!itemSeleccionado){
      toast(`⚠️ Primero selecciona un ítem escribiendo su nombre (ej: <b>galleta</b>) o usa <b>!comprar &lt;ítem&gt;</b>`,'err');
      playSfx('error');
      return;
    }

    const it = itemSeleccionado;
    const user = usuarioActual;
    const costo = it.precio;

    // Verificar saldo
    if(saldoActual < costo){
      playSfx('error');
      toast(`❌ <b>@${user}</b>: Puntos insuficientes. Tienes <b>${saldoActual} pts</b> y cuesta <b>${costo} pts</b>`,'err');
      const card = document.querySelector(`.item-card.seleccionado`);
      if(card){
        card.style.animation = 'none'; void card.offsetWidth;
        card.style.animation = 'flashSaldo .4s ease';
      }
      return;
    }

    // Pago exitoso
    saldoActual -= costo;
    setUserPoints(user, saldoActual);
    animarPuntos(saldoActual);
    playSfx('buy');

    // Notificar a Streamer.bot
    if(socket && socket.readyState === 1){
      socket.send(JSON.stringify({
        request:'DoAction',
        action:{name:'Tiendita_ConfirmarCompra'},
        args:{comprador:user,itemNombre:it.nombre,costo:costo,nuevoSaldo:saldoActual},
        id:'compra-ok'
      }));
    }

    toast(`🎉 ¡PAGO ACEPTADO! <b>@${user}</b> compró <b>${it.nombre}</b> ${it.emoji} <span style="color:var(--oro)">−${costo} pts</span>`);

    const card = document.querySelector(`.item-card.seleccionado`);
    if(card){
      card.classList.add('comprado');
      explosión(card);
    }

    // Limpiar selección después de breve celebración y reanudar carrusel
    setTimeout(()=>{
      if(card) card.classList.remove('comprado', 'seleccionado');
      $confirmBox.classList.remove('activo');
      itemSeleccionado = null;
      reanudarCarrusel();
    }, 2800);

    iniciarCd(AUTO_CIERRE_MS);
  }

  /* ═══════════ PROCESADOR DE COMANDOS ═══════════ */
  function ejecutarTexto(raw, user=usuarioActual){
    const t = norm(raw);
    if(!t) return;

    // 1. Abrir tienda
    if(t==='!tienda'||t==='!tiendita'||t==='!menu'||t==='!shop'){
      mostrarMenu(user, getUserPoints(user));
      toast(`🛒 <b>@${user}</b> abrió la tiendita!`);
      return;
    }

    // 2. Cancelar selección o cerrar tienda si no hay objeto seleccionado
    if(t==='!cancelar'||t==='cancelar'||t==='!cerrar'||t==='cerrar'||t==='!cancel'||t==='cancel'){
      if(itemSeleccionado){
        cancelarSeleccion(false, user);
      } else {
        ocultarMenu();
        toast(`🚪 <b>@${user}</b> cerró la tiendita.`);
      }
      return;
    }

    // 3. Confirmar pago
    if(t==='!comprar'||t==='comprar'){
      procesarPagoConfirmado();
      return;
    }

    // 4. Compra directa con nombre: !comprar <item>
    if(t.startsWith('!comprar ')){
      const key = t.replace(/^!comprar\s+/,'');
      if(seleccionarItem(key, user)){
        procesarPagoConfirmado();
      } else {
        toast(`❌ El ítem "<b>${key}</b>" no existe en la tiendita`,'err');
        playSfx('error');
      }
      return;
    }

    // 5. Comando exclusivo para Jikokun: !darjikopuntos usuario XXXX
    if(t.startsWith('!darjikopuntos')){
      const emisorNorm = norm(user);
      const esAdmin = emisorNorm === 'jikokun' || emisorNorm === 'broadcaster';

      if(!esAdmin){
        console.warn(`[Tiendita] 🚫 Intento no autorizado de regalar puntos por [@${user}]`);
        toast(`⛔ Solo <b>@Jikokun</b> puede regalar jikopuntos.`,'err');
        playSfx('error');
        return;
      }

      // Extraer parámetros: !darjikopuntos <usuario> <cantidad>
      const partes = raw.trim().split(/\s+/);
      if(partes.length < 3){
        toast(`⚠️ Uso: <b>!darjikopuntos &lt;usuario&gt; &lt;cantidad&gt;</b>`,'err');
        playSfx('error');
        return;
      }

      const receptor = partes[1].replace(/^@/, '').trim();
      const cantidad = parseInt(partes[2], 10);

      if(!receptor || isNaN(cantidad) || cantidad <= 0){
        toast(`⚠️ Cantidad o usuario inválido. Ej: <b>!darjikopuntos ${receptor || 'usuario'} 500</b>`,'err');
        playSfx('error');
        return;
      }

      const saldoPrevio = getUserPoints(receptor);
      const nuevoSaldo = saldoPrevio + cantidad;
      setUserPoints(receptor, nuevoSaldo);

      // Si el receptor es el cliente actualmente en pantalla, actualizar saldo en vivo
      if(norm(usuarioActual) === norm(receptor)){
        saldoActual = nuevoSaldo;
        animarPuntos(saldoActual);
        const bar = document.getElementById('user-bar');
        if(bar){
          bar.classList.remove('flash'); void bar.offsetWidth; bar.classList.add('flash');
        }
      }

      playSfx('buy');
      const panel = document.getElementById('panel');
      if(panel) explosión(panel);

      toast(`⚡ ¡JIKOPUNTOS OTORGADOS! <b>@Jikokun</b> le regaló <b>+${cantidad} pts</b> a <b>@${receptor}</b> (Total: <b>${nuevoSaldo} pts</b>)`);

      // Notificar a Streamer.bot si está conectado
      if(socket && socket.readyState === 1){
        socket.send(JSON.stringify({
          request:'DoAction',
          action:{name:'Tiendita_RegalarPuntos'},
          args:{admin:user, receptor:receptor, cantidad:cantidad, nuevoSaldo:nuevoSaldo},
          id:'regalo-puntos-ok'
        }));
      }
      return;
    }

    // 6. Seleccionar por nombre directo (ej: "galleta", "!galleta", "pocion")
    const keyLimpia = t.replace(/^!/,'');
    if(ITEMS.some(it => it.key === keyLimpia)){
      seleccionarItem(keyLimpia, user);
      return;
    }
  }

  /* ═══════════ WEBSOCKET STREAMER.BOT ═══════════ */
  function setStatus(estado,txt){
    document.getElementById('ws-chip').className='chip '+estado;
    document.getElementById('ws-txt').textContent=txt;
  }
  function conectarWS(){
    try {
      socket=new WebSocket(WS_URL);
    } catch(err){
      setStatus('warn','Reconectando…');
      setTimeout(conectarWS,3000);
      return;
    }

    socket.onopen=()=>{ 
      setStatus('ok','Conectado');
      console.log('[Tiendita] 🟢 WebSocket conectado con éxito a Streamer.bot');
      socket.send(JSON.stringify({
        request:'Subscribe',
        id:'sub-tiendita',
        events:{
          General:['Custom'],
          Kick:['ChatMessage', 'Message'],
          Twitch:['ChatMessage']
        }
      })); 
    };

    socket.onmessage=(ev)=>{
      let msg; try { msg = JSON.parse(ev.data); } catch(e){ return; }

      const eventObj = msg.event || {};
      const eventType = (
        (typeof eventObj === 'object' ? (eventObj.type || eventObj.name || '') : eventObj) || 
        msg.method || msg.type || ''
      ).toString().toLowerCase();

      const rawData = msg.data || msg.body || msg;
      const data = rawData.data || rawData;

      // 1. Evento personalizado desde Streamer.bot (Custom Broadcast)
      if(eventType === 'custom' || msg.method === 'Custom'){
        console.log('[Tiendita] 📦 Evento Custom recibido:', data);
        const customUser = data.user || data.userName || data.username || usuarioActual || 'cliente';
        const customPoints = data.puntos != null ? data.puntos : (data.points != null ? data.points : getUserPoints(customUser));
        setUserPoints(customUser, customPoints);
        mostrarMenu(customUser, customPoints);
        return;
      }

      // 2. Mensajes de chat en vivo de Kick / Twitch
      const isChat = eventType.includes('chatmessage') || eventType === 'message' || data.message || data.messageText || data.text || data.content;
      if(isChat){
        const messageObj = data.message || data;
        let userObj = data.user || data.sender || (typeof messageObj === 'object' ? (messageObj.user || messageObj.sender) : null) || {};
        let user = 'anon';
        if(typeof userObj === 'string') user = userObj;
        else if(typeof userObj === 'object' && userObj !== null){
          user = userObj.username || userObj.name || userObj.displayName || userObj.user_name || data.userName || data.username || 'anon';
        }

        // FILTRO ESTRICTO DE BOTS: Ignorar completamente botrix, lobito_mensajero, kickbot, etc.
        const userNorm = norm(user);
        const BOTS_IGNORADOS = [
          'botrix',
          'lobito_mensajero',
          'kickbot',
          'nightbot',
          'streamelements',
          'streamlabs',
          'jikobot',
          'creepingbot',
          'streamerbot',
          'wizebot',
          'bot'
        ];
        const isBot = BOTS_IGNORADOS.includes(userNorm) || 
                      BOTS_IGNORADOS.some(b => userNorm === b || userNorm.startsWith(b + '_') || userNorm.endsWith('_' + b)) ||
                      Boolean(userObj.is_bot || userObj.isBot || data.is_bot || data.isBot);

        if(isBot){
          // Ignorar silenciosamente sin alterar cliente ni abrir tienda
          return;
        }

        const avatarDirecto = userObj.profile_pic || userObj.profile_image || userObj.avatar || userObj.profilePictureUrl || null;
        if(avatarDirecto) avatarCache[norm(user)] = avatarDirecto;

        let contenido = '';
        if(typeof data.messageText === 'string') contenido = data.messageText;
        else if(typeof data.message === 'string') contenido = data.message;
        else if(typeof data.text === 'string') contenido = data.text;
        else if(typeof data.content === 'string') contenido = data.content;
        else if(typeof messageObj === 'object' && messageObj !== null){
          contenido = messageObj.message || messageObj.text || messageObj.content || '';
        }

        if(!contenido) return;

        // Comprobar si el contenido es un comando o ítem de la tiendita
        const t = norm(contenido);
        const esComandoTienda = t==='!tienda'||t==='!tiendita'||t==='!menu'||t==='!shop'||
                                t==='!cancelar'||t==='cancelar'||t==='!cerrar'||t==='cerrar'||t==='!cancel'||t==='cancel'||
                                t==='!comprar'||t==='comprar'||
                                t.startsWith('!comprar ')||
                                t.startsWith('!darjikopuntos')||
                                ITEMS.some(it => t === it.key || t === '!' + it.key);

        // Si es un mensaje ordinario del chat (conversación normal de viewers), se ignora
        if(!esComandoTienda) return;

        console.log(`[Tiendita] 💬 Comando recibido de [@${user}]: "${contenido}"`);
        ejecutarTexto(contenido, user);
      }
    };
    socket.onclose=()=>{ setStatus('warn','Reconectando…'); setTimeout(conectarWS,3000); };
    socket.onerror=()=>setStatus('warn','Reconectando…');
  }

  /* ═══════════ MOSTRAR / OCULTAR & TEMPORIZADOR ═══════════ */
  let cdRaf=null, cdStart=0, cdTotal=AUTO_CIERRE_MS, cdRestante=AUTO_CIERRE_MS;
  function tickCd(){
    cdRestante=cdTotal-(performance.now()-cdStart);
    const p=Math.max(0,cdRestante/AUTO_CIERRE_MS);
    $fill.style.width=(p*100)+'%';
    $fill.classList.toggle('urgente',p<.25);
    if(p<=0){ ocultarMenu(); return; }
    cdRaf=requestAnimationFrame(tickCd);
  }
  function iniciarCd(ms){ cdTotal=cdRestante=ms; cdStart=performance.now(); cancelAnimationFrame(cdRaf); cdRaf=requestAnimationFrame(tickCd); }
  function pausarCd(){ cancelAnimationFrame(cdRaf); }
  function reanudarCd(){ if(cdRestante<=0)return; cdTotal=cdRestante; cdStart=performance.now(); cdRaf=requestAnimationFrame(tickCd); }

  function animarPuntos(hasta){
    const el=document.getElementById('pts-val');
    const desde=parseInt(el.textContent.replace(/\D/g,''))||0, t0=performance.now();
    (function paso(t){
      const p=Math.min(1,(t-t0)/600), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(desde+(hasta-desde)*e);
      if(p<1) requestAnimationFrame(paso);
    })(t0);
  }

  function mostrarMenu(user, puntos=null){
    initAudio();
    playSfx('open');
    usuarioActual=user;
    saldoActual = puntos !== null ? parseInt(puntos) : getUserPoints(user);
    setUserPoints(user, saldoActual);

    document.getElementById('user-name').textContent='@'+user;
    cargarAvatarUsuario(user);
    animarPuntos(saldoActual);

    $menu.classList.add('visible');
    const bar=document.getElementById('user-bar');
    bar.classList.remove('flash'); void bar.offsetWidth; bar.classList.add('flash');
    iniciarCd(AUTO_CIERRE_MS);
  }
  function ocultarMenu(){ 
    $menu.classList.remove('visible'); 
    cancelAnimationFrame(cdRaf); 
    cancelarSeleccion();
  }

  $menu.addEventListener('mouseenter',()=>{ if($menu.classList.contains('visible')) pausarCd(); });
  $menu.addEventListener('mouseleave',()=>{ if($menu.classList.contains('visible')) reanudarCd(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape') ocultarMenu(); });

  /* ═══════════ TOASTS & PARTÍCULAS ═══════════ */
  function toast(html,tipo='ok'){
    const t=document.createElement('div');
    t.className='toast'+(tipo==='err'?' err':'');
    t.innerHTML=html; $toasts.appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),380); },3600);
  }
  function explosión(el){
    const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(let i=0;i<20;i++){
      const s=document.createElement('span'); s.className='spark';
      const a=Math.random()*Math.PI*2, d=50+Math.random()*85;
      s.style.left=cx+'px'; s.style.top=cy+'px';
      s.style.setProperty('--dx',Math.cos(a)*d+'px');
      s.style.setProperty('--dy',(Math.sin(a)*d-35)+'px');
      document.body.appendChild(s); setTimeout(()=>s.remove(),900);
    }
  }

  /* ═══════════ PANEL DE PRUEBA: Alternar tocando la pantalla ═══════════ */
  addEventListener('pointerdown', e => {
    if (e.target.closest('#demo-zone, #tiendita-menu')) return;
    demoZone.classList.toggle('oculto');
  }, { passive: true });

  const nombres=['LunaGamer','elpana_juan','DonChente','MoraPixel','Kafecito_'];
  document.getElementById('demo-cliente').onclick=()=>{
    const n = nombres[Math.floor(Math.random()*nombres.length)];
    mostrarMenu(n, getUserPoints(n));
  };
  document.getElementById('demo-select').onclick=()=>{
    const itemAzar = ITEMS[Math.floor(Math.random()*ITEMS.length)];
    seleccionarItem(itemAzar.key, usuarioActual);
  };
  document.getElementById('demo-compra').onclick=()=> procesarPagoConfirmado();
  document.getElementById('demo-cancelar').onclick=()=> ejecutarTexto('!cancelar', usuarioActual);
  document.getElementById('demo-regalo').onclick=()=> ejecutarTexto(`!darjikopuntos ${usuarioActual} 500`, 'jikokun');
  document.getElementById('demo-reset').onclick=()=>{
    setUserPoints(usuarioActual, USER_DEFAULT_POINTS);
    saldoActual = USER_DEFAULT_POINTS;
    animarPuntos(saldoActual);
    toast(`🔄 Puntos de <b>@${usuarioActual}</b> reseteados a <b>1000 pts</b>`);
  };

  if(isOverlayMode || isPreview){
    demoZone.style.display='none';
  }

  if(isPreview){
    setTimeout(()=>{
      mostrarMenu('LunaGamer', getUserPoints('LunaGamer'));
    }, 600);
  }

  /* ═══════════ RECEPTOR DE ACCIONES EXTERNAS (PANEL DE PRUEBA) ═══════════ */
  window.addEventListener('message', e => {
    if(!e.data || typeof e.data !== 'object') return;
    const { type, itemKey, user, amount, duration, muted } = e.data;

    switch(type){
      case 'OPEN_STORE':
        mostrarMenu(user || 'LunaGamer', getUserPoints(user || 'LunaGamer'));
        toast(`🛒 <b>@${user || 'LunaGamer'}</b> abrió la tiendita!`);
        break;
      case 'CLOSE_STORE':
        ocultarMenu();
        break;
      case 'SELECT_ITEM':
        if(itemKey){
          seleccionarItem(itemKey, user || usuarioActual);
        } else {
          const itemAzar = ITEMS[Math.floor(Math.random()*ITEMS.length)];
          seleccionarItem(itemAzar.key, user || usuarioActual);
        }
        break;
      case 'BUY_ITEM':
        procesarPagoConfirmado();
        break;
      case 'CANCEL_ITEM':
        ejecutarTexto('!cancelar', user || usuarioActual);
        break;
      case 'GIFT_POINTS':
        ejecutarTexto(`!darjikopuntos ${user || usuarioActual} ${amount || 500}`, 'jikokun');
        break;
      case 'RESET_POINTS':
        setUserPoints(usuarioActual, USER_DEFAULT_POINTS);
        saldoActual = USER_DEFAULT_POINTS;
        animarPuntos(saldoActual);
        toast(`🔄 Puntos de <b>@${usuarioActual}</b> reseteados a <b>1000 pts</b>`);
        break;
      case 'SET_MUTE':
        isMuted = !!muted;
        break;
      case 'SET_DURATION':
        if(duration > 0) AUTO_CIERRE_MS = duration * 1000;
        break;
    }
  });

  conectarWS();
</script>
</body>
</html>
