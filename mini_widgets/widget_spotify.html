<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Spotify Live ✦ 1920x1080 OBS & Kick Chat</title>
  <link rel="icon" href="../imagenes/iconos_generales/multiideassv_ico.webp?v=1" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --spotify-green: #1DB954;
      --spotify-glow: rgba(29, 185, 84, 0.45);
      --kick-green: #53fc18;
      --kick-glow: rgba(83, 252, 24, 0.4);
      --aqua-neon: #00f5d4;
      --aqua-glow: rgba(0, 245, 212, 0.4);
      --accent: var(--aqua-neon);
      --accent-glow: var(--aqua-glow);
      --bg-glass: rgba(6, 18, 30, 0.88);
      --border-glass: rgba(0, 245, 212, 0.3);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    /* Temas seleccionables */
    body[data-theme="spotify"] {
      --accent: var(--spotify-green);
      --accent-glow: var(--spotify-glow);
      --border-glass: rgba(29, 185, 84, 0.35);
    }
    body[data-theme="kick"] {
      --accent: var(--kick-green);
      --accent-glow: var(--kick-glow);
      --border-glass: rgba(83, 252, 24, 0.35);
    }
    body[data-theme="cyberpunk"] {
      --accent: #ff2fd0;
      --accent-glow: rgba(255, 47, 208, 0.45);
      --border-glass: rgba(255, 47, 208, 0.35);
    }
    body[data-theme="obsidian"] {
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --border-glass: rgba(255, 255, 255, 0.15);
      --bg-glass: rgba(10, 14, 22, 0.94);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-white);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Escenario Nativo 1920x1080 con auto-escalado */
    #stage-1920x1080 {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      pointer-events: none;
      overflow: hidden;
    }

    /* Contenedor Arrastrable del Reproductor Compacto */
    #spotifyDraggableContainer {
      position: absolute;
      top: 920px;
      left: 60px;
      width: 420px;
      pointer-events: auto;
      cursor: grab;
      z-index: 100;
      transition: box-shadow 0.25s ease, transform 0.15s ease;
    }

    #spotifyDraggableContainer.is-dragging {
      cursor: grabbing;
      transform: scale(1.02);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
    }

    /* Barra Superior de Posicionamiento Rápido & Temas (Hover) */
    .dock-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(4, 12, 20, 0.9);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(14px);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    #spotifyDraggableContainer:hover .dock-controls-bar,
    .dock-controls-bar.force-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: var(--accent);
    }

    .dock-btn.active {
      background: var(--accent);
      color: #020810;
      font-weight: 900;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Tarjeta Compacta del Reproductor (Estilo Showcase para Stream) */
    .compact-player-card {
      background: linear-gradient(135deg, rgba(8, 22, 34, 0.94) 0%, rgba(3, 10, 18, 0.96) 100%);
      border: 1.5px solid var(--border-glass);
      border-radius: 20px;
      padding: 12px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 245, 212, 0.12);
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .compact-player-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transform: skewX(-25deg);
      pointer-events: none;
      animation: sweepGlint 6s infinite;
    }

    @keyframes sweepGlint {
      0%, 80% { left: -100%; }
      100% { left: 200%; }
    }

    /* Carátula y Vinilo Giratorio */
    .vinyl-cover-box {
      position: relative;
      width: 66px;
      height: 66px;
      flex-shrink: 0;
    }

    .vinyl-disc {
      position: absolute;
      top: 2px;
      right: -8px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #02060c 0%, #0a111a 35%, #010408 70%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: transform 0.4s ease;
    }

    .vinyl-disc::after {
      content: '';
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #02060c;
      box-shadow: 0 0 8px var(--accent);
    }

    .is-playing .vinyl-disc {
      animation: spinVinyl 3.6s linear infinite;
    }

    @keyframes spinVinyl {
      100% { transform: rotate(360deg); }
    }

    .album-cover-img {
      position: relative;
      width: 66px;
      height: 66px;
      border-radius: 14px;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
      z-index: 2;
      background: #020810;
    }

    /* Información de Pista y Ecualizador */
    .track-info-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .track-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    /* Ecualizador Mini de 4 Barras Animadas */
    .mini-equalizer {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 3px;
      height: 4px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      transition: height 0.15s ease;
    }

    .is-playing .eq-bar:nth-child(1) { animation: bounceEq 0.9s infinite ease-in-out alternate; }
    .is-playing .eq-bar:nth-child(2) { animation: bounceEq 1.2s 0.2s infinite ease-in-out alternate; }
    .is-playing .eq-bar:nth-child(3) { animation: bounceEq 0.8s 0.4s infinite ease-in-out alternate; }
    .is-playing .eq-bar:nth-child(4) { animation: bounceEq 1.1s 0.1s infinite ease-in-out alternate; }

    @keyframes bounceEq {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .track-artist {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de Tiempo / Progreso Delgada */
    .progress-bar-container {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1DB954 0%, var(--accent) 100%);
      border-radius: 999px;
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.25s linear;
    }

    .time-badge {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* ==========================================================================
       PANELES FLOTANTES TIPO ALERTAS (TOASTS EN VIVO PARA COMANDOS DE KICK)
       ========================================================================== */
    #alertToastContainer {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      pointer-events: none;
    }

    .alert-toast {
      pointer-events: auto;
      background: linear-gradient(135deg, rgba(8, 24, 38, 0.95) 0%, rgba(2, 9, 16, 0.97) 100%);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      padding: 10px 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.85), 0 0 25px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      animation: alertSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.3s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .alert-toast.fade-out {
      opacity: 0;
      transform: translateY(-20px) scale(0.92);
    }

    .alert-toast .toast-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.05rem;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .alert-toast .toast-user {
      color: var(--kick-green);
      font-weight: 900;
    }

    .alert-toast.warning {
      border-color: #f59e0b;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(245, 158, 11, 0.4);
    }
    .alert-toast.warning .toast-icon {
      color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    @keyframes alertSlideIn {
      0% { opacity: 0; transform: translateY(-30px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ==========================================================================
       BANNER FLOTANTE !CANCION EN LA ESQUINA INFERIOR DERECHA
       ========================================================================== */
    #songInfoBanner {
      position: absolute;
      bottom: 45px;
      right: 50px;
      width: 440px;
      background: linear-gradient(135deg, rgba(8, 26, 42, 0.95) 0%, rgba(2, 10, 18, 0.98) 100%);
      border: 1.5px solid var(--accent);
      border-radius: 24px;
      padding: 16px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 35px var(--accent-glow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 500;
      opacity: 0;
      transform: translateX(120px) scale(0.92);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    #songInfoBanner.visible {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .banner-cover {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      flex-shrink: 0;
    }

    .banner-body {
      flex: 1;
      min-width: 0;
    }

    .banner-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid var(--border-glass);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .banner-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .banner-artist {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .banner-footer {
      font-size: 0.74rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Estado Desconectado (Overlay en el Widget) */
    .widget-disconnected-msg {
      display: none;
      font-size: 0.82rem;
      color: #f87171;
      font-weight: 700;
      text-align: center;
      width: 100%;
      padding: 4px;
    }

    .is-disconnected .compact-player-card {
      border-color: rgba(239, 68, 68, 0.5);
    }
    .is-disconnected .widget-disconnected-msg {
      display: block;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       ESCENARIO 1920x1080 NATIVO PARA OBS STUDIO
       ======================================================================== -->
  <div id="stage-1920x1080">

    <!-- CONTENEDOR FLOTANTE PARA ALERTAS / TOASTS EN VIVO -->
    <div id="alertToastContainer"></div>

    <!-- WIDGET REPRODUCTOR COMPACTO Y ARRASTRABLE -->
    <div id="spotifyDraggableContainer">
      <!-- Barra de Posición Rápida y Temas (Visible al pasar el cursor o interactuar) -->
      <div class="dock-controls-bar" id="dockBar">
        <div style="display: flex; gap: 4px; align-items: center;">
          <button type="button" class="dock-btn" onclick="dockWidgetTo('bottom-left')">↙️ Abajo-Izq</button>
          <button type="button" class="dock-btn" onclick="dockWidgetTo('bottom-right')">↘️ Abajo-Der</button>
          <button type="button" class="dock-btn" onclick="dockWidgetTo('top-left')">↖️ Arriba-Izq</button>
          <button type="button" class="dock-btn" onclick="dockWidgetTo('top-right')">↗️ Arriba-Der</button>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <button type="button" class="dock-btn" onclick="setTheme('aqua')" title="Tema Aqua">🌊 Aqua</button>
          <button type="button" class="dock-btn" onclick="setTheme('spotify')" title="Tema Spotify">🟢 Spotify</button>
          <button type="button" class="dock-btn" onclick="setTheme('kick')" title="Tema Kick">🐺 Kick</button>
          <button type="button" class="dock-btn" onclick="setTheme('cyberpunk')" title="Tema Cyberpunk">🟣 Cyber</button>
          <button type="button" class="dock-btn" onclick="triggerFetchCommand('skip')" title="Saltar canción (MrBoost direct)">⏭️ Skip</button>
          <button type="button" class="dock-btn" onclick="triggerFetchCommand('play')" title="Reanudar">▶️ Play</button>
          <button type="button" class="dock-btn" onclick="triggerFetchCommand('pause')" title="Pausar">⏸️ Pausa</button>
          <button type="button" class="dock-btn" id="lockPosBtn" onclick="toggleLockPosition()" title="Bloquear / Desbloquear Arrastre">🔓</button>
        </div>
      </div>

      <!-- Tarjeta Compacta del Mostrador de Canción -->
      <div class="compact-player-card" id="compactPlayerCard">
        <!-- Carátula + Vinilo Giratorio -->
        <div class="vinyl-cover-box">
          <div class="vinyl-disc"></div>
          <img id="albumArt" class="album-cover-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' rx='20' fill='%23061522'/><circle cx='60' cy='60' r='42' fill='%2302060c' stroke='%2300f5d4' stroke-width='3'/><circle cx='60' cy='60' r='26' fill='%230a1c12' stroke='%231DB954' stroke-width='2'/><circle cx='60' cy='60' r='10' fill='%2300f5d4'/><path d='M44 48c10-3 22-3 32 3M47 60c8-2 18-2 26 3M50 72c5-2 13-2 20 2' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round' fill='none'/></svg>" alt="Cover">
        </div>

        <!-- Información Compacta de la Canción -->
        <div class="track-info-col">
          <div class="track-top-row">
            <div id="trackTitle" class="track-title">Sin reproducción activa</div>
            <!-- Ecualizador Mini -->
            <div class="mini-equalizer" id="equalizer">
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
            </div>
          </div>

          <div id="trackArtist" class="track-artist">Inicia música en Spotify o usa !play</div>

          <!-- Barra Delgada de Tiempo -->
          <div class="progress-bar-container">
            <div class="progress-track">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="timeDisplay" class="time-badge">00:00 / 00:00</span>
          </div>

          <!-- Mensaje discreto si no hay token -->
          <div class="widget-disconnected-msg" id="disconnectedMsg">
            ⚠️ Spotify Desconectado. Configura tus tokens en el Laboratorio.
          </div>
        </div>
      </div>
    </div><!-- /#spotifyDraggableContainer -->

    <!-- ========================================================================
         BANNER FLOTANTE !CANCION EN LA ESQUINA INFERIOR DERECHA
         ======================================================================== -->
    <div id="songInfoBanner">
      <img id="bannerCover" class="banner-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' rx='20' fill='%23061522'/><circle cx='60' cy='60' r='42' fill='%2302060c' stroke='%2300f5d4' stroke-width='3'/><circle cx='60' cy='60' r='26' fill='%230a1c12' stroke='%231DB954' stroke-width='2'/><circle cx='60' cy='60' r='10' fill='%2300f5d4'/><path d='M44 48c10-3 22-3 32 3M47 60c8-2 18-2 26 3M50 72c5-2 13-2 20 2' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round' fill='none'/></svg>" alt="Song Cover">
      <div class="banner-body">
        <div class="banner-pill">
          <i class="fa-brands fa-spotify"></i> Sonando en Vivo
        </div>
        <div id="bannerTitle" class="banner-title">Título de Canción</div>
        <div id="bannerArtist" class="banner-artist">Artista</div>
        <div class="banner-footer">
          <i class="fa-solid fa-comments"></i> Pedido por chat con <strong style="color:var(--kick-green);">!cancion</strong>
        </div>
      </div>
    </div>

  </div><!-- /#stage-1920x1080 -->

  <script>
    /* ==========================================================================
       CONFIGURACIÓN DEVELOPER DE SPOTIFY & TOKENS
       ========================================================================== */
    const CLIENT_ID = '86895cd4fce24473b50586a16122bd22';
    const CLIENT_SECRET = '98f13b050abb432482d9c3b80c6babff';

    // Parsear parámetros de URL y Hash
    const urlParams = new URLSearchParams(window.location.search);
    const rawHash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
    const hashParams = new URLSearchParams(rawHash);

    // Tokens pasados en la URL (para OBS Studio sin necesidad de login)
    const paramToken = urlParams.get('token') || urlParams.get('access_token') || hashParams.get('token') || hashParams.get('access_token');
    const paramRefresh = urlParams.get('refresh') || urlParams.get('refresh_token') || hashParams.get('refresh') || hashParams.get('refresh_token');
    const paramExpires = urlParams.get('expires') || hashParams.get('expires');

    if (paramToken) {
      try { localStorage.setItem('spotify_access_token', paramToken); } catch(e) {}
    }
    if (paramRefresh) {
      try { localStorage.setItem('spotify_refresh_token', paramRefresh); } catch(e) {}
    }
    if (paramExpires) {
      try { localStorage.setItem('spotify_token_expires', paramExpires); } catch(e) {}
    }

    let accessToken = paramToken || localStorage.getItem('spotify_access_token') || '';
    let refreshToken = paramRefresh || localStorage.getItem('spotify_refresh_token') || '';
    let tokenExpires = parseInt(paramExpires || localStorage.getItem('spotify_token_expires') || '0', 10);

    // Estado del reproductor
    let currentTrackId = '';
    let isPlaying = false;
    let trackProgressMs = 0;
    let trackDurationMs = 0;
    let localProgressInterval = null;
    let pollInterval = null;
    let currentTrackData = null;

    // Configuración de Integración MrBoost & Streamer.bot
    const SPOTIFY_USER = urlParams.get('mrboost_user') || urlParams.get('user') || 'jikokun2';
    // Modos de control: 'hybrid' (intenta API + MrBoost fallback), 'streamerbot' (visualizer only, Streamer.bot ejecuta fetch para evitar doble salto), 'mrboost' (control 100% MrBoost)
    const CONTROL_MODE = urlParams.get('control_mode') || urlParams.get('skip_mode') || 'hybrid';

        const clean = m.trim().toLowerCase().replace('@', '');

    /* ==========================================================================
       AUTO-ESCALADO DEL ESCENARIO 1920x1080
       ========================================================================== */
    function resizeStage() {
      const stage = document.getElementById('stage-1920x1080');
      if (!stage) return;
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Si está en OBS Studio en 1920x1080 exacto, escala 1
      if (w === 1920 && h === 1080) {
        stage.style.transform = 'translate(-50%, -50%) scale(1)';
        return;
      }

      const scaleX = w / 1920;
      const scaleY = h / 1080;
      const scale = Math.min(scaleX, scaleY);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', resizeStage);
    window.addEventListener('DOMContentLoaded', resizeStage);

    let isDragging = false;
    let isLocked = false;
    let startX = 0, startY = 0;
    let initialLeft = 60, initialTop = 920;

    // Restaurar posición guardada o por parámetro URL
    function loadSavedPosition() {

    window.dockWidgetTo = function(pos) {
      if (!container) return;
      switch(pos) {
        case 'bottom-left':
          container.style.left = '60px';
          container.style.top = '910px';
          break;
        case 'bottom-right':

        case 'top-left':

          container.style.top = '60px';
          break;

    window.setTheme = function(theme) {

    window.toggleLockPosition = function() {
      isLocked = !isLocked;

      if (btn) btn.textContent = isLocked ? '🔒' : '🔓';
      showFloatingAlert(isLocked ? '🔒 Posición Bloqueada' : '🔓 Posición Desbloqueada (Arrastra para mover)', 'info');
    };

    function savePosition() {
      if (!container) return;
      const curLeft = parseInt(container.style.left, 10);
      const curTop = parseInt(container.style.top, 10);
      if (!isNaN(curLeft)) localStorage.setItem('spotify_widget_pos_x', curLeft.toString());
      if (!isNaN(curTop)) localStorage.setItem('spotify_widget_pos_y', curTop.toString());
    }

    // Eventos de arrastre
    container.addEventListener('mousedown', (e) => {
      if (isLocked) return;
      if (e.target.closest('.dock-controls-bar')) return;
      isDragging = true;
      container.classList.add('is-dragging');

      const stage = document.getElementById('stage-1920x1080');
      const rect = stage.getBoundingClientRect();
      const scale = rect.width / 1920 || 1;

      startX = e.clientX;
      startY = e.clientY;
      initialLeft = parseInt(container.style.left, 10) || 60;
      initialTop = parseInt(container.style.top, 10) || 920;

      function onMouseMove(ev) {
        if (!isDragging) return;
        const dx = (ev.clientX - startX) / scale;
        const dy = (ev.clientY - startY) / scale;
        
        let newX = Math.round(initialLeft + dx);
        let newY = Math.round(initialTop + dy);

        // Limitar dentro del lienzo 1920x1080
        newX = Math.max(10, Math.min(1920 - 440, newX));
        newY = Math.max(10, Math.min(1080 - 120, newY));

        container.style.left = newX + 'px';
        container.style.top = newY + 'px';
      }

      function onMouseUp() {
        if (!isDragging) return;
        isDragging = false;
        container.classList.remove('is-dragging');
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        savePosition();
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    /* ==========================================================================
       SPOTIFY WEB API & RENOVACIÓN AUTOMÁTICA DE TOKENS
       ========================================================================== */
    async function spotifyApi(endpoint, method = 'GET', body = null) {
      if (!accessToken) {
        const renewed = await refreshAccessToken();
        if (!renewed) return null;
      }

      const opts = {
        method,
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        }
      };
      if (body) opts.body = JSON.stringify(body);

      try {
        let res = await fetch(`https://api.spotify.com/v1${endpoint}`, opts);

        if (res.status === 401) {
          console.warn('[Spotify] Token expirado, renovando con refresh token...');
          const renewed = await refreshAccessToken();
          if (renewed) {
            opts.headers['Authorization'] = `Bearer ${accessToken}`;
            res = await fetch(`https://api.spotify.com/v1${endpoint}`, opts);
          } else {
            setDisconnectedUI(true);
            return null;
          }
        }

        if (res.status === 204 || res.status === 202) return true; // Operaciones exitosas sin contenido
        if (res.ok) {
          setDisconnectedUI(false);
          const text = await res.text();
          if (!text || text.trim() === '') return true;
          try {
            return JSON.parse(text);
          } catch(e) {
            return true;
          }
        }
        return null;
      } catch (err) {
        console.error('[Spotify API Fetch Error]:', err);
        return null;
      }
    }

    async function refreshAccessToken() {
      refreshToken = localStorage.getItem('spotify_refresh_token') || refreshToken;
      if (!refreshToken) {
        setDisconnectedUI(true);
        return false;
      }

      // 1. PRIMER INTENTO: Proxy Backend de MrBoost (CORS habilitado con Access-Control-Allow-Origin: *)
      try {
        const refreshUrl = 'https://mrboostlive.com/spotify/refresh_token.php';
        const mrRes = await fetch(refreshUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `user_id=${encodeURIComponent(SPOTIFY_USER)}&refresh_token=${encodeURIComponent(refreshToken)}`
        });
        if (mrRes.ok) {
          const newToken = (await mrRes.text()).trim();
          if (newToken && !newToken.includes('<') && newToken.length > 20) {
            accessToken = newToken;
            tokenExpires = Date.now() + (3600 * 1000);
            localStorage.setItem('spotify_access_token', accessToken);
            localStorage.setItem('spotify_token_expires', tokenExpires.toString());
            console.log('[Spotify Widget] ✅ Token renovado exitosamente vía MrBoost Backend Proxy');
            setDisconnectedUI(false);
            return true;
          }
        }
      } catch (errMr) {
        console.warn('[Spotify Widget] Fallo proxy MrBoost, intentando PKCE directo...', errMr);
      }

      // 2. SEGUNDO INTENTO: Spotify accounts PKCE directo (sin Authorization Basic para no ser bloqueado por CORS)
      try {
        const bodyParams = new URLSearchParams({
          grant_type: 'refresh_token',
          refresh_token: refreshToken,
          client_id: CLIENT_ID
        });

        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: bodyParams
        });

        if (res.ok) {
          const data = await res.json();
          if (data.access_token) {
            accessToken = data.access_token;
            tokenExpires = Date.now() + (data.expires_in * 1000);
            localStorage.setItem('spotify_access_token', accessToken);
            localStorage.setItem('spotify_token_expires', tokenExpires.toString());
            if (data.refresh_token) {
              refreshToken = data.refresh_token;
              localStorage.setItem('spotify_refresh_token', refreshToken);
            }
            console.log('[Spotify Widget] ✅ Token renovado con éxito vía Spotify PKCE');
            setDisconnectedUI(false);
            return true;
          }
        }
      } catch (e) {
        console.error('[Spotify Widget] Error al renovar token vía Spotify accounts:', e);
      }

      return false;
    }

    function setDisconnectedUI(disconnected) {
      const card = document.getElementById('compactPlayerCard');
      const disc = document.getElementById('disconnectedMsg');
      if (disconnected) {

      }
    }

    /* ==========================================================================
       ACTUALIZACIÓN DEL ESTADO DE REPRODUCCIÓN (PLAYBACK STATE)
       ========================================================================== */
    async function fetchPlaybackState() {
      const data = await spotifyApi('/me/player');

      const card = document.getElementById('compactPlayerCard');
      const titleEl = document.getElementById('trackTitle');
      const artistEl = document.getElementById('trackArtist');
      const coverEl = document.getElementById('albumArt');
      const fillEl = document.getElementById('progressFill');
      const timeEl = document.getElementById('timeDisplay');

      if (!data || !data.item) {
        if (isPlaying) {
          isPlaying = false;
          card.classList.remove('is-playing');
        }
        return;
      }

      currentTrackData = data;
      const track = data.item;
      isPlaying = data.is_playing;
      trackProgressMs = data.progress_ms || 0;
      trackDurationMs = track.duration_ms || 1;

      if (isPlaying) {
        card.classList.add('is-playing');
      } else {
        card.classList.remove('is-playing');
      }

      // Si cambió de pista
      if (currentTrackId !== track.id) {
        currentTrackId = track.id;
        titleEl.textContent = track.name;
        artistEl.textContent = track.artists ? track.artists.map(a => a.name).join(', ') : 'Desconocido';

        if (track.album && track.album.images && track.album.images.length > 0) {
          const imgUrl = track.album.images[0].url;
          coverEl.src = imgUrl;
          document.getElementById('bannerCover').src = imgUrl;
        }

        // Actualizar datos del banner de la esquina
        document.getElementById('bannerTitle').textContent = track.name;
        document.getElementById('bannerArtist').textContent = artistEl.textContent;
      }

      updateProgressUI(trackProgressMs, trackDurationMs);
    }

    function updateProgressUI(currentMs, totalMs) {
      const fill = document.getElementById('progressFill');
      const time = document.getElementById('timeDisplay');
      if (!fill || !time) return;

      const pct = Math.min(100, Math.max(0, (currentMs / totalMs) * 100));
      fill.style.width = pct + '%';
      time.textContent = `${formatTime(currentMs)} / ${formatTime(totalMs)}`;
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // Progreso suave segundo a segundo en local
    function startLocalProgressTicker() {
      if (localProgressInterval) clearInterval(localProgressInterval);
      localProgressInterval = setInterval(() => {
        if (isPlaying && trackDurationMs > 0) {
          trackProgressMs += 1000;
          if (trackProgressMs > trackDurationMs) trackProgressMs = trackDurationMs;
          updateProgressUI(trackProgressMs, trackDurationMs);
        }
      }, 1000);
    }

    /* ==========================================================================
       PANELES FLOTANTES TIPO ALERTAS (TOASTS EN VIVO)
       ========================================================================== */
    function showFloatingAlert(message, type = 'info', user = null) {
      const container = document.getElementById('alertToastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `alert-toast ${type}`;

      let iconHtml = '<i class="fa-solid fa-bell"></i>';
      if (type === 'add') iconHtml = '<i class="fa-solid fa-plus"></i>';
      else if (type === 'skip') iconHtml = '<i class="fa-solid fa-forward-step"></i>';
      else if (type === 'pause') iconHtml = '<i class="fa-solid fa-pause"></i>';
      else if (type === 'play') iconHtml = '<i class="fa-solid fa-play"></i>';
      else if (type === 'warning') iconHtml = '<i class="fa-solid fa-shield-halved"></i>';

      const userTag = user ? `<span class="toast-user">@${user}</span>: ` : '';

      toast.innerHTML = `
        <div class="toast-icon">${iconHtml}</div>
        <div>${userTag}${message}</div>
      `;

      container.appendChild(toast);

      // Reproducir sonido de alerta sutil generado con Web Audio API (opcional y sin dependencias externas)
      playChimeSound(type);

      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 400);
      }, 4500);
    }

    function playChimeSound(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'skip' || type === 'add') {
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
        } else if (type === 'pause') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(330, now + 0.15);
        } else {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
        }

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.start(now);
        osc.stop(now + 0.35);
      } catch(e) {}
    }

    /* ==========================================================================
       EJECUCIÓN DE COMANDOS DE CHAT DE KICK / TWITCH Y MUTEX MULTI-INSTANCIA
       ========================================================================== */
    const WIDGET_INSTANCE_ID = 'sp_' + Math.random().toString(36).substring(2, 9);
    const GLOBAL_CMD_LOCK_KEY = 'jiko_spotify_cmd_lock';
    const GLOBAL_QUEUE_LOCK_KEY = 'jiko_spotify_queue_lock';
    const GLOBAL_SKIP_LOCK_KEY = 'jiko_spotify_skip_lock';
    const GLOBAL_ALERT_KEY = 'jiko_spotify_shared_alert';

    let lastHandledCommand = { text: '', time: 0 };
    const recentMsgIds = new Set();
    let isCurrentlyEnqueuing = false;
    let isCurrentlySkipping = false;
    let lastLocalSkipTime = 0;
    let lastSkippedTrackId = '';

    // Canal de sincronización cruzada entre fuentes de OBS y pestañas de navegador
    const SKIP_COOLDOWN_MS = 10000; // 10 segundos de cooldown global entre solicitudes de skipsong
    let syncChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        syncChannel = new BroadcastChannel('jiko_spotify_sync');
        syncChannel.onmessage = (e) => {
          if (!e.data || e.data.instance === WIDGET_INSTANCE_ID) return;

          if (e.data.type === 'SHOW_ALERT') {
            showFloatingAlert(e.data.msg, e.data.alertType, e.data.user);
          } else if (e.data.type === 'SKIP_EXECUTED') {
            const skipTime = e.data.time || Date.now();
            lastLocalSkipTime = skipTime;
            isCurrentlySkipping = true;
            if (e.data.trackId) lastSkippedTrackId = e.data.trackId;
            showFloatingAlert(e.data.msg || 'Saltando a la siguiente canción en Spotify...', 'skip', e.data.user);
            setTimeout(fetchPlaybackState, 1200);
            setTimeout(() => { isCurrentlySkipping = false; }, SKIP_COOLDOWN_MS);
          }
        };
      }
    } catch(e) {}

    // Escuchar alertas y skips disparados por otras instancias vía localStorage
    window.addEventListener('storage', (e) => {
      if (e.key === GLOBAL_ALERT_KEY && e.newValue) {
        try {
          const alertData = JSON.parse(e.newValue);
          if (alertData.instance !== WIDGET_INSTANCE_ID && (Date.now() - alertData.time) < 3000) {
            showFloatingAlert(alertData.msg, alertData.alertType, alertData.user);
          }
        } catch(err) {}
      } else if (e.key === GLOBAL_SKIP_LOCK_KEY && e.newValue) {
        try {
          const skipData = JSON.parse(e.newValue);
          if (skipData.instance !== WIDGET_INSTANCE_ID && (Date.now() - skipData.time) < SKIP_COOLDOWN_MS) {
            lastLocalSkipTime = skipData.time;
            isCurrentlySkipping = true;
            if (skipData.trackId) lastSkippedTrackId = skipData.trackId;
            setTimeout(() => { isCurrentlySkipping = false; }, SKIP_COOLDOWN_MS);
          }
        } catch(err) {}
      }
    });

    // Normalizar comandos con alias a su clave canónica para evitar duplicados entre alias
    function getCanonicalCommandKey(rawText) {
      const lower = (rawText || '').toLowerCase().trim().replace(/\s+/g, ' ');
      if (lower === '!skip' || lower === '!skipsong' || lower === '!saltar' ||
          lower.startsWith('!skip ') || lower.startsWith('!skipsong ') || lower.startsWith('!saltar ')) {
        return '!skipsong';
      }
      if (lower === '!play' || lower === '!reanudar') return '!play';
      if (lower === '!pausa' || lower === '!pause') return '!pause';
      if (lower === '!cancion' || lower === '!song' || lower === '!currentsong') return '!cancion';
      return lower;
    }

    // Candado global para evitar que múltiples fuentes OBS o eventos duplicados ejecuten el comando
    function acquireGlobalCmdLock(cmdText, user) {
      const now = Date.now();
      const canonicalKey = getCanonicalCommandKey(cmdText);
      const lockDuration = (canonicalKey === '!skipsong') ? SKIP_COOLDOWN_MS : 3500;

      // 1. Candado en memoria local de la instancia
      if (lastHandledCommand.text === canonicalKey && (now - lastHandledCommand.time) < lockDuration) {
        console.log(`[Spotify Widget] 🛡️ Ignorando comando duplicado en memoria (<${lockDuration}ms): "${cmdText}"`);
        return false;
      }
      lastHandledCommand = { text: canonicalKey, time: now };

      // 2. Candado compartido entre todas las fuentes de OBS / ventanas (localStorage)
      try {
        const raw = localStorage.getItem(GLOBAL_CMD_LOCK_KEY);
        if (raw) {
          const lock = JSON.parse(raw);
          if (lock.text === canonicalKey && (now - lock.time) < lockDuration) {
            console.log(`[Spotify Widget] 🛡️ [MUTEX GLOBAL] Comando ya ejecutado por otra fuente OBS (<${lockDuration}ms): "${cmdText}"`);
            return false;
          }
        }
        localStorage.setItem(GLOBAL_CMD_LOCK_KEY, JSON.stringify({
          text: canonicalKey,
          user: user,
          time: now,
          instance: WIDGET_INSTANCE_ID
        }));
      } catch (e) {}

      return true;
    }

    // Candado atómico antes de enviar a la cola de Spotify API
    function acquireGlobalQueueLock(trackUri) {
      const now = Date.now();
      try {
        const raw = localStorage.getItem(GLOBAL_QUEUE_LOCK_KEY);
        if (raw) {
          const lock = JSON.parse(raw);
          // Si la misma canción (URI) se mandó a encolar en los últimos 7 segundos por cualquier fuente, bloquear
          if (lock.uri === trackUri && (now - lock.time) < 7000) {
            console.log(`[Spotify Widget] 🛡️ [MUTEX GLOBAL] Canción URI ya encolada recientemente (<7s): ${trackUri}`);
            return false;
          }
        }
        localStorage.setItem(GLOBAL_QUEUE_LOCK_KEY, JSON.stringify({
          uri: trackUri,
          time: now,
          instance: WIDGET_INSTANCE_ID
        }));
      } catch (e) {}
      return true;
    }

    // Ejecución segura y atómica del salto de canción (cooldown de 10 segundos global)
    async function executeSkipSong(user, badges) {
      const isMod = checkIsModerator(user, badges);
      if (!isMod) {
        showFloatingAlert('Solo los moderadores de Kick pueden saltar canciones con !skipsong', 'warning', user);
        return;
      }

      const now = Date.now();

      // 1. Candado local en memoria
      if (isCurrentlySkipping) {
        console.log(`[Spotify Widget] 🛡️ Skip descartado: Ya hay un salto en proceso.`);
        return;
      }

      const localDiff = now - lastLocalSkipTime;
      if (localDiff < SKIP_COOLDOWN_MS) {
        const remSecs = Math.ceil((SKIP_COOLDOWN_MS - localDiff) / 1000);
        console.log(`[Spotify Widget] 🛡️ Skip en cooldown local: faltan ${remSecs}s.`);
        showFloatingAlert(`Espera ${remSecs}s para volver a saltar canción`, 'warning', user);
        return;
      }

      // 2. Candado global compartido en localStorage (10 segundos entre todas las fuentes y usuarios)
      try {
        const raw = localStorage.getItem(GLOBAL_SKIP_LOCK_KEY);
        if (raw) {
          const lock = JSON.parse(raw);
          const globalDiff = now - lock.time;
          if (globalDiff < SKIP_COOLDOWN_MS) {
            const remSecs = Math.ceil((SKIP_COOLDOWN_MS - globalDiff) / 1000);
            console.log(`[Spotify Widget] 🛡️ [MUTEX SKIP] Cooldown global activo: faltan ${remSecs}s.`);
            showFloatingAlert(`Espera ${remSecs}s para volver a saltar canción`, 'warning', user);
            return;
          }
          if (currentTrackId && lock.trackId && lock.trackId === currentTrackId && globalDiff < 15000) {
            console.log(`[Spotify Widget] 🛡️ [MUTEX SKIP] La pista ${currentTrackId} ya fue saltada recientemente.`);
            return;
          }
        }
        localStorage.setItem(GLOBAL_SKIP_LOCK_KEY, JSON.stringify({
          time: now,
          trackId: currentTrackId || '',
          user: user,
          instance: WIDGET_INSTANCE_ID
        }));
      } catch (e) {}

      // 3. Protección por ID de pista: no saltar 2 veces la misma pista en 15 segundos
      if (currentTrackId && lastSkippedTrackId === currentTrackId && (now - lastLocalSkipTime) < 15000) {
        console.log(`[Spotify Widget] 🛡️ La pista actual (${currentTrackId}) ya fue saltada en esta instancia.`);
        return;
      }

      isCurrentlySkipping = true;
      lastLocalSkipTime = now;
      if (currentTrackId) lastSkippedTrackId = currentTrackId;

      const skipMsg = 'Saltando a la siguiente canción en Spotify...';
      showFloatingAlert(skipMsg, 'skip', user);

      // Sincronizar inmediatamente con otras fuentes OBS para que no llamen a la API
      try {
        if (syncChannel) {
          syncChannel.postMessage({
            type: 'SKIP_EXECUTED',
            trackId: currentTrackId || '',
            user: user,
            msg: skipMsg,
            time: now,
            instance: WIDGET_INSTANCE_ID
          });
        }
      } catch (e) {}

      // 🛡️ REGLA DE ORO ANTI-DOBLE SALTO:
      // Si CONTROL_MODE es 'streamerbot', significa que Streamer.bot ya está configurado con una Sub-Action Fetch a skip.php.
      // Por ende, el widget SOLO muestra la animación y actualiza el estado SIN ejecutar otra llamada a la API.
      if (CONTROL_MODE === 'streamerbot') {
        console.log('[Spotify Widget] ⏭️ Modo Streamer.bot activo: Salto gestionado por Fetch externo. Omitiendo llamada duplicada.');
        setTimeout(fetchPlaybackState, 1500);
        setTimeout(() => { isCurrentlySkipping = false; }, SKIP_COOLDOWN_MS);
        return;
      }

      try {
        let skipped = false;
        // Intentar primero vía endpoint directo de MrBoost
        try {
          const mbRes = await fetch(`https://mrboostlive.com/spotify/skip.php?user=${encodeURIComponent(SPOTIFY_USER)}`, { cache: 'no-store' });
          if (mbRes.ok) {
            skipped = true;
            console.log('[Spotify Widget] ⏭️ Salto ejecutado con éxito vía MrBoost skip.php');
          }
        } catch(errMb) {}

        if (!skipped) {
          await spotifyApi('/me/player/next', 'POST');
        }
      } catch(e) {
        console.error('[Spotify Widget] Error al saltar canción:', e);
      } finally {
        setTimeout(fetchPlaybackState, 1200);
        setTimeout(() => {
          isCurrentlySkipping = false;
        }, SKIP_COOLDOWN_MS);
      }
    }

    async function handleKickChatCommand(cmdText, user = 'Viewer', badges = []) {
      const raw = cmdText.trim();
      const lower = raw.toLowerCase();

      // Control anti-duplicados (local y entre todas las instancias de OBS)
      if (!acquireGlobalCmdLock(raw, user)) {
        return;
      }

      // 1. COMANDO !skipsong (Solo para Moderadores, con 10s de cooldown global)
      if (lower === '!skipsong' || lower === '!skip' || lower === '!saltar' ||
          lower.startsWith('!skipsong ') || lower.startsWith('!skip ') || lower.startsWith('!saltar ')) {
        await executeSkipSong(user, badges);
        return;
      }

      // 2. COMANDO !addsong [nombre de la cancion (by nombre del artista)]
      if (lower.startsWith('!addsong ') || lower.startsWith('!cancion ') || lower.startsWith('!pedir ')) {
        const queryRaw = raw.replace(/^!addsong\s+|^!cancion\s+|^!pedir\s+/i, '').trim();
        if (!queryRaw) {
          showFloatingAlert('Uso: !addsong [nombre de la canción by artista]', 'warning', user);
          return;
        }

        await executeAddSongSearch(queryRaw, user);
        return;
      }

      // 3. COMANDO !play (Reanudar música)
      if (lower === '!play' || lower === '!reanudar') {
        let ok = await spotifyApi('/me/player/play', 'PUT');
        if (!ok) {
          try { await fetch(`https://mrboostlive.com/spotify/pause.php?user=${encodeURIComponent(SPOTIFY_USER)}`, { cache: 'no-store' }); ok = true; } catch(e) {}
        }
        isPlaying = true;
        document.getElementById('compactPlayerCard').classList.add('is-playing');
        showFloatingAlert('Música reanudada', 'play', user);
        setTimeout(fetchPlaybackState, 800);
        return;
      }

      // 4. COMANDO !pausa / !pause (Pausar música)
      if (lower === '!pausa' || lower === '!pause') {
        let ok = await spotifyApi('/me/player/pause', 'PUT');
        if (!ok) {
          try { await fetch(`https://mrboostlive.com/spotify/play.php?user=${encodeURIComponent(SPOTIFY_USER)}`, { cache: 'no-store' }); ok = true; } catch(e) {}
        }
        isPlaying = false;
        document.getElementById('compactPlayerCard').classList.remove('is-playing');
        showFloatingAlert('Música pausada', 'pause', user);
        setTimeout(fetchPlaybackState, 800);
        return;
      }

      // 5. COMANDO !cancion / !song (Banner en la esquina inferior derecha)
      if (lower === '!cancion' || lower === '!song' || lower === '!currentsong') {
        triggerSongInfoBanner(user);
        return;
      }
    }

    // Búsqueda inteligente y añadido a la cola con fallback garantizado a MrBoost
    async function executeAddSongSearch(queryText, user) {
      if (isCurrentlyEnqueuing) {
        console.log(`[Spotify Widget] ⏳ Ya hay una búsqueda/encolado en proceso, descartando concurrencia.`);
        return;
      }

      isCurrentlyEnqueuing = true;
      try {
        showFloatingAlert(`Buscando "${queryText}" en Spotify...`, 'info', user);

        // Normalizar formato "Song by Artist" o "Song de Artist"
        let cleanQuery = queryText;
        const byMatch = queryText.match(/(.+?)\s+(?:by|de|-)\s+(.+)/i);
        if (byMatch) {
          cleanQuery = `track:${byMatch[1].trim()} artist:${byMatch[2].trim()}`;
        }

        let enqueued = false;
        let songTitle = queryText;
        let songArtist = '';

        // 1. Intento por Spotify Web API
        let data = null;
        try {
          data = await spotifyApi(`/search?q=${encodeURIComponent(cleanQuery)}&type=track&limit=20`);
          if (!data || !data.tracks || data.tracks.items.length === 0) {
            data = await spotifyApi(`/search?q=${encodeURIComponent(queryText)}&type=track&limit=20`);
          }
        } catch(e) {}

        if (data && data.tracks && data.tracks.items.length > 0) {
          const items = data.tracks.items;
          const queryLower = queryText.toLowerCase();

          // Priorizar la versión oficial más popular y penalizar covers/karaoke si no fueron pedidos
          items.sort((a, b) => {
            let popA = a.popularity || 0;
            let popB = b.popularity || 0;
            const nameA = (a.name || '').toLowerCase();
            const nameB = (b.name || '').toLowerCase();
            const isJunkA = !queryLower.includes('karaoke') && (nameA.includes('karaoke') || nameA.includes('tribute') || nameA.includes('cover') || nameA.includes('instrumental'));
            const isJunkB = !queryLower.includes('karaoke') && (nameB.includes('karaoke') || nameB.includes('tribute') || nameB.includes('cover') || nameB.includes('instrumental'));
            if (isJunkA) popA -= 50;
            if (isJunkB) popB -= 50;
            return popB - popA;
          });

          const track = items[0];
          songTitle = track.name;
          songArtist = track.artists ? track.artists[0].name : '';

          // 🛡️ Candado atómico antes de encolar en Spotify
          if (!acquireGlobalQueueLock(track.uri)) {
            console.log(`[Spotify Widget] 🛡️ Canción "${track.name}" omitida porque ya fue encolada por otra fuente.`);
            return;
          }

          const res = await spotifyApi(`/me/player/queue?uri=${encodeURIComponent(track.uri)}`, 'POST');
          if (res) {
            enqueued = true;
          }
        }

        // 2. Si falló la API directa (dispositivo en reposo, token vencido o sin premium), Fallback inmediato a MrBoost
        if (!enqueued) {
          console.log(`[Spotify Widget] 🔄 Activando fallback de encolado vía MrBoost add_to_queue.php para: "${songTitle}"`);
          try {
            const mbSearchTerm = songArtist ? `${songTitle} ${songArtist}` : queryText;
            const mbUrl = `https://mrboostlive.com/spotify/add_to_queue.php?user=${encodeURIComponent(SPOTIFY_USER)}&song_name=${encodeURIComponent(mbSearchTerm)}`;
            const mbRes = await fetch(mbUrl, { cache: 'no-store' });
            if (mbRes.ok) {
              enqueued = true;
            }
          } catch(errMb) {
            console.error('[Spotify Widget] Fallback MrBoost falló:', errMb);
          }
        }

        if (enqueued) {
          const successMsg = `Añadida a la cola: "${songTitle}" ${songArtist ? `(${songArtist})` : ''}`;
          showFloatingAlert(successMsg, 'add', user);

          // Sincronizar alerta visual con otras fuentes OBS si existen
          try {
            if (syncChannel) syncChannel.postMessage({ type: 'SHOW_ALERT', msg: successMsg, alertType: 'add', user, instance: WIDGET_INSTANCE_ID });
            localStorage.setItem(GLOBAL_ALERT_KEY, JSON.stringify({ msg: successMsg, alertType: 'add', user, instance: WIDGET_INSTANCE_ID, time: Date.now() }));
          } catch(e) {}
        } else {
          showFloatingAlert(`No se pudo encolar "${queryText}". Ten Spotify sonando en algún dispositivo.`, 'warning', user);
        }
      } catch(errGlobal) {
        console.error('[Spotify Widget] Error en búsqueda de canción:', errGlobal);
        showFloatingAlert(`Error al buscar "${queryText}"`, 'warning', user);
      } finally {
        isCurrentlyEnqueuing = false;
      }
    }

    // Activador global de comandos directos vía Fetch a MrBoost (para botones interactivos)
    window.triggerFetchCommand = async function(action, param = '') {
      let url = '';
      let label = '';
      switch(action) {
        case 'skip':
        case 'next':
          url = `https://mrboostlive.com/spotify/skip.php?user=${encodeURIComponent(SPOTIFY_USER)}`;
          label = 'Saltando canción...';
          break;
        case 'play':
          url = `https://mrboostlive.com/spotify/pause.php?user=${encodeURIComponent(SPOTIFY_USER)}`;
          label = 'Reanudando música...';
          break;
        case 'pause':
          url = `https://mrboostlive.com/spotify/play.php?user=${encodeURIComponent(SPOTIFY_USER)}`;
          label = 'Pausando música...';
          break;
        case 'add':
          if (!param) param = 'Bohemian Rhapsody Queen';
          url = `https://mrboostlive.com/spotify/add_to_queue.php?user=${encodeURIComponent(SPOTIFY_USER)}&song_name=${encodeURIComponent(param)}`;
          label = `Añadiendo a cola: "${param}"...`;
          break;
      }

      showFloatingAlert(label, action === 'pause' ? 'pause' : (action === 'play' ? 'play' : (action === 'add' ? 'add' : 'skip')), 'DirectFetch');
      try {
        const res = await fetch(url, { cache: 'no-store' });
        console.log(`[Spotify Widget] Direct Fetch [${action}] respuesta:`, res.status);
        setTimeout(fetchPlaybackState, 1500);
        return true;
      } catch(e) {
        console.error(`[Spotify Widget] Error Direct Fetch [${action}]:`, e);
        return false;
      }
    };

    // Verificación estricta de Moderadores de Kick
    function checkIsModerator(username, badges = []) {
      const normUser = (username || '').toLowerCase().replace('@', '').trim();

      // 1. Revisar lista de moderadores autorizados (Whitelist administrativa)
      if (kickModerators.includes(normUser)) return true;

      // 2. Revisar badges de Kick
      if (Array.isArray(badges)) {
        const hasModBadge = badges.some(b => {
          const type = (typeof b === 'string' ? b : (b.type || b.badge || b.name || '')).toLowerCase();
          return type === 'moderator' || type === 'broadcaster' || type === 'owner' || type === 'admin';
        });
        if (hasModBadge) return true;
      }

      return false;
    }

    /* ==========================================================================
       CONEXIÓN WEBSOCKET CON STREAMER.BOT (KICK / TWITCH CHAT)
       ========================================================================== */
    let streamerbotWs = null;
    let wsPort = urlParams.get('ws_port') || urlParams.get('port') || '8080';

    function initStreamerbotConnection() {
      const ports = [wsPort, '8080', '4445'];
      let portIdx = 0;

      function connectToPort(p) {
        const url = `ws://127.0.0.1:${p}/`;
        console.log(`[Spotify Widget] Conectando a Streamer.bot en ${url}...`);

        try {
          streamerbotWs = new WebSocket(url);

          streamerbotWs.onopen = () => {
            console.log(`[Spotify Widget] ✅ Conectado a Streamer.bot (puerto ${p})`);
            streamerbotWs.send(JSON.stringify({
              request: 'Subscribe',
              id: 'spotify-widget-kick',
              events: {
                General: ['Custom'],
                Kick: ['ChatMessage'], // ⚠️ Solo ChatMessage para evitar doble disparo en Streamer.bot
                Twitch: ['ChatMessage']
              }
            }));
          };

          streamerbotWs.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              const data = msg.data || msg.body || msg;

              // Mensajes de Chat de Kick / Twitch
              const isChat = (msg.event && (msg.event.type === 'ChatMessage' || msg.event.type === 'Custom')) || 
                             msg.type === 'ChatMessage' || data.message || data.messageText;

              if (isChat) {
                const messageObj = data.message || data;
                const userObj = data.user || data.sender || {};
                const username = typeof userObj === 'string' ? userObj : (userObj.username || userObj.name || data.userName || 'Usuario');
                const badges = userObj.badges || data.badges || [];
                const content = typeof messageObj === 'string' ? messageObj : (messageObj.message || data.messageText || data.text || '');

                // Huella digital infalible para deduplicar eventos gemelos de Kick o Streamer.bot
                const rawMsgId = (data.message && data.message.id) || data.id || data.messageId || data.message_id || '';
                const timeBucket = Math.floor(Date.now() / 3000);
                const dedupeKey = rawMsgId ? `id_${rawMsgId}` : `msg_${username}_${(content || '').toLowerCase().trim()}_${timeBucket}`;

                if (recentMsgIds.has(dedupeKey)) {
                  console.log(`[Spotify Widget] 🛡️ Mensaje de chat duplicado descartado por WebSocket: ${dedupeKey}`);
                  return;
                }
                recentMsgIds.add(dedupeKey);
                setTimeout(() => recentMsgIds.delete(dedupeKey), 15000);

                if (content && content.startsWith('!')) {
                  handleKickChatCommand(content, username, badges);
                }
              }
            } catch(e) {}
          };

          streamerbotWs.onerror = () => {
            streamerbotWs.close();
          };

          streamerbotWs.onclose = () => {
            portIdx = (portIdx + 1) % ports.length;
            setTimeout(() => connectToPort(ports[portIdx]), 5000);
          };
        } catch(e) {
          setTimeout(() => connectToPort(ports[(portIdx + 1) % ports.length]), 5000);
        }
      }

      connectToPort(ports[0]);
    }

    /* ==========================================================================
       COMUNICACIÓN BIDIRECCIONAL DESDE EL LABORATORIO (POSTMESSAGE)
       ========================================================================== */
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'object') return;

      // 1. Simulación de comandos desde prueba.html
      if (e.data.type === 'SIMULATE_KICK_COMMAND') {
        const cmd = e.data.command;
        const user = e.data.user || 'Streamer';
        const badges = e.data.badges || (e.data.isMod ? [{ type: 'moderator' }] : []);
        handleKickChatCommand(cmd, user, badges);
      }

      // 2. Actualización de Whitelist de moderadores
      if (e.data.type === 'UPDATE_MODS_WHITELIST') {
        kickModerators = e.data.moderators || [];
        try { localStorage.setItem('kick_moderators_whitelist', JSON.stringify(kickModerators)); } catch(e) {}
      }

      // 3. Posicionamiento forzado
      if (e.data.type === 'SET_POSITION') {
        dockWidgetTo(e.data.position);
      }

      // 4. Cambio de tema
      if (e.data.type === 'SET_THEME') {
        setTheme(e.data.theme);
      }

      // 5. Autenticación exitosa
      if (e.data.type === 'SPOTIFY_AUTH_SUCCESS') {
        accessToken = e.data.token || localStorage.getItem('spotify_access_token');
        refreshToken = localStorage.getItem('spotify_refresh_token');
        tokenExpires = parseInt(localStorage.getItem('spotify_token_expires') || '0', 10);
        showFloatingAlert('Spotify Conectado', 'play');
        setDisconnectedUI(false);
        fetchPlaybackState();
      }
    });

    /* ==========================================================================
       INICIALIZACIÓN GENERAL DEL WIDGET
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedPosition();
      fetchPlaybackState();
      startLocalProgressTicker();
      initStreamerbotConnection();

      // Polling cada 3.5 segundos con Spotify API
      pollInterval = setInterval(fetchPlaybackState, 3500);

      // BroadcastChannel para sincronizar autenticación en vivo
      try {
        const bc = new BroadcastChannel('spotify_auth_channel');
        bc.onmessage = (ev) => {
          if (ev.data && ev.data.type === 'SPOTIFY_AUTH_SUCCESS') {
            accessToken = ev.data.token;
            refreshToken = localStorage.getItem('spotify_refresh_token');
            tokenExpires = parseInt(localStorage.getItem('spotify_token_expires') || '0', 10);
            setDisconnectedUI(false);
            fetchPlaybackState();
          }
        };
      } catch(e) {}
    });
  </script>
