<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Widget - Rotador de Redes Sociales</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Garantizar 100% transparencia cristalina en Browser Source de OBS */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      overflow: hidden !important;
    }
    .widget-stage {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
    }
    .social-rotator-widget {
      filter: none !important;
      -webkit-filter: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
  </style>
</head>
<body>

  <!-- Escenario Transparente para OBS -->
  <div class="widget-stage">
    
    <!-- Widget Rotador de Redes Sociales -->
    <div class="social-rotator-widget" id="social-widget-box">
      <div class="social-icon-box" id="social-icon"></div>
      <div style="display: flex; flex-direction: column;">
        <div class="social-platform-name" id="social-platform">Kick</div>
        <div class="social-handle" id="social-handle">@jikokun</div>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
