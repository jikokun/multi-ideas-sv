<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kick Live Chat Widget</title>
  <!-- Cliente Pusher JS para escuchar WebSocket de Kick -->
  <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent !important;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100vh;
      padding: 12px;
      gap: 8px;
    }

    .message-card {
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(4px);
      border-left: 4px solid #53fc18;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .username {
      font-weight: bold;
      margin-right: 6px;
      font-size: 14px;
    }

    .message-text { color: #f1f5f9; }

    .kick-emote {
      height: 24px;
      vertical-align: middle;
      margin: 0 2px;
    }

    .status-card {
      background: rgba(239, 68, 68, 0.8);
      border-left-color: #f87171;
    }
  </style>
</head>
<body>

  <div id="chat-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const channelName = urlParams.get('channel') || urlParams.get('username') || urlParams.get('canal');
    const chatContainer = document.getElementById('chat-container');

    if (!channelName) {
      displayStatus("Ingresa el parámetro ?channel=tu_usuario en la URL", true);
    } else {
      initChatWidget(channelName.toLowerCase().trim());
    }

    async function initChatWidget(channel) {
      try {
        let chatroomId = null;

        // 1. Obtener chatroom_id mediante nuestro proxy PHP get_chatroom.php en el servidor
        try {
          const response = await fetch(`get_chatroom.php?channel=${encodeURIComponent(channel)}`);
          if (response.ok) {
            const data = await response.json();
            if (data && data.chatroom_id) {
              chatroomId = data.chatroom_id;
            }
          }
        } catch (e) {
          console.warn("[Kick Chat] get_chatroom.php no disponible localmente, probando fallback...");
        }

        // 1b. Fallback: Consulta REST directa de Kick API v2 o proxies CORS si get_chatroom.php no devuelve datos
        if (!chatroomId) {
          try {
            const directRes = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(channel)}`);
            if (directRes.ok) {
              const directData = await directRes.json();
              chatroomId = directData.chatroom?.id;
            }
          } catch(e) {}
        }

        if (!chatroomId) {
          try {
            const proxyRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + channel)}`);
            if (proxyRes.ok) {
              const proxyData = await proxyRes.json();
              chatroomId = proxyData.chatroom?.id;
            }
          } catch(e) {}
        }

        if (!chatroomId) {
          throw new Error(`No se pudo recuperar el ID del canal @${channel}.`);
        }

        console.log(`[Kick API] Canal: ${channel} | Chatroom ID: ${chatroomId}`);

        // 2. Conexión al Clúster WebSocket de Pusher usado por Kick
        const PUSHER_KEY = "eb1d5f28b619a93b7726";
        const PUSHER_CLUSTER = "us2";

        const pusher = new Pusher(PUSHER_KEY, {
          cluster: PUSHER_CLUSTER,
          wsHost: `ws-${PUSHER_CLUSTER}.pusher.com`,
          wsPort: 443,
          wssPort: 443,
          enabledTransports: ['ws', 'wss'],
          forceTLS: true
        });

        // Suscribirse a la sala del canal
        const pusherChannel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);

        // Handler unificado para eventos
        const eventHandler = function(msgData) {
          renderMessage(msgData);
        };

        // 3. Escuchar mensajes del chat en tiempo real
        pusherChannel.bind('App\\Events\\ChatMessageEvent', eventHandler);
        pusherChannel.bind('App\Events\ChatMessageEvent', eventHandler);
        pusherChannel.bind('ChatMessageEvent', eventHandler);

        // Captura global de eventos en el canal por si varía la estructura
        pusherChannel.bind_global(function(eventName, data) {
          if (eventName && (eventName.includes('ChatMessage') || eventName.includes('Message'))) {
            renderMessage(data);
          }
        });

        // Notificación de estado al conectar
        pusher.connection.bind('connected', function() {
          displayStatus(`🟢 Conectado al chat de Kick para @${channel}. Esperando mensajes en vivo...`);
        });

      } catch (err) {
        displayStatus(err.message, true);
      }
    }

    // Parsea cualquier tipo de payload retornado por Pusher (string JSON u objeto anidado)
    function parsePusherPayload(raw) {
      if (!raw) return null;
      let payload = raw;
      if (typeof payload === 'string') {
        try { payload = JSON.parse(payload); } catch(e) {}
      }
      if (payload && payload.data) {
        if (typeof payload.data === 'string') {
          try { payload = JSON.parse(payload.data); } catch(e) {}
        } else if (typeof payload.data === 'object') {
          payload = payload.data;
        }
      }
      return payload;
    }

    function renderMessage(rawData) {
      const data = parsePusherPayload(rawData);
      if (!data) return;

      const sender = data.sender || data.user || data.author || {};
      const username = sender.username || sender.slug || data.username || 'Usuario';
      const color = sender.identity?.color || sender.color || '#53fc18';
      let content = data.content || data.message || data.text || '';

      if (!content) return;

      // Reemplazo de sintaxis de emotes [emote:ID:NOMBRE] por imagen CDN de Kick
      content = content.replace(/\[emote:(\d+):([\w-]+)\]/g, (match, id, name) => {
        return `<img class="kick-emote" src="https://files.kick.com/emotes/${id}/fullsize" title="${name}" alt="${name}">`;
      });

      const card = document.createElement('div');
      card.className = 'message-card';
      card.style.borderLeftColor = color;

      const userSpan = document.createElement('span');
      userSpan.className = 'username';
      userSpan.style.color = color;
      userSpan.textContent = username + ':';

      const textSpan = document.createElement('span');
      textSpan.className = 'message-text';
      textSpan.innerHTML = content;

      card.appendChild(userSpan);
      card.appendChild(textSpan);

      chatContainer.appendChild(card);

      // Limitar a los últimos 12 mensajes en pantalla
      while (chatContainer.children.length > 12) {
        chatContainer.removeChild(chatContainer.firstChild);
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function displayStatus(msg, isError = false) {
      const card = document.createElement('div');
      card.className = isError ? 'message-card status-card' : 'message-card';
      card.innerHTML = `<strong>Widget Status:</strong> ${msg}`;
      chatContainer.appendChild(card);
    }

    // Escuchar mensajes de prueba del configurador (postMessage)
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'SEND_TEST_CHAT') {
        renderMessage({
          sender: { username: event.data.username || channelName || 'TestUser', identity: { color: '#53fc18' } },
          content: event.data.message || '¡Prueba de Chat de Kick exitosa!'
        });
      }
    });
  </script>
</body>
</html>
