<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Widget - Contador Kick en Vivo (Espectadores & Seguidores)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Escenario Transparente para OBS -->
  <div class="widget-stage">
    
    <!-- Widget Contador Kick en Vivo -->
    <div class="kick-live-widget">
      <div class="kick-avatar-box">
        <img id="kick-avatar-img" src="https://files.kick.com/images/user/default_avatar.png" alt="Avatar">
      </div>
      
      <div class="kick-info-col">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="kick-channel-name" id="kick-channel-name">@jikokun</div>
          <div class="kick-live-badge" id="kick-live-badge">
            <span class="live-dot"></span> EN VIVO
          </div>
        </div>

        <div class="kick-stats-row" style="margin-top: 2px;">
          <div class="stat-item">
            <span>👁️</span> <span id="kick-viewers-count">0</span>
          </div>
          <div class="stat-item" style="color: #ffffff; opacity: 0.9;">
            <span>👥</span> <span id="kick-followers-count">0</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
