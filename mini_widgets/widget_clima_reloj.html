<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Widget - Clima & Reloj en Vivo (Transparente OBS)</title>
  
  <!-- Tipografías de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Escenario OBS 100% Transparente -->
  <div class="widget-stage">
    
    <!-- Widget de Clima + Reloj en Vivo (Sin fondo / Transparente) -->
    <div class="weather-clock-widget" id="weather-clock-container">
      <div class="weather-clock" id="widget-clock">--:-- PM</div>
      <div class="weather-main">
        <div class="weather-icon-box" id="widget-weather-icon">🌙</div>
        <div class="weather-temp-info">
          <span class="weather-temp" id="widget-temp">23°C</span>
          <span class="weather-desc" id="widget-desc">Cargando clima...</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Script Principal JS -->
  <script src="js/script.js"></script>
</body>
</html>
