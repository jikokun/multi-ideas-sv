<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Mapa de Negocios Cercanos | Sensun Shop</title>
    <meta name="description"
        content="Mapa geográfico interactivo de negocios, restaurantes, emprendimientos y profesionales en Sensuntepeque, Cabañas. Encuentra comercios cerca de ti.">
    <link rel="icon" href="../imagenes/logos/icono-sensun-shop.webp?v=1" type="image/webp">
    <link rel="shortcut icon" href="../imagenes/logos/icono-sensun-shop.webp?v=1" type="image/webp">
    <link rel="apple-touch-icon" href="../imagenes/logos/icono-sensun-shop.webp?v=1">
    <link rel="stylesheet" href="../estilos.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.querySelector('link[href*="estilos.css"]').href = '../estilo_claro.css?v=3';
            }
        })();
    </script>

    <style>
        :root {
            --ss-orange: #e8621a;
            --ss-purple: #8e44ad;
            --cyan: var(--ss-orange);
            --cyan-glow: #ff7e33;
            --cyan-light: #ffb703;
        }

        .web-logo {
            filter: none;
        }

        /* Layout de la Página del Mapa Completo */
        .map-page-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 4% 60px 4%;
        }

        .map-page-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .map-page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin: 10px 0 6px 0;
            line-height: 1.2;
            transition: color 0.25s ease;
        }

        .map-page-header p {
            color: var(--text-gray, #94a3b8);
            font-size: 0.95rem;
            max-width: 700px;
            margin: 0 auto;
            transition: color 0.25s ease;
        }

        .gradient-text {
            background: linear-gradient(135deg, #ffa366 0%, var(--ss-orange) 50%, #8e44ad 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Barra de Filtros y Controles con Carrusel */
        .fullmap-controls-card {
            background: rgba(18, 22, 32, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(232, 98, 26, 0.25);
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Contenedor del Carrusel de Categorías */
        .fullmap-categories-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .fullmap-carousel-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            user-select: none;
            z-index: 2;
        }

        .fullmap-carousel-btn:hover {
            background: var(--ss-orange);
            border-color: var(--ss-orange);
            color: #ffffff;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(232, 98, 26, 0.4);
        }

        .fullmap-carousel-btn:active {
            transform: scale(0.94);
        }

        .fullmap-carousel-btn:disabled,
        .fullmap-carousel-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
            transform: none;
            box-shadow: none;
        }

        .fullmap-categories {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 2px;
            cursor: grab;
            user-select: none;
            flex: 1;
        }

        .fullmap-categories.is-dragging {
            cursor: grabbing;
            scroll-behavior: auto;
        }

        .fullmap-categories::-webkit-scrollbar {
            display: none;
        }

        .fullmap-cat-btn {
            padding: 7px 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            transition: all 0.22s ease;
        }

        .fullmap-cat-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border-color: rgba(232, 98, 26, 0.4);
            transform: translateY(-1px);
        }

        .fullmap-cat-btn.active {
            background: linear-gradient(135deg, var(--ss-orange), var(--ss-purple));
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(232, 98, 26, 0.45);
        }

        .fullmap-actions-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .fullmap-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fullmap-action-btn:hover {
            background: rgba(232, 98, 26, 0.25);
            border-color: var(--ss-orange);
            transform: translateY(-2px);
        }

        .fullmap-action-btn.active-gps {
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
            animation: gpsPulse 2s infinite;
        }

        .fullmap-layer-dropdown {
            padding: 8px 12px;
            border-radius: 12px;
            background: #181d2a;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        /* Contenedor Principal: Mapa y Barra Lateral */
        .fullmap-main-box {
            display: flex;
            background: #0e121a;
            border: 1px solid rgba(232, 98, 26, 0.3);
            border-radius: 24px;
            height: 74vh;
            min-height: 550px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(232, 98, 26, 0.1);
        }

        .fullmap-viewport {
            flex: 1;
            position: relative;
            height: 100%;
        }

        #sensunFullMap {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #151922;
        }

        .fullmap-sidebar-panel {
            width: 360px;
            background: #121620;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .fullmap-sidebar-head {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fullmap-search-bar {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            background: #181e2a;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .fullmap-search-bar:focus {
            border-color: var(--ss-orange);
            box-shadow: 0 0 15px rgba(232, 98, 26, 0.3);
        }

        .fullmap-count-badge {
            font-size: 0.76rem;
            font-weight: 700;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fullmap-sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .fullmap-sidebar-scroll::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .fullmap-item-card {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.22s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fullmap-item-card:hover {
            background: rgba(232, 98, 26, 0.14);
            border-color: var(--ss-orange);
            transform: translateX(4px);
        }

        .fullmap-item-thumb {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: #1c2230;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fullmap-item-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fullmap-item-info {
            flex: 1;
            min-width: 0;
        }

        .fullmap-item-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fullmap-item-sub {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .fullmap-dist-pill {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 6px;
            background: rgba(2, 132, 199, 0.25);
            color: #38bdf8;
            font-weight: 800;
            font-size: 0.72rem;
        }

        /* Pines Leaflet Personalizados */
        .sensun-full-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border: 2.5px solid #ffffff;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sensun-full-pin:hover {
            transform: rotate(-45deg) scale(1.22);
            z-index: 1000 !important;
        }

        .sensun-full-pin-inner {
            transform: rotate(45deg);
            font-size: 17px;
            line-height: 1;
        }

        /* User Location Pin */
        .sensun-user-pin {
            width: 24px;
            height: 24px;
            background: #0284c7;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.9);
            position: relative;
        }

        .sensun-user-pin::after {
            content: '';
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            animation: gpsRing 1.8s infinite;
        }

        @keyframes gpsRing {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.3); opacity: 0; }
        }

        @keyframes gpsPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* Adaptación Responsive */
        @media (max-width: 900px) {
            .fullmap-controls-card {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 12px 14px;
            }
            .fullmap-categories-wrapper {
                width: 100%;
            }
            .fullmap-actions-group {
                justify-content: space-between;
                overflow-x: auto;
                padding-bottom: 2px;
                width: 100%;
            }
            .fullmap-main-box {
                flex-direction: column;
                height: 82vh;
            }
            .fullmap-sidebar-panel {
                width: 100%;
                height: 220px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
            }
            .fullmap-viewport {
                flex: 1;
            }
        }

        /* ========================================================
           SOPORTE Y OPTIMIZACIÓN EN MODO CLARO
           ======================================================== */
        body.light-theme .map-page-header h1,
        html.light-theme .map-page-header h1,
        .light-theme .map-page-header h1 {
            color: #0f172a !important;
        }

        body.light-theme .gradient-text,
        html.light-theme .gradient-text,
        .light-theme .gradient-text {
            background: linear-gradient(135deg, var(--ss-purple) 0%, var(--ss-orange) 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 2px 4px rgba(232, 98, 26, 0.15)) !important;
        }

        body.light-theme .map-page-header p,
        html.light-theme .map-page-header p,
        .light-theme .map-page-header p {
            color: #475569 !important;
        }

        body.light-theme .map-badge,
        html.light-theme .map-badge,
        .light-theme .map-badge {
            background: rgba(232, 98, 26, 0.1) !important;
            color: #c2410c !important;
            border-color: rgba(232, 98, 26, 0.35) !important;
            font-weight: 700 !important;
        }

        body.light-theme .fullmap-controls-card,
        html.light-theme .fullmap-controls-card,
        .light-theme .fullmap-controls-card {
            background: rgba(255, 255, 255, 0.92) !important;
            border: 1.5px solid rgba(232, 98, 26, 0.22) !important;
            box-shadow: 0 10px 30px rgba(142, 68, 173, 0.05), 0 2px 8px rgba(232, 98, 26, 0.04) !important;
        }

        body.light-theme .fullmap-carousel-btn,
        html.light-theme .fullmap-carousel-btn,
        .light-theme .fullmap-carousel-btn {
            background: #ffffff !important;
            border: 1.5px solid rgba(203, 213, 225, 0.8) !important;
            color: #1e293b !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06) !important;
        }

        body.light-theme .fullmap-carousel-btn:hover,
        html.light-theme .fullmap-carousel-btn:hover,
        .light-theme .fullmap-carousel-btn:hover {
            background: #fff7ed !important;
            border-color: var(--ss-orange) !important;
            color: var(--ss-orange) !important;

        }

        body.light-theme .fullmap-cat-btn,
        html.light-theme .fullmap-cat-btn,
        .light-theme .fullmap-cat-btn {
            background: #ffffff !important;
            border: 1.5px solid rgba(226, 232, 240, 0.95) !important;
            color: #475569 !important;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03) !important;
        }

        body.light-theme .fullmap-cat-btn:hover,
        html.light-theme .fullmap-cat-btn:hover,
        .light-theme .fullmap-cat-btn:hover {
            background: #fff7ed !important;
            border-color: var(--ss-orange) !important;
            color: var(--ss-orange) !important;
            transform: translateY(-1px);
        }

        body.light-theme .fullmap-cat-btn.active,
        html.light-theme .fullmap-cat-btn.active,
        .light-theme .fullmap-cat-btn.active {
            background: linear-gradient(135deg, #e8621a 0%, #8e44ad 100%) !important;
            color: #ffffff !important;
            border-color: transparent !important;
            box-shadow: 0 4px 14px rgba(232, 98, 26, 0.35) !important;
        }

        body.light-theme .fullmap-action-btn,
        html.light-theme .fullmap-action-btn,
        .light-theme .fullmap-action-btn {
            background: #ffffff !important;
            border: 1.5px solid rgba(203, 213, 225, 0.8) !important;
            color: #1e293b !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03) !important;
        }

        body.light-theme .fullmap-action-btn:hover,
        html.light-theme .fullmap-action-btn:hover,
        .light-theme .fullmap-action-btn:hover {
            background: #fff7ed !important;
            border-color: var(--ss-orange) !important;
            color: var(--ss-orange) !important;
        }

        body.light-theme .fullmap-layer-dropdown,
        html.light-theme .fullmap-layer-dropdown,
        .light-theme .fullmap-layer-dropdown {
            background: #ffffff !important;
            border: 1.5px solid rgba(203, 213, 225, 0.8) !important;

        }

        body.light-theme .fullmap-main-box,
        html.light-theme .fullmap-main-box,
        .light-theme .fullmap-main-box {

        body.light-theme .fullmap-sidebar-panel,
        html.light-theme .fullmap-sidebar-panel,
        .light-theme .fullmap-sidebar-panel {
            background: rgba(255, 255, 255, 0.98) !important;
            border-left: 1px solid rgba(226, 232, 240, 0.9) !important;
        }

        body.light-theme .fullmap-sidebar-head,
        html.light-theme .fullmap-sidebar-head,
        .light-theme .fullmap-sidebar-head {

<body>
    <header id="global-header"></header>

    <main class="map-page-wrapper">
        <!-- Encabezado de la Página -->
        <div class="map-page-header">
            <span class="badge map-badge" style="background: rgba(232, 98, 26, 0.15); color: var(--ss-orange); border-color: rgba(232, 98, 26, 0.3);">
                DIRECTORIO GEOGRÁFICO INTERACTIVO
            </span>
            <h1>Mapa de Negocios en <span class="gradient-text">Sensuntepeque</span></h1>
            <p>Explora la ubicación exacta de comercios, restaurantes, servicios y profesionales locales en Cabañas con direcciones y contacto directo.</p>
        </div>

        <!-- Barra de Filtros y Herramientas con Carrusel -->
        <div class="fullmap-controls-card">
            <div class="fullmap-categories-wrapper">
                <button type="button" class="fullmap-carousel-btn prev" id="fullmapCatPrev" aria-label="Desplazar categorías a la izquierda" title="Desplazar a la izquierda">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <div class="fullmap-categories" id="fullMapCategoryPills" role="tablist">
                    <button class="fullmap-cat-btn active" data-cat="all" onclick="setFullMapCategory('all', this)"><span>🌟</span> <span>Todos</span></button>
                    <button class="fullmap-cat-btn" data-cat="comida" onclick="setFullMapCategory('comida', this)"><span>🍕</span> <span>Comida</span></button>
                    <button class="fullmap-cat-btn" data-cat="comercio" onclick="setFullMapCategory('comercio', this)"><span>🏪</span> <span>Comercio</span></button>
                    <button class="fullmap-cat-btn" data-cat="salud" onclick="setFullMapCategory('salud', this)"><span>🩺</span> <span>Salud</span></button>
                    <button class="fullmap-cat-btn" data-cat="emergencias" onclick="setFullMapCategory('emergencias', this)"><span>🚨</span> <span>Emergencias</span></button>
                    <button class="fullmap-cat-btn" data-cat="emprendedores" onclick="setFullMapCategory('emprendedores', this)"><span>🚀</span> <span>Emprendedores</span></button>
                    <button class="fullmap-cat-btn" data-cat="profesionales" onclick="setFullMapCategory('profesionales', this)"><span>🎓</span> <span>Profesionales</span></button>
                    <button class="fullmap-cat-btn" data-cat="servicios" onclick="setFullMapCategory('servicios', this)"><span>🛠️</span> <span>Oficios & Servicios</span></button>
                    <button class="fullmap-cat-btn" data-cat="fotografia" onclick="setFullMapCategory('fotografia', this)"><span>📸</span> <span>Fotografía</span></button>
                    <button class="fullmap-cat-btn" data-cat="tecnologia" onclick="setFullMapCategory('tecnologia', this)"><span>💻</span> <span>Tecnología</span></button>
                    <button class="fullmap-cat-btn" data-cat="diseno" onclick="setFullMapCategory('diseno', this)"><span>🎨</span> <span>Diseño</span></button>
                    <button class="fullmap-cat-btn" data-cat="mascotas" onclick="setFullMapCategory('mascotas', this)"><span>🐾</span> <span>Mascotas</span></button>
                    <button class="fullmap-cat-btn" data-cat="belleza" onclick="setFullMapCategory('belleza', this)"><span>💈</span> <span>Belleza</span></button>
                </div>
                <button type="button" class="fullmap-carousel-btn next" id="fullmapCatNext" aria-label="Desplazar categorías a la derecha" title="Desplazar a la derecha">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
            </div>

            <div class="fullmap-actions-group">
                <button type="button" class="fullmap-action-btn" id="btnFullGps" onclick="triggerFullMapGps()" title="Calcular negocios más cercanos a mi ubicación actual">
                    <span>📍</span> <span id="fullGpsLabel">Mi Ubicación</span>
                </button>
                <button type="button" class="fullmap-action-btn" onclick="recenterFullMap()" title="Centrar mapa en el casco urbano de Sensuntepeque">
                    <span>🎯</span> Centrar
                </button>
                <button type="button" class="fullmap-action-btn" onclick="fitFullMapAllMarkers()" title="Ver todos los comercios en pantalla">
                    <span>🔍</span> Ver Todos
                </button>
                <select class="fullmap-layer-dropdown" id="fullMapLayerSelect" onchange="changeFullMapLayer(this.value)">
                    <option value="osm">🌐 OpenStreetMap</option>
                    <option value="esriStreet">🗺️ Calles Claras</option>
                    <option value="satellite">🛰️ Satélite Real</option>
                </select>
            </div>
        </div>

        <!-- Contenedor del Mapa Dividido -->
        <div class="fullmap-main-box">
            <div class="fullmap-viewport">
                <div id="sensunFullMap"></div>
            </div>

            <div class="fullmap-sidebar-panel">
                <div class="fullmap-sidebar-head">
                    <input type="text" 
                           id="fullMapSearch" 
                           class="fullmap-search-bar" 
                           placeholder="🔍 Buscar por nombre o rubro..." 
                           oninput="onFullMapSearch(this.value)">
                    <div class="fullmap-count-badge">
                        <span id="fullMapCountText">Cargando negocios...</span>
                        <span style="color: var(--ss-orange);">Sensuntepeque</span>
                    </div>
                </div>

                <div class="fullmap-sidebar-scroll" id="fullMapSidebarList">
                    <!-- Generado dinámicamente -->
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script principal de navegación global -->
    <script src="../script.js"></script>
    <!-- Script de datos Firebase y valoraciones -->
    <script type="module" src="sensun_ratings.js?v=5"></script>

    <!-- Lógica del Mapa Completo -->
    <script>
        let fullMap = null;
        let fullMarkers = [];
        let fullTileLayer = null;
        let fullActiveCat = "all";
        let fullSearchText = "";
        let fullUserPos = null;
        let fullUserMarker = null;

        const FULL_LAYERS = {
            osm: {
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }
            },
            esriStreet: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
                options: { attribution: '&copy; Esri World Street Map', maxZoom: 19 }
            },
            satellite: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                options: { attribution: '&copy; Esri World Imagery', maxZoom: 19 }
            }
        };

        const SENSUN_EXACT_COORDS = {
            "arphotostudio": { lat: 13.873011, lng: -88.620773, name: "A&R Photo Studio", cat: "Fotografía", type: "negocioslocales" },
            "lasterrazas": { lat: 13.869501, lng: -88.619366, name: "Las Terrazas", cat: "Restaurante", type: "negocioslocales" },
            "neg-006": { lat: 13.878103, lng: -88.630060, name: "Comedor y Pupusería Gloria", cat: "Comida Típica", type: "negocioslocales" },
            "neg-005": { lat: 13.874233, lng: -88.628282, name: "Mr. Taco", cat: "Restaurante Mexicano", type: "negocioslocales" },
            "neg-004": { lat: 13.873753, lng: -88.628258, name: "Bistro Café La Bicicleta", cat: "Café & Bistro", type: "negocioslocales" },
            "neg-003": { lat: 13.876198, lng: -88.621559, name: "Lácteos Mamá Rosa", cat: "Comercio", type: "negocioslocales" },
            "disenograficopatrick": { lat: 13.878031, lng: -88.628745, name: "Diseño Gráfico Patrick", cat: "Diseño & Imprenta", type: "negocioslocales" },
            "emp-001": { lat: 13.875139, lng: -88.626428, name: "GIOSMARK", cat: "Tecnología", type: "emprendedores" },
            "emp-002": { lat: 13.876704, lng: -88.629354, name: "Multi Ideas Sv", cat: "Desarrollo Web", type: "emprendedores" },
            "drjuliocesarvelasco": { lat: 13.876388, lng: -88.630002, name: "Dr. Julio César Velasco Flores", cat: "Salud & Medicina", type: "profesionales" },
            "drhenrymartinez": { lat: 13.875842, lng: -88.628102, name: "Dr. Henry Martínez", cat: "Salud & Odontología", type: "profesionales" },
            "comandosdesalvamento": { lat: 13.8701498, lng: -88.6268186, name: "Comandos de Salvamento Sensuntepeque", cat: "Emergencias & Salvaguarda", type: "emergencias" }
        };

        function getFullCatVisuals(category, type) {
            const cat = (category || "").toLowerCase();
            const t = (type || "").toLowerCase();

            if (cat.includes("emergen") || t.includes("emergen") || cat.includes("salvamento") || cat.includes("socorro")) {
                return { icon: "🚨", color: "#ef4444", bg: "linear-gradient(135deg, #ef4444, #b91c1c)" };
            }
            if (cat.includes("comida") || cat.includes("gastro") || cat.includes("restaurante") || cat.includes("pupus") || cat.includes("taco") || cat.includes("cafe")) {
                return { icon: "🍕", color: "#ff6b35", bg: "linear-gradient(135deg, #ff6b35, #ea580c)" };
            }
            if (cat.includes("foto") || cat.includes("estudio") || cat.includes("artesani")) {
                return { icon: "📸", color: "#7b68ee", bg: "linear-gradient(135deg, #7b68ee, #6366f1)" };
            }
            if (cat.includes("salud") || cat.includes("medic") || cat.includes("odont") || cat.includes("ortodoncia")) {
                return { icon: "🩺", color: "#10b981", bg: "linear-gradient(135deg, #10b981, #059669)" };
            }
            if (cat.includes("tecno") || cat.includes("telef") || cat.includes("desarrollo") || cat.includes("web") || cat.includes("imprenta")) {
                return { icon: "💻", color: "#0284c7", bg: "linear-gradient(135deg, #0284c7, #0369a1)" };
            }
            if (cat.includes("diseno") || cat.includes("publicidad") || cat.includes("pintura") || cat.includes("rotul") || cat.includes("moda")) {
                return { icon: "🎨", color: "#ec4899", bg: "linear-gradient(135deg, #ec4899, #db2777)" };
            }
            if (t.includes("emprend")) {
                return { icon: "🚀", color: "#8b5cf6", bg: "linear-gradient(135deg, #8b5cf6, #7c3aed)" };
            }
            if (t.includes("profesion")) {
                return { icon: "🎓", color: "#3b82f6", bg: "linear-gradient(135deg, #3b82f6, #2563eb)" };
            }
            return { icon: "🏪", color: "#f59e0b", bg: "linear-gradient(135deg, #f59e0b, #d97706)" };
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatDist(meters) {
            return meters < 1000 ? `${Math.round(meters)} m` : `${(meters/1000).toFixed(1)} km`;
        }

        function initFullMap() {
            fullMap = L.map('sensunFullMap', {
                center: [13.8755, -88.6275],
                zoom: 16,
                zoomControl: true
            });

            changeFullMapLayer("osm");
            L.control.scale({ imperial: false, metric: true }).addTo(fullMap);
            renderFullMapData();
        }

        function changeFullMapLayer(layerKey) {
            if (!fullMap) return;
            if (fullTileLayer) fullMap.removeLayer(fullTileLayer);
            const cfg = FULL_LAYERS[layerKey] || FULL_LAYERS.osm;
            fullTileLayer = L.tileLayer(cfg.url, cfg.options).addTo(fullMap);
        }

        function getFullMapList() {
            let list = window.sensunBusinessesCache && window.sensunBusinessesCache.length > 0
                ? [...window.sensunBusinessesCache]
                : [];

            if (list.length === 0) {
                list = Object.keys(SENSUN_EXACT_COORDS).map(k => {
                    const c = SENSUN_EXACT_COORDS[k];
                    return {
                        id: k,
                        title: c.name,
                        category: c.cat,
                        type: c.type,
                        description: "Comercio en Sensuntepeque, Cabañas.",
                        coords: { lat: c.lat, lng: c.lng }
                    };
                });
            }

            list.forEach(b => {
                if (!b.coords || !b.coords.lat) {
                    const known = SENSUN_EXACT_COORDS[b.id];
                    if (known) b.coords = { lat: known.lat, lng: known.lng };
                }

                if (fullUserPos && b.coords && b.coords.lat) {
                    b.dist = calculateDistance(fullUserPos.lat, fullUserPos.lng, b.coords.lat, b.coords.lng);
                } else {
                    b.dist = null;
                }
            });

            return list.filter(b => b.coords && b.coords.lat);
        }

        function renderFullMapData() {
            if (!fullMap) return;

            fullMarkers.forEach(m => fullMap.removeLayer(m));
            fullMarkers = [];

            const list = getFullMapList();

            let filtered = list.filter(b => {
                let matchCat = true;
                if (fullActiveCat !== "all") {
                    const bCat = (b.category || "").toLowerCase();
                    const bType = (b.type || "").toLowerCase();
                    const fCat = fullActiveCat.toLowerCase();

                    if (fCat === "emprendedores") matchCat = bType.includes("emprend") || bCat.includes("emprend");
                    else if (fCat === "profesionales") matchCat = bType.includes("profesion") || bCat.includes("profesion");
                    else if (fCat === "emergencias") matchCat = bType.includes("emergen") || bCat.includes("emergen") || bCat.includes("salvamento") || bCat.includes("socorro") || bCat.includes("bomber");
                    else if (fCat === "servicios" || fCat === "oficios") matchCat = bType.includes("oficio") || bType.includes("servicio") || bCat.includes("oficio") || bCat.includes("servicio");
                    else if (fCat === "comida") matchCat = bCat.includes("comida") || bCat.includes("restauran") || bCat.includes("pupus") || bCat.includes("taco") || bCat.includes("cafe") || bCat.includes("panad") || bCat.includes("bistro");
                    else if (fCat === "comercio") matchCat = bCat.includes("comercio") || bCat.includes("tienda") || bCat.includes("lacteo") || bCat.includes("super");
                    else if (fCat === "salud") matchCat = bCat.includes("salud") || bCat.includes("medic") || bCat.includes("odont") || bCat.includes("doctor") || bCat.includes("farmac");
                    else if (fCat === "fotografia") matchCat = bCat.includes("foto") || bCat.includes("estudio");
                    else if (fCat === "tecnologia") matchCat = bCat.includes("tecno") || bCat.includes("web") || bCat.includes("desarrollo");
                    else if (fCat === "diseno") matchCat = bCat.includes("disen") || bCat.includes("imprent") || bCat.includes("publicid");
                    else if (fCat === "mascotas") matchCat = bCat.includes("mascot") || bCat.includes("veterin");
                    else if (fCat === "belleza") matchCat = bCat.includes("bellez") || bCat.includes("barber") || bCat.includes("salon");
                    else {
                        const normBCat = bCat.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
                        matchCat = normBCat.includes(fCat) || bCat.includes(fCat) || bType.includes(fCat);
                    }
                }

                let matchSearch = true;
                if (fullSearchText.trim() !== "") {
                    const q = fullSearchText.toLowerCase();
                    matchSearch = (b.title||"").toLowerCase().includes(q) || (b.category||"").toLowerCase().includes(q) || (b.description||"").toLowerCase().includes(q);
                }

                return matchCat && matchSearch;
            });

            if (fullUserPos) {
                filtered.sort((a, b) => (a.dist || Infinity) - (b.dist || Infinity));
            }

            filtered.forEach(b => {
                const visuals = getFullCatVisuals(b.category, b.type);
                const pinIcon = L.divIcon({
                    className: 'sensun-custom-pin-node',
                    html: `
                        <div class="sensun-full-pin" style="background: ${visuals.bg};">
                            <div class="sensun-full-pin-inner">${visuals.icon}</div>
                        </div>
                    `,
                    iconSize: [40, 40],
                    iconAnchor: [20, 40],
                    popupAnchor: [0, -38]
                });

                const marker = L.marker([b.coords.lat, b.coords.lng], { icon: pinIcon }).addTo(fullMap);

                marker.bindTooltip(`<b>${b.title}</b><br><small style="color: ${visuals.color}; font-weight: 700;">${visuals.icon} ${b.category || b.type}</small>`, {
                    direction: 'top',
                    offset: [0, -38]
                });

                const thumb = b.imgSrc ? `<div style="width: 100%; height: 115px; border-radius: 12px; overflow: hidden; margin-bottom: 8px;"><img src="${b.imgSrc}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.parentElement.style.display='none'"></div>` : '';
                const distTag = b.dist !== null ? `<div style="background: rgba(2, 132, 199, 0.15); color: #0284c7; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; margin-bottom: 8px;">📍 A ${formatDist(b.dist)} de ti</div>` : '';
                const wspBtn = b.whatsapp ? `<a href="https://wa.me/${b.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent('Hola ' + b.title + ', los vi en el mapa de Sensun Shop')}" target="_blank" style="flex: 1; text-align: center; background: #25D366; color: white; padding: 7px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 700; text-decoration: none;">💬 WhatsApp</a>` : '';
                const mapBtn = b.locationUrl ? `<a href="${b.locationUrl}" target="_blank" style="flex: 1; text-align: center; background: #0284c7; color: white; padding: 7px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 700; text-decoration: none;">🗺️ Cómo Llegar</a>` : '';

                marker.bindPopup(`
                    <div style="font-family: 'Poppins', sans-serif; min-width: 220px; max-width: 270px; padding: 2px;">
                        ${thumb}
                        <span style="font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: ${visuals.color};">${visuals.icon} ${b.category || b.type}</span>
                        <h3 style="margin: 3px 0 6px 0; font-size: 15px; font-weight: 800; color: #1e293b; line-height: 1.25;">${b.title}</h3>
                        ${distTag}
                        <p style="margin: 0 0 10px 0; font-size: 11.5px; color: #64748b; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${b.description || 'Comercio activo en Sensuntepeque.'}</p>
                        <div style="display: flex; gap: 6px;">${mapBtn} ${wspBtn}</div>
                    </div>
                `);

                marker.bizId = b.id;
                fullMarkers.push(marker);
            });

            renderFullSidebar(filtered);
        }

        function renderFullSidebar(list) {
            const container = document.getElementById("fullMapSidebarList");
            const countText = document.getElementById("fullMapCountText");
            if (countText) countText.textContent = `${list.length} comercio${list.length !== 1 ? 's' : ''} disponible${list.length !== 1 ? 's' : ''}`;

            if (!container) return;

            if (list.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 15px; color: #94a3b8; font-size: 13px;">
                        <div style="font-size: 32px; margin-bottom: 6px;">🔍</div>
                        <p style="margin: 0; font-weight: 600;">No hay resultados</p>
                        <small style="color: #64748b;">Prueba con otra categoría o búsqueda</small>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(b => {
                const visuals = getFullCatVisuals(b.category, b.type);
                const thumb = b.imgSrc 
                    ? `<img src="${b.imgSrc}" alt="${b.title}" onerror="this.parentElement.innerHTML='${visuals.icon}'">`
                    : visuals.icon;
                const distBadge = b.dist !== null ? `<span class="fullmap-dist-pill">📍 ${formatDist(b.dist)}</span>` : '';

                return `
                    <div class="fullmap-item-card" onclick="focusFullBusiness('${b.id}')">
                        <div class="fullmap-item-thumb">${thumb}</div>
                        <div class="fullmap-item-info">
                            <div class="fullmap-item-title">${b.title}</div>
                            <div class="fullmap-item-sub">
                                <span style="color: ${visuals.color}; font-weight: 700;">${visuals.icon} ${b.category || b.type}</span>
                                ${distBadge}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function focusFullBusiness(bizId) {
            if (!fullMap) return;
            const marker = fullMarkers.find(m => m.bizId === bizId);
            if (marker) {
                fullMap.flyTo(marker.getLatLng(), 17, { duration: 0.8 });
                setTimeout(() => marker.openPopup(), 450);
            }
        }

        const BASE_MAP_CATEGORIES = [
            { id: "all", name: "Todos", icon: "🌟" },
            { id: "comida", name: "Comida & Restaurantes", icon: "🍕" },
            { id: "comercio", name: "Comercio", icon: "🏪" },
            { id: "salud", name: "Salud & Medicina", icon: "🩺" },
            { id: "emergencias", name: "Emergencias", icon: "🚨" },
            { id: "emprendedores", name: "Emprendedores", icon: "🚀" },
            { id: "profesionales", name: "Profesionales", icon: "🎓" },
            { id: "servicios", name: "Oficios & Servicios", icon: "🛠️" },
            { id: "fotografia", name: "Fotografía", icon: "📸" },
            { id: "tecnologia", name: "Tecnología & Web", icon: "💻" },
            { id: "diseno", name: "Diseño & Imprenta", icon: "🎨" },
            { id: "mascotas", name: "Mascotas & Veterinaria", icon: "🐾" },
            { id: "belleza", name: "Belleza & Barbería", icon: "💈" }
        ];

        function renderCategoryCarousel() {
            const container = document.getElementById("fullMapCategoryPills");
            if (!container) return;

            const list = getFullMapList();
            const catMap = new Map();

            // 1. Categorías base universales
            BASE_MAP_CATEGORIES.forEach(c => {
                catMap.set(c.id, { id: c.id, name: c.name, icon: c.icon });
            });

            // 2. Extraer categorías únicas descubiertas desde comercios
            list.forEach(b => {
                const rawCat = (b.category || "").trim();
                if (rawCat) {
                    const normId = rawCat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
                    let alreadyCovered = false;
                    for (const [k] of catMap) {
                        if (k !== "all" && (normId.includes(k) || k.includes(normId))) {
                            alreadyCovered = true;
                            break;
                        }
                    }
                    if (!alreadyCovered && normId.length >= 3) {
                        const visuals = getFullCatVisuals(rawCat, b.type);
                        catMap.set(normId, { id: normId, name: rawCat, icon: visuals.icon, isCustom: true, query: rawCat.toLowerCase() });
                    }
                }
            });

            // 3. Renderizar botones en la pista
            container.innerHTML = Array.from(catMap.values()).map(cat => {
                const isActive = fullActiveCat === cat.id;
                return `
                    <button type="button" 
                            class="fullmap-cat-btn ${isActive ? 'active' : ''}" 
                            data-cat="${cat.id}"
                            onclick="setFullMapCategory('${cat.id}', this)"
                            role="tab"
                            aria-selected="${isActive}">
                        <span>${cat.icon}</span> <span>${cat.name}</span>
                    </button>
                `;
            }).join('');

            updateCarouselArrows();
        }

        function setFullMapCategory(cat, targetBtn) {
            fullActiveCat = cat;
            const container = document.getElementById("fullMapCategoryPills");
            if (container) {
                container.querySelectorAll(".fullmap-cat-btn").forEach(p => {
                    const isMatch = p.getAttribute("data-cat") === cat;
                    p.classList.toggle("active", isMatch);
                    p.setAttribute("aria-selected", isMatch ? "true" : "false");
                    if (isMatch) {
                        p.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                });
            }
            renderFullMapData();
        }

        function initCategoryCarouselControls() {
            const track = document.getElementById("fullMapCategoryPills");
            const btnPrev = document.getElementById("fullmapCatPrev");
            const btnNext = document.getElementById("fullmapCatNext");
            if (!track) return;

            // 1. Flechas laterales
            if (btnPrev) {
                btnPrev.addEventListener("click", () => {
                    track.scrollBy({ left: -260, behavior: "smooth" });
                    setTimeout(updateCarouselArrows, 320);
                });
            }

            if (btnNext) {
                btnNext.addEventListener("click", () => {
                    track.scrollBy({ left: 260, behavior: "smooth" });
                    setTimeout(updateCarouselArrows, 320);
                });
            }

            // 2. Desplazamiento horizontal con el rodillo del ratón (Mouse Wheel)
            track.addEventListener("wheel", (e) => {
                if (Math.abs(e.deltaY) > 0) {
                    e.preventDefault();
                    track.scrollLeft += e.deltaY * 1.3;
                    updateCarouselArrows();
                }
            }, { passive: false });

            // 3. Deslizamiento por arrastre con el ratón (Drag to Scroll)
            let isDown = false;
            let startX = 0;
            let scrollLeftStart = 0;

            track.addEventListener("mousedown", (e) => {
                isDown = true;
                track.classList.add("is-dragging");
                startX = e.pageX - track.offsetLeft;
                scrollLeftStart = track.scrollLeft;
            });

            window.addEventListener("mouseup", () => {
                if (isDown) {
                    isDown = false;
                    track.classList.remove("is-dragging");
                }
            });

            track.addEventListener("mousemove", (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - track.offsetLeft;
                const walk = (x - startX) * 1.6;
                track.scrollLeft = scrollLeftStart - walk;
                updateCarouselArrows();
            });

            // 4. Actualizar estado de las flechas
            track.addEventListener("scroll", updateCarouselArrows, { passive: true });
            window.addEventListener("resize", updateCarouselArrows);
        }

        function updateCarouselArrows() {
            const track = document.getElementById("fullMapCategoryPills");
            const btnPrev = document.getElementById("fullmapCatPrev");
            const btnNext = document.getElementById("fullmapCatNext");
            if (!track || !btnPrev || !btnNext) return;

            const maxScroll = track.scrollWidth - track.clientWidth;
            if (maxScroll <= 5) {
                btnPrev.style.display = "none";
                btnNext.style.display = "none";
            } else {
                btnPrev.style.display = "inline-flex";
                btnNext.style.display = "inline-flex";
                btnPrev.disabled = track.scrollLeft <= 5;
                btnNext.disabled = track.scrollLeft >= maxScroll - 5;
            }
        }

        function onFullMapSearch(text) {
            fullSearchText = text;
            renderFullMapData();
        }

        function triggerFullMapGps() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            const btn = document.getElementById("btnFullGps");
            const lbl = document.getElementById("fullGpsLabel");
            if (lbl) lbl.textContent = "Ubicando...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    fullUserPos = { lat: latitude, lng: longitude };

                    if (btn) btn.classList.add("active-gps");
                    if (lbl) lbl.textContent = "Ubicado ✅";

                    if (fullMap) {
                        if (fullUserMarker) fullMap.removeLayer(fullUserMarker);

                        const uIcon = L.divIcon({
                            className: 'sensun-user-pin-wrap',
                            html: `<div class="sensun-user-pin" title="Tu posición actual"></div>`,
                            iconSize: [24, 24],
                            iconAnchor: [12, 12]
                        });

                        fullUserMarker = L.marker([latitude, longitude], { icon: uIcon }).addTo(fullMap);
                        fullUserMarker.bindPopup("<b>📍 Estás aquí</b><br><small>Mostrando comercios más cercanos</small>").openPopup();

                        fullMap.flyTo([latitude, longitude], 16, { duration: 1.2 });
                    }

                    renderFullMapData();
                },
                (err) => {
                    if (lbl) lbl.textContent = "Mi Ubicación";
                    alert("Por favor permite el acceso al GPS para encontrar negocios cercanos.");
                },
                { enableHighAccuracy: true, timeout: 9000 }
            );
        }

        function recenterFullMap() {
            if (fullMap) fullMap.setView([13.8755, -88.6275], 16);
        }

        function fitFullMapAllMarkers() {
            if (!fullMap || fullMarkers.length === 0) return;
            const group = L.featureGroup(fullMarkers);
            fullMap.fitBounds(group.getBounds().pad(0.12));
        }

        document.addEventListener("DOMContentLoaded", () => {
            initFullMap();
            renderCategoryCarousel();
            initCategoryCarouselControls();
            document.addEventListener("sensun-businesses-updated", () => {
                renderCategoryCarousel();
                renderFullMapData();
            });
        });
    </script>
</body>

</html>
